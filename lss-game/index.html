<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lean Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one game "device" column — title screen, a winding town map, then full-width level stages with a chunky HUD. Single bright cartoon world on purpose (no dark variant). */
:root{
  --ink:#2B2140; --sky:#8FD3FF; --sky-deep:#4FA9E8; --grass:#7CCB5B; --sun:#FFD166; --red:#EF476F;
  --teal:#06D6A0; --blue:#118AB2; --orange:#FF9F1C; --cream:#FFF7E6; --purple:#7B5CFF; --stone:#B8B2C8;
  --f-game:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--sky-deep);
  background-image:radial-gradient(circle at 20% 10%,#ffffff22 0 60px,transparent 61px),radial-gradient(circle at 85% 30%,#ffffff1a 0 90px,transparent 91px);
  color:var(--ink); font:600 16px/1.45 var(--f-body);
  padding-inline:16px; padding-block:12px 40px; min-height:100%;
}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.game{max-width:900px;margin:0 auto;display:grid;gap:12px}

/* Buttons */
.btn{font:400 22px/1 var(--f-game);letter-spacing:.02em;padding:14px 26px;border:3px solid var(--ink);border-radius:18px;background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--teal)} .btn.red{background:var(--red);color:#fff} .btn.white{background:#fff} .btn.small{font-size:16px;padding:9px 14px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn.small:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;box-shadow:0 5px 0 var(--ink)}
.hud .lvl{font:400 18px/1.1 var(--f-game);flex:1 1 140px;min-width:0}
.hud .lvl small{display:block;font:800 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#6B5F80}
.hearts{display:flex;gap:2px}
.hearts svg{width:26px;height:24px}
.coins{display:flex;align-items:center;gap:6px;font:400 20px/1 var(--f-game);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px}
.coins svg{width:24px;height:24px}
.timer{flex:1 1 120px;height:18px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;min-width:90px}
.timer i{display:block;height:100%;width:100%;background:var(--teal);transition:width .25s linear}
.timer.low i{background:var(--red)}
.icon-btn{width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.icon-btn svg{width:24px;height:24px}

/* Cards / stage */
.card{background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px;min-width:0}
.stage{border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--ink);background:var(--sky);position:relative}
.stage svg{display:block;width:100%;height:auto}
.say{display:flex;gap:12px;align-items:center;font-weight:800}
.say .bubble{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;position:relative;flex:1;min-width:0}
.say svg{width:56px;height:56px;flex:none}

/* Title */
.title-wrap{text-align:center;display:grid;gap:14px;justify-items:center}
.logo{font:400 clamp(54px,13vw,104px)/.9 var(--f-game);color:var(--sun);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);letter-spacing:.02em;margin:6px 0 0}
.logo span{color:#fff}
.tagline{font:800 18px/1.3 var(--f-body);color:#fff;text-shadow:0 2px 0 var(--ink);margin:0}

/* Map */
.stage.map{max-width:600px;width:100%;justify-self:center;background:var(--grass)}
.map svg .node{cursor:pointer}
.map svg .node:focus-visible circle.ring{stroke:var(--sun);stroke-width:8}
.map svg .node.locked{cursor:not-allowed}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 13px/1 var(--f-body);background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:6px 10px}
.chip i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}

/* Spot the waste */
.hit{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:4;stroke-dasharray:10 8}
.hit:hover,.hit:focus-visible{stroke:#fff;outline:none}
.hit.done{cursor:default;stroke:none}
.found{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.found .chip.ok{background:var(--teal)}
.found .chip.empty{opacity:.55;border-style:dashed}

/* Modal */
.modal{position:fixed;inset:0;background:#2B214099;display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}
.modal .card{max-width:480px;width:100%;display:grid;gap:14px;text-align:center;animation:pop .25s ease}
.modal h2{font:400 34px/1 var(--f-game);margin:0;color:var(--ink)}
.modal p{margin:0}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-weight:800}
.choice small{display:block;font-weight:600;color:#6B5F80}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice.bad{background:#FFD3DC;opacity:.6}
.choice .dot{width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);flex:none;display:grid;place-items:center;font:400 18px/1 var(--f-game);color:#fff;-webkit-text-stroke:1px var(--ink)}
.stars{display:flex;justify-content:center;gap:8px}
.stars svg{width:64px;height:64px}
.stars svg.on{animation:pop .4s ease both}
.tool-badge{justify-self:center;font:400 16px/1 var(--f-game);background:var(--purple);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 16px}
.kind{justify-self:center}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}

/* 5S */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center;font:400 13px/1.1 var(--f-game);opacity:.5}
.steps div b{display:block;font-size:20px;font-weight:400}
.steps div.on{background:var(--sun);opacity:1}
.steps div.done{background:var(--teal);opacity:1}
@media (max-width:480px){.steps div{font-size:10px}.steps div b{font-size:16px}}
.sort{display:grid;gap:14px;justify-items:center;text-align:center}
.item-card{width:200px;max-width:100%;aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:24px;display:grid;place-items:center;box-shadow:0 6px 0 var(--ink)}
.item-card svg{width:70%;height:70%}
.item-name{font:400 24px/1.1 var(--f-game)}
.bins{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.board{position:relative;border:3px solid var(--ink);border-radius:20px;padding:18px 18px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;box-shadow:inset 0 0 0 6px #00000014,0 6px 0 var(--ink)}
.board.wood{background:#E2A867;background-image:repeating-linear-gradient(90deg,#00000010 0 2px,transparent 2px 60px)}
.board.steel{background:#C9D6E3;background-image:repeating-linear-gradient(0deg,#ffffff40 0 2px,transparent 2px 40px)}
.slot{aspect-ratio:1;border:3px dashed #2B214066;border-radius:16px;display:grid;place-items:center;position:relative;background:#ffffff30;min-width:0}
.slot svg{width:78%;height:78%}
.slot .shadow *{fill:#2B214040!important;stroke:none!important}
.slot.filled{border-style:solid;border-color:var(--ink);background:#ffffff80}
.slot.target{background:#fff}
.slot .label{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 11px/1 var(--f-body);background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:3px 6px;max-width:112%;overflow:hidden;text-overflow:ellipsis}
.tray{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:96px;padding:10px;border:3px dashed #fff;border-radius:18px;background:#ffffff26}
.piece{width:86px;height:86px;background:#fff;border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center;cursor:grab;touch-action:none;box-shadow:0 4px 0 var(--ink)}
.piece svg{width:78%;height:78%;pointer-events:none}
.piece[aria-pressed="true"]{background:var(--sun)}
.ghost{position:fixed;z-index:30;pointer-events:none;width:86px;height:86px;transform:translate(-50%,-50%) scale(1.1);background:#fff;border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center;box-shadow:0 10px 20px #0004}
.ghost svg{width:78%;height:78%}
.dirt{position:absolute;width:15%;aspect-ratio:1;border-radius:50% 40% 55% 45%;background:radial-gradient(circle at 40% 40%,#8A6038,#5B3A1E);border:3px solid var(--ink);cursor:pointer;transform:translate(-50%,-50%);transition:opacity .2s,transform .2s;padding:0}
.dirt.half{opacity:.45;transform:translate(-50%,-50%) scale(.8)}
@media (max-width:520px){.board{gap:8px;padding:12px 12px 20px}.piece{width:70px;height:70px}}

/* 5 Whys */
.dig{display:grid;border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.layer{padding:14px 66px 14px 70px;position:relative;min-height:74px;display:grid;gap:10px;align-content:center;border-top:3px solid #2B214055}
.layer .num{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font:400 15px/1 var(--f-game)}
.layer.done .num{background:var(--teal)}
.layer .q{font:400 22px/1.1 var(--f-game);color:#fff;text-shadow:0 2px 0 var(--ink)}
.layer .ans{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:800;justify-self:start}
.layer.locked{color:#ffffff88;font:400 20px/1 var(--f-game)}
.rocks{display:flex;flex-wrap:wrap;gap:10px}
.rock{background:linear-gradient(160deg,#ECE8F5,#A9A2BC);border:3px solid var(--ink);border-radius:38% 52% 44% 58% / 52% 40% 60% 46%;padding:12px 18px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink);text-align:left;max-width:100%}
.rock:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rock.cracked{background:linear-gradient(160deg,#FFC2CF,#EF476F);opacity:.75}
.rock.cracked>span:first-child{text-decoration:line-through}
.rock .why{display:block;font:900 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
.chest{background:#3B2414;color:#fff;padding:18px;display:grid;gap:10px;justify-items:center;text-align:center;min-height:120px;align-content:center}
.chest svg{width:96px;height:80px}
.chest b{font:400 22px/1.15 var(--f-game);color:var(--sun);font-weight:400}
.driller{position:absolute;right:10px;top:50%;width:48px;height:48px;transform:translateY(-50%)}
@media (max-width:520px){.layer{padding:12px 12px 12px 64px}.driller{display:none}}

/* FX */
.float{position:fixed;z-index:40;font:400 26px/1 var(--f-game);color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;pointer-events:none;transform:translate(-50%,0);animation:floatUp .9s ease-out forwards}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-weight:800;box-shadow:0 5px 0 var(--ink);width:max-content;max-width:min(92vw,520px);text-align:center}
.toast.bad{background:#FFD3DC} .toast.good{background:#C9F7E6}
@keyframes floatUp{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(-58px)}}
@keyframes walkLong{0%,100%{transform:translateX(0)}50%{transform:translateX(300px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drive{from{transform:translateX(-180px)}to{transform:translateX(980px)}}
@keyframes drill{0%,100%{transform:translateY(-50%) rotate(-8deg)}50%{transform:translateY(-44%) rotate(8deg)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-40px) scale(1.4);opacity:0}}
.shake{animation:shake .35s ease}
.walk{animation:walk 3s ease-in-out infinite}
.walk-long{animation:walkLong 7s ease-in-out infinite}
.bob{animation:bob 1.6s ease-in-out infinite}
.drive{animation:drive 9s linear infinite}
.drive.slow{animation-duration:14s;animation-delay:-5s}
.puff{animation:puff 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.puff.d2{animation-delay:.6s}.puff.d3{animation-delay:1.2s}
.driller{animation:drill .5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.walk,.walk-long,.bob,.drive,.puff,.driller,.shake,.float,.modal .card,.stars svg.on{animation:none!important}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="hud" id="hud" hidden>
    <button class="icon-btn" type="button" id="btn-map" aria-label="Back to map"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#2B2140" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="lvl" id="hud-lvl"></div>
    <div class="hearts" id="hud-hearts" aria-label="Hearts"></div>
    <div class="timer" id="hud-timer" hidden><i></i></div>
    <div class="coins" id="hud-coins"></div>
    <button class="icon-btn" type="button" id="btn-sound" aria-label="Sound on or off"></button>
  </div>
  <div id="screen"></div>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const O = "#2B2140";
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ================= SAVE ================= */
const KEY="lean-town-v1";
let SAVE = {stars:{}, coins:0, muted:false};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.stars) SAVE=Object.assign(SAVE,s); }catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(SAVE)); }catch(e){} }

/* ================= SOUND ================= */
let AC=null;
function sfx(type){
  if(SAVE.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {good:[[660,.08],[880,.14]], bad:[[196,.12],[147,.2]], coin:[[988,.06],[1319,.12]], win:[[523,.11],[659,.11],[784,.11],[1047,.3]], lose:[[392,.15],[330,.15],[262,.3]], tap:[[520,.04]]}[type];
    let t = AC.currentTime;
    seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type = type==="bad"||type==="lose" ? "square" : "triangle"; o.frequency.value=f; g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d; });
  }catch(e){}
}

/* ================= SPRITES ================= */
function person(o){
  const {x=0,y=0,s=1,skin="#F2C29B",shirt="#118AB2",pants="#3D405B",hair="#3B2A20",kind="plain",face="happy",flip=false,hold=null,long=false} = o;
  const st = `stroke="${O}" stroke-width="3" stroke-linejoin="round"`;
  const sleeve = kind==="doctor" ? "#fff" : shirt;
  const legC = kind==="nurse" ? shirt : pants;
  let g = "";
  g += `<rect x="-15" y="-38" width="12" height="38" rx="6" fill="${legC}" ${st}/><rect x="3" y="-38" width="12" height="38" rx="6" fill="${legC}" ${st}/>`;
  g += `<rect x="-19" y="-6" width="17" height="9" rx="4.5" fill="${O}"/><rect x="2" y="-6" width="17" height="9" rx="4.5" fill="${O}"/>`;
  g += `<rect x="-29" y="-78" width="12" height="38" rx="6" fill="${sleeve}" ${st}/><circle cx="-23" cy="-40" r="6" fill="${skin}" ${st}/>`;
  if(long) g += `<rect x="-19" y="-104" width="38" height="44" rx="12" fill="${hair}" ${st}/>`;
  g += `<rect x="-20" y="-82" width="40" height="50" rx="14" fill="${shirt}" ${st}/>`;
  if(kind==="doctor"){
    g += `<path d="M-20 -68 Q-20 -82 -6 -82 L-2 -82 L-2 -32 L-20 -32Z M20 -68 Q20 -82 6 -82 L2 -82 L2 -32 L20 -32Z" fill="#fff" ${st}/>`;
    g += `<path d="M-8 -80 Q-12 -58 0 -54 Q12 -58 8 -80" fill="none" stroke="${O}" stroke-width="2.5"/><circle cx="0" cy="-52" r="4" fill="#9AA5B1" stroke="${O}" stroke-width="2"/>`;
  }
  if(kind==="nurse") g += `<rect x="4" y="-72" width="10" height="7" rx="2" fill="#fff" stroke="${O}" stroke-width="2"/>`;
  if(hold){
    g += `<rect x="16" y="-78" width="12" height="36" rx="6" fill="${sleeve}" ${st} transform="rotate(-75 22 -74)"/><circle cx="56" cy="-66" r="6" fill="${skin}" ${st}/>`;
    if(hold==="cup") g += `<path d="M50 -88 L66 -88 L63 -68 L53 -68Z" fill="#fff" ${st}/><rect x="49" y="-92" width="18" height="5" rx="2" fill="#7A4A2A" stroke="${O}" stroke-width="2"/>`;
  } else {
    g += `<rect x="17" y="-78" width="12" height="38" rx="6" fill="${sleeve}" ${st}/><circle cx="23" cy="-40" r="6" fill="${skin}" ${st}/>`;
  }
  g += `<circle cx="0" cy="-98" r="17" fill="${skin}" ${st}/>`;
  g += `<path d="M-17 -98 Q-18 -117 0 -117 Q18 -117 17 -98 Q10 -108 -4 -106 Q-12 -104 -17 -98Z" fill="${hair}" ${st}/>`;
  if(kind==="nurse") g += `<path d="M-12 -114 L12 -114 L9 -124 L-9 -124Z" fill="#fff" ${st}/><path d="M0 -122 v6 M-3 -119 h6" stroke="#EF476F" stroke-width="2.5"/>`;
  if(face==="sleep") g += `<path d="M-9 -97 h6 M3 -97 h6" stroke="${O}" stroke-width="2.5" stroke-linecap="round"/><path d="M-5 -88 Q0 -86 5 -88" fill="none" stroke="${O}" stroke-width="2.5" stroke-linecap="round"/>`;
  else {
    g += `<circle cx="-6" cy="-98" r="2.6" fill="${O}"/><circle cx="6" cy="-98" r="2.6" fill="${O}"/>`;
    g += face==="sad" ? `<path d="M-6 -86 Q0 -92 6 -86" fill="none" stroke="${O}" stroke-width="2.5" stroke-linecap="round"/>` : face==="wow" ? `<circle cx="0" cy="-88" r="3.5" fill="${O}"/>` : `<path d="M-7 -90 Q0 -83 7 -90" fill="none" stroke="${O}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})">${g}</g>`;
}
function seated(o){
  const {x=0,y=0,s=1,skin="#F2C29B",shirt="#FF9F1C",pants="#3D405B",hair="#3B2A20",face="sad"} = o;
  const st = `stroke="${O}" stroke-width="3" stroke-linejoin="round"`;
  let g = `<rect x="-6" y="-40" width="36" height="13" rx="6" fill="${pants}" ${st}/><rect x="20" y="-40" width="12" height="40" rx="6" fill="${pants}" ${st}/><rect x="18" y="-6" width="18" height="9" rx="4.5" fill="${O}"/>`;
  g += `<rect x="-20" y="-88" width="38" height="52" rx="14" fill="${shirt}" ${st}/><rect x="8" y="-82" width="12" height="32" rx="6" fill="${shirt}" ${st}/><circle cx="14" cy="-50" r="6" fill="${skin}" ${st}/>`;
  g += `<circle cx="0" cy="-104" r="17" fill="${skin}" ${st}/><path d="M-17 -104 Q-18 -123 0 -123 Q18 -123 17 -104 Q10 -114 -4 -112 Q-12 -110 -17 -104Z" fill="${hair}" ${st}/>`;
  if(face==="sleep") g += `<path d="M-9 -103 h6 M3 -103 h6" stroke="${O}" stroke-width="2.5" stroke-linecap="round"/>`;
  else g += `<circle cx="-6" cy="-104" r="2.6" fill="${O}"/><circle cx="6" cy="-104" r="2.6" fill="${O}"/>`;

let R = null;

function hudShow(on){ $("#hud").hidden = !on; }
function hideToast(){ clearTimeout(toast.t); $("#toast").hidden = true; }
function hudUpdate(){
  if(!R) return;
  $("#hud-hearts").innerHTML = [0,1,2].map(i=>heart(i<R.hearts)).join("");
  $("#hud-coins").innerHTML = coinSvg + `<span>${SAVE.coins + R.coins}</span>`;
  const t = $("#hud-timer");
  if(R.time){ t.hidden = false; const pct = Math.max(0,R.left/R.time*100); t.querySelector("i").style.width = pct+"%"; t.classList.toggle("low", pct<25); }
  else t.hidden = true;

function soundIcon(){ $("#btn-sound").innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#FFD166" stroke="${O}" stroke-width="2" stroke-linejoin="round"/>${SAVE.muted?`<path d="M16 9l5 6M21 9l-5 6" stroke="${O}" stroke-width="2.5" stroke-linecap="round"/>`:`<path d="M16 8q3 4 0 8M18.5 5.5q5 6.5 0 13" fill="none" stroke="${O}" stroke-width="2.2" stroke-linecap="round"/>`}</svg>`; }

function floatText(txt, x, y){
  const f = document.createElement("div"); f.className="float"; f.textContent=txt;
  f.style.left = x+"px"; f.style.top = y+"px"; document.body.appendChild(f);
  setTimeout(()=>f.remove(), 950);
}
function toast(msg, kind=""){
  const t = $("#toast"); t.className = "toast "+kind; t.innerHTML = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.hidden=true, 2800);
}
function shake(el){ if(reduce||!el) return; el.classList.remove("shake"); void el.getBoundingClientRect(); el.classList.add("shake"); }

function addCoins(n, ev){
  R.coins += n; sfx("coin"); hudUpdate();
  const p = ev && ev.clientX ? [ev.clientX, ev.clientY] : [innerWidth/2, innerHeight/2];
  floatText("+"+n, p[0], p[1]);
}
function loseHeart(){
  R.hearts--; sfx("bad"); hudUpdate(); shake($("#hud-hearts"));
  if(R.hearts<=0){ R.paused = true; setTimeout(()=>endLevel(false,"Out of hearts!"), 600); return true; }
  return false;
}

function openModal(html){ const m=$("#modal"); m.innerHTML = `<div class="card">${html}</div>`; m.hidden=false; if(R) R.paused=true; const b=m.querySelector("button"); if(b) b.focus({preventScroll:true}); }
function closeModal(){ $("#modal").hidden=true; $("#modal").innerHTML=""; if(R && !R.over && R.hearts>0) R.paused=false; }

function stopTimer(){ clearInterval(timerId); timerId=null; }
function startTimer(){
  stopTimer();
  timerId = setInterval(()=>{
    if(!R || R.paused || R.over) return;
    R.left -= .25; hudUpdate();
    if(R.left<=0){ R.left=0; endLevel(false,"Time's up!"); }
  }, 250);
}

  $("#back").onclick = ()=>{ mapScreen(); };
}

function startLevel(){
  hudShow(true);

  hudUpdate();

  window.scrollTo({top:0});
}

function endLevel(win, reason){
  if(!R || R.over) return;
  R.over = true; R.paused = true; stopTimer();
  const L = R.level, T = TOOLS[L.tool];
  if(win){
    const stars = Math.max(1, R.hearts);
    const bonus = stars*20;
    R.coins += bonus;
    SAVE.coins += R.coins;
    SAVE.stars[L.id] = Math.max(SAVE.stars[L.id]||0, stars);
    persist(); sfx("win");
    const next = R.i < LEVELS.length-1 ? R.i+1 : -1;
    openModal(`<h2>LEVEL CLEAR!</h2>
      <div class="stars">${[0,1,2].map(k=>starSvg(k<stars, k<stars?"on":"")).join("")}</div>
      <p><b>+${R.coins} coins</b> (including a ${bonus}-coin star bonus)</p>
      <div class="say" style="text-align:left"><div>${mascot("happy")}</div><div class="bubble"><b>${T.name}:</b> ${T.key}</div></div>
      <div class="btn-row"><button class="btn green" type="button" id="next">${next>=0?"NEXT LEVEL":"BACK TO TOWN"}</button><button class="btn white small" type="button" id="replay">Replay</button><button class="btn white small" type="button" id="map">Map</button></div>`);
    document.querySelectorAll("#modal .stars svg.on").forEach((s,k)=>s.style.animationDelay=(k*.25)+"s");
    $("#next").onclick = ()=>{ next>=0 ? intro(next) : mapScreen(); };
  } else {
    sfx("lose");
    openModal(`<h2>${esc(reason)}</h2>
      <div class="stars">${[0,1,2].map(()=>starSvg(false)).join("")}</div>
      <div class="say" style="text-align:left"><div>${mascot("sad")}</div><div class="bubble">No problem. Every expert failed first. Try again!</div></div>
      <div class="btn-row"><button class="btn green" type="button" id="replay">TRY AGAIN</button><button class="btn white small" type="button" id="map">Map</button></div>`);
  }
  const idx = R.i;
  $("#replay").onclick = ()=>intro(idx);
  $("#map").onclick = ()=>mapScreen();
}

/* ================= GAME 1: SPOT THE WASTE ================= */
function playWaste(){
  const sc = SCENES[R.level.id];
  R.found = new Set(); R.seenDecoy = new Set();
  let hits = "";
  sc.spots.forEach(s=> hits += `<rect class="hit" data-k="${s.id}" x="${s.hit[0]}" y="${s.hit[1]}" width="${s.hit[2]}" height="${s.hit[3]}" rx="16" tabindex="0" role="button" aria-label="Inspect this"/>`);
  sc.decoys.forEach(s=> hits += `<rect class="hit" data-d="${s.id}" x="${s.hit[0]}" y="${s.hit[1]}" width="${s.hit[2]}" height="${s.hit[3]}" rx="16" tabindex="0" role="button" aria-label="Inspect this"/>`);
  $("#screen").innerHTML = `
    <div class="say"><div>${mascot("happy")}</div><div class="bubble">Find <b>${sc.spots.length} wastes</b> before time runs out. Careful: some things are <b>value</b>, not waste!</div></div>
    <div class="stage" id="scene"><svg viewBox="0 0 800 500" role="img" aria-label="${esc(R.level.name)} scene">${sc.draw()}<g id="tags"></g>${hits}</svg></div>
    <div class="card found" id="found"></div>`;
  renderFound();
  const svg = $("#scene svg");
  const act = (el, ev) => {
    if(R.over || R.paused) return;
    if(el.dataset.k){ const s = sc.spots.find(x=>x.id===el.dataset.k); if(!R.found.has(s.id)) classify(s, el, ev); }
    else if(el.dataset.d && !R.seenDecoy.has(el.dataset.d)){
      const d = sc.decoys.find(x=>x.id===el.dataset.d); R.seenDecoy.add(d.id);
      addTag(d.hit, "VALUE ✓", "#06D6A0"); el.classList.add("done");
      toast(d.why, "bad"); loseHeart();
    }
  };
  svg.addEventListener("click", e=>{ const h=e.target.closest(".hit"); if(h) act(h,e); });
  svg.addEventListener("keydown", e=>{ const h=e.target.closest(".hit"); if(h&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); act(h,null); } });
  R.paused = false; startTimer();
}
function addTag(hit, label, color){
  const [x,y,w] = hit; const tw = label.length*10.5+28, cx = Math.min(800-tw/2-4, Math.max(tw/2+4, x+w/2)), ty = Math.max(4, y-6);
  $("#tags").insertAdjacentHTML("beforeend", `<g style="pointer-events:none"><rect x="${cx-tw/2}" y="${ty}" width="${tw}" height="32" rx="10" fill="${color}" stroke="${O}" stroke-width="3"/><text x="${cx}" y="${ty+23}" text-anchor="middle" font-family="Lilita One" font-size="19" fill="#fff" stroke="${O}" stroke-width="3" paint-order="stroke">${esc(label)}</text></g>`);
}
function renderFound(){
  const sc = SCENES[R.level.id];
  $("#found").innerHTML = `<b style="font-family:var(--f-game);font-size:18px;font-weight:400">Found ${R.found.size}/${sc.spots.length}</b>` +
    sc.spots.map(s=> R.found.has(s.id) ? `<span class="chip ok">✓ ${s.w}</span>` : `<span class="chip empty">?</span>`).join("");
}
function classify(s, el, ev){
  const others = shuffle(Object.keys(WASTES).filter(w=>w!==s.w)).slice(0,2);
  const opts = shuffle([s.w, ...others]);
  openModal(`<h2>What waste is this?</h2>
    <div class="choices">${opts.map(w=>`<button type="button" class="choice" data-w="${w}"><span class="dot" style="background:${WASTES[w].c}">${w[0]}</span><span>${w}<small>${WASTES[w].h}</small></span></button>`).join("")}</div>`);
  document.querySelectorAll("#modal .choice").forEach(b=> b.onclick = e => {
    if(b.dataset.w === s.w){
      sfx("good"); closeModal();
      R.found.add(s.id); el.classList.add("done"); addTag(s.hit, s.w, WASTES[s.w].c); renderFound();
      addCoins(10, ev || e); toast(`<b>${s.w}!</b> ${s.why}`, "good");
      if(R.found.size === SCENES[R.level.id].spots.length){ R.paused = true; setTimeout(()=>endLevel(true), 1000); }
    } else {
      b.classList.add("bad"); b.disabled = true; shake(b);
      if(loseHeart()) closeModal();
    }
  });
}

/* ================= GAME 2: 5S ================= */
function playFives(){
  const D = FIVES[R.level.id];
  R.queue = shuffle(D.items); R.idx = 0; R.kept = []; R.tossed = 0; R.placed = new Set();
  R.paused = false;
  renderSort();
}
function stepsBar(active){
  const N = [["S1","Sort"],["S2","Set in order"],["S3","Shine"],["S4","Standardize"],["S5","Sustain"]];
  return `<div class="steps">${N.map((n,i)=>`<div class="${i<active?"done":i===active?"on":""}"><b>${n[0]}</b>${n[1]}</div>`).join("")}</div>`;
}
function renderSort(){
  const D = FIVES[R.level.id];
  if(R.idx >= R.queue.length){ renderSet(); return; }
  const it = R.queue[R.idx];
  $("#screen").innerHTML = `${stepsBar(0)}
    <div class="say"><div>${mascot("happy")}</div><div class="bubble"><b>SORT:</b> Keep only what the ${D.place} really needs. Red-tag the rest.</div></div>
    <div class="card sort">
      <span class="chip">Item ${R.idx+1} of ${R.queue.length}</span>
      <div class="item-card" id="item">${icon(it.id)}</div>
      <div class="item-name">${esc(it.n)}</div>
      <div class="bins"><button class="btn green" type="button" id="keep">✓ KEEP</button><button class="btn red" type="button" id="toss">RED TAG</button></div>
      <div class="legend"><span class="chip">Kept: ${R.kept.length}</span><span class="chip">Red-tagged: ${R.tossed}</span></div>
    </div>`;
  const choose = (keep, e) => {
    if(R.over || R.paused) return;
    if(keep === it.keep){
      sfx("good"); addCoins(10, e);
      if(keep) R.kept.push(it); else { R.tossed++; toast(`Red tag! ${it.why}`, "good"); }
      R.idx++; renderSort();
    } else {
      shake($("#item"));
      toast(keep ? `Not needed here. ${it.why}` : `The ${D.place} needs this. Keep it!`, "bad");
      loseHeart();
    }
  };
  $("#keep").onclick = e=>choose(true,e); $("#toss").onclick = e=>choose(false,e);
}
function boardHtml(D, showItems, labels){
  return `<div class="board ${D.surface}" id="board">${R.kept.map(it=>`<div class="slot${R.placed.has(it.id)?" filled":""}" data-id="${it.id}">${R.placed.has(it.id)||showItems ? icon(it.id) : icon(it.id,"shadow")}${labels?`<span class="label">${esc(it.n)}</span>`:""}</div>`).join("")}</div>`;
}
function renderSet(){
  const D = FIVES[R.level.id];
  const tray = shuffle(R.kept.filter(it=>!R.placed.has(it.id)));
  $("#screen").innerHTML = `${stepsBar(1)}
    <div class="say"><div>${mascot("happy")}</div><div class="bubble"><b>SET IN ORDER:</b> Drag each item onto its outline (or tap the item, then the outline).</div></div>
    ${boardHtml(D,false,false)}
    <div class="tray" id="tray">${tray.length ? tray.map(it=>`<button type="button" class="piece" data-id="${it.id}" aria-pressed="false" aria-label="${esc(it.n)}">${icon(it.id)}</button>`).join("") : `<span class="chip">All in place!</span>`}</div>`;
  let sel = null;
  const tryPlace = (id, slot, e) => {
    if(!slot || R.over) return;
    if(slot.dataset.id === id){
      R.placed.add(id); sfx("good"); addCoins(10, e); renderSet();
      if(R.placed.size === R.kept.length) setTimeout(renderShine, 500);
    } else { sfx("bad"); shake(slot); toast("Wrong spot. Match the shape!", "bad"); }
  };
  document.querySelectorAll(".piece").forEach(p=>{
    let dragged = false;
    p.onclick = () => { if(dragged){ dragged=false; return; } sel = sel===p.dataset.id ? null : p.dataset.id; document.querySelectorAll(".piece").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.id===sel))); };
    p.onpointerdown = e => {
      if(e.button>0) return;
      const id = p.dataset.id, sx=e.clientX, sy=e.clientY; let ghost=null;
      const move = ev => {
        if(!ghost && Math.hypot(ev.clientX-sx, ev.clientY-sy) < 8) return;
        if(!ghost){ dragged=true; ghost=document.createElement("div"); ghost.className="ghost"; ghost.innerHTML=icon(id); document.body.appendChild(ghost); p.style.opacity=.3; }
        ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
        document.querySelectorAll(".slot").forEach(s=>s.classList.remove("target"));
        const under = document.elementFromPoint(ev.clientX, ev.clientY); const s = under && under.closest(".slot"); if(s) s.classList.add("target");
      };
      const up = ev => {
        removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        if(ghost){ ghost.remove(); p.style.opacity=""; const under=document.elementFromPoint(ev.clientX, ev.clientY); const s=under&&under.closest(".slot"); document.querySelectorAll(".slot").forEach(x=>x.classList.remove("target")); if(s) tryPlace(id, s, ev); }
      };
      addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    };
  });
  document.querySelectorAll(".slot").forEach(s=> s.onclick = e => { if(sel && !s.classList.contains("filled")) tryPlace(sel, s, e); });
}
function renderShine(){
  if(R.over) return;
  const D = FIVES[R.level.id];
  const dirt = [[12,22],[38,72],[63,30],[88,76],[50,50],[25,84]].map(([x,y])=>({x,y,hp:2}));
  $("#screen").innerHTML = `${stepsBar(2)}
    <div class="say"><div>${mascot("happy")}</div><div class="bubble"><b>SHINE:</b> Scrub away the dirt! Tap each spot twice. Cleaning is also checking.</div></div>
    <div style="position:relative" id="shinewrap">${boardHtml(D,true,false)}</div>`;
  const wrap = $("#shinewrap");
  dirt.forEach(d=>{
    const el = document.createElement("button"); el.type="button"; el.className="dirt"; el.setAttribute("aria-label","Dirt spot"); el.style.left=d.x+"%"; el.style.top=d.y+"%";
    el.onclick = e => { if(R.over) return; d.hp--; sfx("tap"); if(d.hp===1) el.classList.add("half"); else { el.remove(); addCoins(5, e); if(dirt.every(x=>x.hp<=0)) setTimeout(renderStandard, 400); } };
    wrap.appendChild(el);
  });
}
function renderStandard(){
  if(R.over) return;
  const D = FIVES[R.level.id], H = D.habit;
  const opts = shuffle([{t:H.ok, ok:true}, ...H.bad.map(t=>({t, ok:false}))]);
  $("#screen").innerHTML = `${stepsBar(3)}
    <div class="say"><div>${mascot("happy")}</div><div class="bubble"><b>STANDARDIZE:</b> Every spot now has a label, so anyone can find things and put them back.</div></div>
    ${boardHtml(D,true,true)}
    <div class="card" style="display:grid;gap:12px">
      <div style="font:400 20px/1.15 var(--f-game)"><span style="color:var(--purple)">S5 SUSTAIN:</span> ${esc(H.q)}</div>
      <div class="choices">${opts.map((o,i)=>`<button type="button" class="choice" data-i="${i}"><span class="dot" style="background:#7B5CFF">${"ABC"[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    </div>`;
  document.querySelectorAll(".choice").forEach(b=> b.onclick = e => {
    if(R.over || R.paused) return;
    const o = opts[+b.dataset.i];
    if(o.ok){ sfx("good"); addCoins(10,e); $("#screen .steps").outerHTML = stepsBar(5); document.querySelectorAll(".choice").forEach(x=>x.disabled=true); R.paused = true; setTimeout(()=>endLevel(true), 800); }
    else { b.classList.add("bad"); b.disabled=true; shake(b); toast("That won't last. Small daily habits keep the gains.","bad"); loseHeart(); }
  });
}

/* ================= GAME 3: 5 WHYS ================= */
function problemArt(id){
  if(id==="carfix"){
    let g = `<rect width="800" height="220" fill="#8FD3FF"/>` + cloud(600,20,.7) + cloud(60,30,.6) + `<rect y="150" width="800" height="70" fill="#4A4E69" stroke="${O}" stroke-width="3"/>`;
    g += car(250,200,"#118AB2",1.15,null);
    g += `<circle class="puff" cx="392" cy="122" r="14" fill="#9AA5B1" stroke="${O}" stroke-width="2.5"/><circle class="puff d2" cx="402" cy="112" r="12" fill="#B8B2C8" stroke="${O}" stroke-width="2.5"/><circle class="puff d3" cx="386" cy="114" r="10" fill="#9AA5B1" stroke="${O}" stroke-width="2.5"/>`;
    g += person({x:470,y:200,s:.9,shirt:"#FF9F1C",skin:"#C68A5E",hair:"#2B2140",face:"wow",flip:true});
    g += bubble(500,30,130,50,"Why?!",26);
    return g;
  }
  let g = `<rect width="800" height="220" fill="#3C3A6E"/><circle cx="700" cy="50" r="24" fill="#FFF7E6" stroke="${O}" stroke-width="3"/><circle cx="688" cy="44" r="21" fill="#3C3A6E"/>`;
  g += `<rect y="170" width="800" height="50" fill="#8B8FB3" stroke="${O}" stroke-width="3"/>`;
  g += `<rect x="140" y="120" width="190" height="24" rx="6" fill="#fff" stroke="${O}" stroke-width="3"/><rect x="140" y="140" width="190" height="16" fill="#9AA5B1" stroke="${O}" stroke-width="3"/><path d="M150 156 v26 M320 156 v26" stroke="${O}" stroke-width="5"/><rect x="146" y="104" width="44" height="20" rx="8" fill="#fff" stroke="${O}" stroke-width="3"/>`;
  g += seated({x:380,y:196,s:.8,shirt:"#8FD3FF",skin:"#8D5A3B",hair:"#9AA5B1",face:"sad"});
  g += `<path d="M418 92 l6 -12 l6 12 l12 -4 l-6 12 l10 6 l-12 4 l2 12 l-10 -6 l-8 10 l-2 -12 l-12 -2 l10 -8Z" fill="#FFD166" stroke="${O}" stroke-width="2.5"/>`;
  g += `<path d="M570 0 V110" stroke="#fff" stroke-width="3"/><rect x="556" y="108" width="28" height="20" rx="6" fill="#EF476F" stroke="${O}" stroke-width="3"/><path d="M440 150 Q 510 150 552 124" fill="none" stroke="#FFD166" stroke-width="3" stroke-dasharray="6 6"/><text x="596" y="118" font-family="Lilita One" font-size="18" fill="#FFD166">CALL BELL</text><text x="596" y="140" font-family="Lilita One" font-size="18" fill="#FFD166">Out of reach!</text>`;
  g += bubble(40,28,130,50,"Why?!",26);
  return g;
}
function playWhys(){
  const W = WHYS[R.level.id];
  R.step = 0; R.order = W.steps.map(s=>shuffle([{t:s.ok,ok:true}, ...s.bad.map(b=>({t:b[0], why:b[1]}))]));
  R.paused = false; renderWhys();
}
const SOIL = ["#A9774A","#8E5F37","#764C2A","#5F3B20","#4A2D17"];
function renderWhys(){
  const W = WHYS[R.level.id];
  const layers = W.steps.map((s,i)=>{
    if(i < R.step) return `<div class="layer done" style="background:${SOIL[i]}"><span class="num">W${i+1}</span><div class="ans">✓ ${esc(s.ok)}</div></div>`;
    if(i === R.step) return `<div class="layer cur" style="background:${SOIL[i]}"><span class="num">W${i+1}</span><div class="q">${i===0?"Why did this happen?":"Why?"}</div><div class="rocks">${R.order[i].map((r,k)=>`<button type="button" class="rock" data-k="${k}"><span>${esc(r.t)}</span></button>`).join("")}</div></div>`;
    return `<div class="layer locked" style="background:${SOIL[i]}"><span class="num">W${i+1}</span>? ? ?</div>`;
  }).join("");
  const done = R.step >= W.steps.length;
  $("#screen").innerHTML = `
    <div class="say"><div>${mascot("happy")}</div><div class="bubble">${done ? "Treasure! You dug all the way down to the root cause." : "Tap the rock with the <b>real reason</b>. Watch out for blame, vague answers and jumping to fixes."}</div></div>
    <div class="dig">
      <div class="stage" style="border:0;border-radius:0;box-shadow:none"><svg viewBox="0 0 800 220" role="img" aria-label="${esc(W.problem)}">${problemArt(R.level.id)}</svg></div>
      <div style="background:#7CCB5B;border-top:3px solid ${O};padding:10px 14px;font:400 22px/1.1 var(--f-game);text-align:center">PROBLEM: ${esc(W.problem)}</div>
      ${layers}
      <div class="chest">
        <svg viewBox="0 0 96 80" aria-hidden="true"><rect x="8" y="34" width="80" height="40" rx="6" fill="#D9A066" stroke="${O}" stroke-width="3.5"/><path d="M8 34 Q8 ${done?4:14} 48 ${done?4:14} Q88 ${done?4:14} 88 34Z" fill="#B9734A" stroke="${O}" stroke-width="3.5"/><rect x="40" y="40" width="16" height="16" rx="3" fill="#FFD166" stroke="${O}" stroke-width="3"/>${done?`<path d="M30 28 l-4 -10 M48 22 v-14 M66 28 l4 -10" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>`:""}</svg>
        ${done ? `<b>ROOT CAUSE: ${esc(W.root)}</b><span>FIX: ${esc(W.fix)}</span><button class="btn" type="button" id="claim">CLAIM TREASURE</button>` : `<span style="opacity:.8">Root cause buried here…</span>`}
      </div>
    </div>`;
  if(done){ $("#claim").onclick = ()=>endLevel(true); $("#claim").scrollIntoView({block:"center", behavior: reduce?"auto":"smooth"}); return; }
  const cur = $(".layer.cur");
  cur.insertAdjacentHTML("beforeend", `<svg class="driller" viewBox="0 0 48 48" aria-hidden="true"><rect x="16" y="4" width="16" height="20" rx="4" fill="#FFD166" stroke="${O}" stroke-width="3"/><path d="M14 24 h20 l-10 20Z" fill="#9AA5B1" stroke="${O}" stroke-width="3" stroke-linejoin="round"/></svg>`);
  if(R.step>0) cur.scrollIntoView({block:"center", behavior: reduce?"auto":"smooth"});
  cur.querySelectorAll(".rock").forEach(b=> b.onclick = e => {
    if(R.over || R.paused) return;
    const r = R.order[R.step][+b.dataset.k];
    if(r.ok){ sfx("good"); addCoins(10, e); R.step++; renderWhys(); }
    else { b.classList.add("cracked"); b.disabled=true; b.insertAdjacentHTML("beforeend", `<span class="why">${esc(r.why)}</span>`); shake(b); loseHeart(); }
  });
}

/* ================= BOOT ================= */
$("#btn-map").onclick = ()=>mapScreen();
$("#btn-sound").onclick = ()=>{ SAVE.muted=!SAVE.muted; persist(); soundIcon(); if(!SAVE.muted) sfx("tap"); };
soundIcon();
if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>SAVE);
titleScreen();
})();
