<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigma Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: a neon arcade hall — marquee, a short Six Sigma primer, a grid of 10 game cabinets; play view = HUD bar + 8:5 canvas screen + touch pad. Deliberately single dark theme (CRT world). */
:root{
  --bg:#0A0820; --bg2:#120F33; --panel:#18144A; --line:#2E2870; --ink:#ECEAFF; --muted:#A39FD6;
  --cyan:#2DE2E6; --pink:#FF3CAC; --yellow:#FFE45E; --green:#4BFF8B; --orange:#FF8A3D; --purple:#9B5DE5; --red:#FF4D6D;
  --f-pix:"Press Start 2P","Courier New",monospace;
  --f-body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#2a1b6b 0,transparent 60%),linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;color:var(--ink);font:500 16px/1.5 var(--f-body);padding-inline:16px;padding-block:14px 48px;min-height:100%}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px}
.pix{font-family:var(--f-pix)}
.marquee{text-align:center;display:grid;gap:10px;padding-block:10px 4px}
.marquee h1{margin:0;font:400 clamp(30px,8vw,64px)/1.1 var(--f-pix);color:var(--yellow);text-shadow:0 0 6px var(--orange),0 0 22px var(--pink),4px 4px 0 #5a1d7a;letter-spacing:.04em}
.marquee h1 span{color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 24px var(--cyan),4px 4px 0 #13306b}
.marquee p{margin:0;color:var(--muted);font-weight:600}
.blink{animation:blink 1.1s steps(2) infinite;color:var(--green);font:400 13px/1 var(--f-pix);letter-spacing:.1em}
@keyframes blink{50%{opacity:0}}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:16px;padding:20px;min-width:0;display:grid;gap:12px}
.panel h2{margin:0;font:400 18px/1.4 var(--f-pix);color:var(--cyan);text-shadow:0 0 10px #2de2e655}
.panel h3{margin:0;font:700 18px/1.2 var(--f-body);color:var(--yellow)}
.panel p{margin:0;max-width:72ch}
.eyebrow{font:400 10px/1 var(--f-pix);letter-spacing:.12em;color:var(--pink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:5px 10px;font:700 13px/1 var(--f-body);background:#0d0a28}
.dmaic{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dmaic div{border:2px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:#0d0a28}
.dmaic b{display:block;font:400 18px/1.2 var(--f-pix);color:var(--yellow)}
.dmaic span{font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:560px){.dmaic{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.dmaic span{font-size:10px}.dmaic b{font-size:14px}}
.sig-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sig-table th,.sig-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.sig-table th{font:400 10px/1.2 var(--f-pix);color:var(--muted);letter-spacing:.06em}
.sig-table td:first-child{font:400 14px/1 var(--f-pix);color:var(--yellow)}
.sig-bar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--red),var(--orange))}
.tbl-wrap{overflow-x:auto}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini{border:2px solid var(--line);border-radius:12px;padding:12px;background:#0d0a28;display:grid;gap:6px}
.mini b{color:var(--green);font:700 17px/1.2 var(--f-body)}
.mini svg{width:100%;height:60px}
.cabinets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:940px){.cabinets{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:480px){.cabinets{grid-template-columns:1fr}}
.cab{position:relative;background:linear-gradient(180deg,#221a5e,#120e34);border:2px solid var(--line);border-radius:18px 18px 10px 10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 0 0 2px #00000060 inset}
.cab .scr{aspect-ratio:8/5;border-radius:10px;background:#050414;border:3px solid #000;display:grid;place-items:center;overflow:hidden;position:relative;box-shadow:0 0 18px var(--glow,#2de2e633) inset}
.cab .scr svg{width:80%;height:80%}
.cab .num{position:absolute;top:8px;left:10px;font:400 10px/1 var(--f-pix);color:var(--muted)}
.cab h3{margin:0;font:400 13px/1.5 var(--f-pix);color:var(--yellow)}
.cab .tool{font:700 15px/1.2 var(--f-body);color:var(--cyan)}
.cab p{margin:0;font-size:14px;color:#cfcbf5;flex:1}
.cab .meta{display:flex;justify-content:space-between;gap:6px;align-items:center;font:400 9px/1.4 var(--f-pix);color:var(--muted)}
.cab .stars{color:var(--yellow);letter-spacing:2px}
.btn{font:400 13px/1 var(--f-pix);letter-spacing:.06em;color:#140b2e;background:var(--yellow);border:0;border-radius:10px;padding:13px 16px;cursor:pointer;box-shadow:0 4px 0 #b08d00,0 0 18px #ffe45e55;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b08d00}
.btn.cyan{background:var(--cyan);box-shadow:0 4px 0 #0f8c8f,0 0 18px #2de2e655}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #9c1463,0 0 18px #ff3cac55}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.rules{margin:0;padding-left:22px;display:grid;gap:6px}
kbd{font:400 10px/1 var(--f-pix);border:2px solid var(--line);border-bottom-width:4px;border-radius:6px;padding:3px 6px;background:#0d0a28}

/* Play view */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#0d0a28;border:2px solid var(--line);border-radius:14px;padding:8px}
.hud .ttl{flex:1 1 160px;min-width:0;font:400 11px/1.5 var(--f-pix);color:var(--yellow)}
.hud .ttl small{display:block;font:700 13px/1.2 var(--f-body);color:var(--cyan)}
.hbox{border:2px solid var(--line);border-radius:10px;padding:5px 9px;display:grid;gap:3px;min-width:70px}
.hbox small{font:400 8px/1 var(--f-pix);color:var(--muted);letter-spacing:.08em}
.hbox b{font:400 13px/1 var(--f-pix);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbox.wide{min-width:120px}
.ibtn{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:#18144A;cursor:pointer;font:400 14px/1 var(--f-pix);display:grid;place-items:center}
.screen{position:relative;border-radius:16px;padding:10px;background:linear-gradient(180deg,#2a2070,#120e34);border:2px solid var(--line)}
#cv{display:block;width:100%;aspect-ratio:8/5;border-radius:10px;background:#050414;touch-action:none;cursor:crosshair}
.crt{position:absolute;inset:10px;border-radius:10px;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000022 2px 3px);box-shadow:inset 0 0 60px #000a}
.pad{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:64px;height:56px;border-radius:14px;border:2px solid var(--line);background:#18144A;font:400 13px/1 var(--f-pix);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 14px;box-shadow:0 4px 0 #0a0820}
.pad button.act{background:var(--pink);color:#fff;border-color:#ff7cc8}
.pad button:active{transform:translateY(3px);box-shadow:none}
.hint{margin:0;text-align:center;color:var(--muted);font-size:14px;font-weight:600}

/* Modal */
.modal{position:fixed;inset:0;background:#05031acc;display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow-y:auto;backdrop-filter:blur(2px)}
.modal .box{margin-block:auto;max-width:560px;width:100%;background:linear-gradient(180deg,#221a5e,#120e34);border:2px solid var(--cyan);border-radius:18px;padding:20px;display:grid;gap:14px;box-shadow:0 0 40px #2de2e633;animation:pop .22s ease}
.modal h2{margin:0;font:400 18px/1.4 var(--f-pix);color:var(--yellow);text-align:center}
.modal p{margin:0}
.idea{border-left:4px solid var(--pink);padding:4px 0 4px 12px}
.how{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#0d0a28}
.how ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.ctrl{font-size:14px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#0d0a28;cursor:pointer;font:700 15px/1.3 var(--f-body)}
.opt small{display:block;font-weight:500;color:var(--muted)}
.opt:hover{border-color:var(--cyan)}
.opt.ok{border-color:var(--green);background:#0f3b2a}
.opt.no{border-color:var(--red);background:#3b0f1e;opacity:.8}
.fb{border-radius:12px;padding:10px 12px;font-weight:600}
.fb.ok{background:#0f3b2a;border:2px solid var(--green)}
.fb.no{background:#3b0f1e;border:2px solid var(--red)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bigstars{display:flex;justify-content:center;gap:10px;font:400 34px/1 var(--f-pix)}
.bigstars span{color:#3a3470}
.bigstars span.on{color:var(--yellow);text-shadow:0 0 14px var(--orange);animation:pop .4s ease both}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.result div{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.result small{display:block;font:400 9px/1.4 var(--f-pix);color:var(--muted)}
.result b{font:400 16px/1.4 var(--f-pix)}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.blink,.modal .box,.bigstars span.on{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main id="home"></main>
  <section id="play" hidden style="display:grid;gap:12px">
    <div class="hud">
      <button class="ibtn" type="button" id="b-back" aria-label="Back to the arcade">◀</button>
      <div class="ttl" id="h-title"></div>
      <div class="hbox"><small>SCORE</small><b id="h-score">0</b></div>
      <div class="hbox" id="h-livebox"><small>LIVES</small><b id="h-lives"></b></div>
      <div class="hbox" id="h-timebox"><small>TIME</small><b id="h-time"></b></div>
      <div class="hbox wide" id="h-statbox"><small id="h-statl"></small><b id="h-stat"></b></div>
      <button class="ibtn" type="button" id="b-help" aria-label="How to play (pauses)">?</button>
      <button class="ibtn" type="button" id="b-snd" aria-label="Sound on or off">♪</button>
    </div>
    <div class="screen"><canvas id="cv" width="800" height="500" aria-label="Game screen"></canvas><div class="crt"></div></div>
    <div class="pad" id="pad"></div>
    <p class="hint" id="hint"></p>
  </section>
</div>
<div class="modal" id="modal" hidden></div>
<script>
(function(){
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = {bg:"#050414",grid:"#13103a",ink:"#ECEAFF",muted:"#A39FD6",cyan:"#2DE2E6",pink:"#FF3CAC",yellow:"#FFE45E",green:"#4BFF8B",orange:"#FF8A3D",purple:"#9B5DE5",red:"#FF4D6D",line:"#2E2870"};
const W=800, H=500;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function mulberry(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function invNorm(p){
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=.02425; let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){q=p-.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function sigmaFromDpmo(dpmo){ if(dpmo<=3.4) return 6; if(dpmo>=1e6) return 0; return clamp(invNorm(1-dpmo/1e6)+1.5,0,6); }

/* ---------- save ---------- */
const KEY="sigma-arcade-v1";
let SAVE={best:{},stars:{},muted:false};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.best) SAVE=Object.assign(SAVE,s); }catch(e){}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(SAVE)); }catch(e){} }

/* ---------- sound ---------- */
let AC=null;
function sfx(type){
  if(SAVE.muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={good:[[660,.06],[990,.1]],bad:[[160,.18]],shot:[[880,.03],[440,.05]],hit:[[300,.05],[600,.08]],tick:[[520,.025]],win:[[523,.1],[659,.1],[784,.1],[1047,.28]],lose:[[330,.15],[262,.15],[196,.3]],coin:[[988,.05],[1319,.12]]}[type];
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==="bad"||type==="lose"?"sawtooth":"square";o.frequency.value=f;g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d;});
  }catch(e){}
}

/* ---------- canvas helpers ---------- */
const cv=$("#cv"), ctx=cv.getContext("2d");
function fitCanvas(){ const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fitCanvas();
function font(size,kind){ return kind==="pix" ? `${size}px "Press Start 2P", monospace` : `600 ${size}px "Chakra Petch", system-ui, sans-serif`; }
function txt(s,x,y,o={}){
  const {size=16,color=C.ink,align="center",kind="body",glow=0,base="middle"}=o;
  ctx.font=font(size,kind); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline=base;
  if(glow&&!reduce){ctx.shadowColor=color;ctx.shadowBlur=glow;}
  ctx.fillText(s,x,y); ctx.shadowBlur=0;
}
function rr(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function pill(s,x,y,o={}){
  const {size=13,fg=C.ink,bg="#0d0a28",border=C.line,pad=7,align="center"}=o;
  ctx.font=font(size); const w=ctx.measureText(s).width+pad*2, h=size+10;
  const x0 = align==="center" ? x-w/2 : align==="left" ? x : x-w;
  rr(x0,y-h/2,w,h,h/2); ctx.fillStyle=bg; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=border; ctx.stroke();
  txt(s,x0+w/2,y+1,{size,color:fg});
  return w;
}
function line(x1,y1,x2,y2,color,w=2,dash=null){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=color; ctx.lineWidth=w; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]); }
function circ(x,y,r,fill,stroke,w=2){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();} }
function bgGrid(color=C.bg){ ctx.fillStyle=color; ctx.fillRect(0,0,W,H); ctx.strokeStyle=C.grid; ctx.lineWidth=1; ctx.beginPath(); for(let x=0;x<=W;x+=40){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);} for(let y=0;y<=H;y+=40){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);} ctx.stroke(); }

/* ---------- engine ---------- */
const G={def:null,game:null,paused:true,over:false,score:0,lives:3,time:0,keys:{},ptr:{x:400,y:250,down:false},fx:[],pops:[],stat:["",""],raf:0,last:0};
function burst(x,y,color,n=18){ if(reduce) n=6; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=rnd(60,240); G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.35,.8),t:0,color}); } }
function pop(text,x,y,color=C.yellow,size=14){ G.pops.push({text,x,y,color,size,t:0}); }
function addScore(n){ G.score=Math.max(0,G.score+n); }
function loseLife(msg,x=400,y=250){ if(G.over) return; G.lives--; sfx("bad"); if(msg) pop(msg,x,y,C.red,13); shakeT=.3; if(G.lives<=0) setTimeout(()=>endGame(false),400); }
let shakeT=0;
function setStat(l,v){ G.stat=[l,v]; }
function loop(t){
  G.raf=requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-G.last)/1000||0); G.last=t;
  if(!G.game) return;
  if(!G.paused && !G.over){ G.time+=dt; G.game.update(dt); if(G.def.dur && G.time>=G.def.dur && !G.over) endGame(G.lives>0 || !G.def.lives); }
  ctx.save();
  if(shakeT>0 && !reduce){ shakeT-=dt; ctx.translate(rnd(-4,4),rnd(-4,4)); }
  G.game.draw(dt);
  G.fx=G.fx.filter(p=>{ p.t+=G.paused?0:dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; ctx.globalAlpha=Math.max(0,1-p.t/p.life); ctx.fillStyle=p.color; ctx.fillRect(p.x-2,p.y-2,4,4); ctx.globalAlpha=1; return p.t<p.life; });
  G.pops=G.pops.filter(p=>{ p.t+=dt; ctx.globalAlpha=Math.max(0,1-p.t/1.2); txt(p.text,p.x,p.y-p.t*40,{size:p.size,kind:"pix",color:p.color,glow:8}); ctx.globalAlpha=1; return p.t<1.2; });
  if(G.paused && !G.over && $("#modal").hidden){ ctx.fillStyle="#05031aaa"; ctx.fillRect(0,0,W,H); txt("PAUSED",400,250,{size:24,kind:"pix",color:C.yellow,glow:12}); }
  ctx.restore();
  hud();
}
let hudCache="";
function hud(){
  const d=G.def; if(!d) return;
  const lives = d.lives ? "♥".repeat(Math.max(0,G.lives))+"♡".repeat(Math.max(0,d.lives-G.lives)) : "";
  const tm = d.dur ? Math.max(0,Math.ceil(d.dur-G.time))+"s" : (G.timeLabel||"");
  const key=[G.score,lives,tm,G.stat[0],G.stat[1]].join("|");
  if(key===hudCache) return; hudCache=key;
  $("#h-score").textContent=G.score.toLocaleString();
  $("#h-livebox").hidden=!d.lives; $("#h-lives").textContent=lives; $("#h-lives").style.color=C.red;
  $("#h-timebox").hidden=!tm; $("#h-time").textContent=tm;
  $("#h-statbox").hidden=!G.stat[0]; $("#h-statl").textContent=G.stat[0]; $("#h-stat").textContent=G.stat[1];
}

    <div class="opts">${o.opts.map((t,i)=>`<button type="button" class="opt" data-i="${i}">${t}</button>`).join("")}</div><div id="ask-fb"></div>`);

      if(ok){ sfx("good"); addScore(o.points||0); } else { sfx("bad"); if(o.penalty==="life") G.lives--; }

      $("#ask-go").focus();

/* =====================================================================
   GAME 1 · SIGNAL SMASH · Control chart
   ===================================================================== */
function makeSignal(){
  const mid=265, sg=40, x0=70, x1=770;
  const yv=v=>mid-v*sg;
  const S={pts:[],spawnT:.4,next:5,plan:[],groups:0,found:0,streak:0};
  const RULE={out:"RULE 1: BEYOND A LIMIT",run:"RULE 2: 7 IN A ROW",trend:"RULE 3: TREND OF 6"};
  function okCommon(v){
    const P=S.pts, n=P.length;
    if(n>=6 && P.slice(-6).every(p=>Math.sign(p.v)===Math.sign(v))) return false;
    if(n>=5){ const l=P.slice(-5).map(p=>p.v); let inc=true,dec=true; for(let i=1;i<5;i++){ if(!(l[i]>l[i-1])) inc=false; if(!(l[i]<l[i-1])) dec=false; } if(inc&&v>l[4]) return false; if(dec&&v<l[4]) return false; }
    return true;
  }
  function nextPoint(){
    if(S.plan.length) return S.plan.shift();
    if(S.next<=0){
      S.next=4+Math.floor(Math.random()*5);
      const type=pick(["out","run","trend"]), last=S.pts.length?S.pts[S.pts.length-1].v:1, s=last>=0?1:-1, g={type,done:false,found:false};
      S.groups++;
      if(type==="out") S.plan=[{v:(Math.random()<.5?1:-1)*rnd(3.25,3.7),g,trig:true}];
      if(type==="run") S.plan=[{v:-s*rnd(.6,1.2)},...Array.from({length:7},(_,i)=>({v:s*rnd(.35,1.7),g,trig:i===6}))];
      if(type==="trend"){ const d=Math.random()<.5?1:-1; S.plan=[{v:d*rnd(.7,1.1)},...Array.from({length:6},(_,i)=>({v:d*(-1.7+i*.62+rnd(0,.12)),g,trig:i===5}))]; }
      return S.plan.shift();
    }
    S.next--;
    let v=0; for(let k=0;k<40;k++){ v=clamp(randn()*.95,-2.3,2.3); if(Math.abs(v)<.06) continue; if(okCommon(v)) break; }
    return {v};
  }
  function flag(p){
    if(p.flag) return;
    if(p.g){
      if(p.g.found) return;
      if(p.g.done){ p.g.found=true; S.found++; S.streak++; const pts=100+Math.min(5,S.streak)*20; addScore(pts); sfx("good"); burst(p.x,yv(p.v),C.green); pop(RULE[p.g.type],p.x>560?560:p.x,yv(p.v)-30,C.green,11); pop("+"+pts,p.x,yv(p.v)-56,C.yellow,12); }
      else { addScore(-25); sfx("bad"); pop("NOT A SIGNAL YET",p.x,yv(p.v)-30,C.orange,11); }
    } else { p.flag=true; S.streak=0; loseLife("TAMPERING!",p.x,yv(p.v)-30); burst(p.x,yv(p.v),C.red,10); }
  }
  return {
    update(dt){
      const gap=Math.max(.42,.8-G.time*.006), speed=56/gap;
      S.spawnT-=dt;
      if(S.spawnT<=0){ S.spawnT+=gap; const p=nextPoint(); p.x=x1; S.pts.push(p); if(p.trig) p.g.done=true; sfx("tick"); }
      S.pts.forEach(p=>p.x-=speed*dt);
      while(S.pts.length && S.pts[0].x<x0){ const p=S.pts.shift(); if(p.trig && !p.g.found){ S.streak=0; loseLife("MISSED: "+RULE[p.g.type].split(": ")[1],200,90); } }
      setStat("SIGNALS",`${S.found} / ${S.groups}`);
    },
    draw(){
      bgGrid();
      ctx.fillStyle="#2de2e60a"; ctx.fillRect(x0,yv(1),x1-x0,2*sg); ctx.fillStyle="#2de2e606"; ctx.fillRect(x0,yv(2),x1-x0,4*sg);
      line(x0,yv(3),x1,yv(3),C.pink,2,[10,8]); line(x0,yv(-3),x1,yv(-3),C.pink,2,[10,8]); line(x0,mid,x1,mid,C.green,2);
      txt("UCL 26",x0-6,yv(3),{size:12,align:"right",color:C.pink}); txt("CL 20",x0-6,mid,{size:12,align:"right",color:C.green}); txt("LCL 14",x0-6,yv(-3),{size:12,align:"right",color:C.pink});
      txt("Daily average wait (minutes) · new point every second",x0,28,{size:14,align:"left",color:C.muted});
      txt("R1 beyond limit · R2 7 in a row one side · R3 6 rising or falling",x0,474,{size:13,align:"left",color:C.muted});
      if(S.pts.length>1){ ctx.beginPath(); S.pts.forEach((p,i)=>{ const y=yv(p.v); i?ctx.lineTo(p.x,y):ctx.moveTo(p.x,y); }); ctx.strokeStyle=C.cyan; ctx.lineWidth=2; if(!reduce){ctx.shadowColor=C.cyan;ctx.shadowBlur=8;} ctx.stroke(); ctx.shadowBlur=0; }
      S.pts.forEach(p=>{ const y=yv(p.v); const col=p.g&&p.g.found?C.green:p.flag?C.red:C.cyan; circ(p.x,y,7,"#050414",col,3); if(p.g&&p.g.found) circ(p.x,y,3,C.green); });
      ctx.fillStyle="#050414"; ctx.fillRect(x1+4,40,30,440);
    },
    down(x,y){ let best=null,bd=30; S.pts.forEach(p=>{ const d=Math.hypot(p.x-x,yv(p.v)-y); if(d<bd){bd=d;best=p;} }); if(best) flag(best); },
    key(k){ if(k===" " && S.pts.length) flag(S.pts[S.pts.length-1]); },
    summary(){ return `<p style="text-align:center">You caught <b>${S.found}</b> of <b>${S.groups}</b> special-cause signals.</p>`; }
  };
}

/* =====================================================================
   GAME 2 · DATA TETRIS · Histogram
   ===================================================================== */
function makeTetris(){
  const X0=120, CW=80, FLOOR=440, BH=24, NB=7;
  const LV=[
    {title:"Coffee shop: minutes to serve a customer", gen:()=>17.5+randn()*5.2, ans:0, color:C.cyan},
    {title:"Clinic: minutes in the waiting room", gen:()=>2+(-Math.log(Math.random()))*7, ans:1, color:C.orange},
    {title:"ER: hours from arrival to bed (day + night shift)", gen:()=>Math.random()<.5?9+randn()*2.6:25+randn()*2.6, ans:2, color:C.pink}
  ];
  const N=16;
  const S={lv:0,stacks:Array(NB).fill(0),blocks:[],cur:null,count:0,fast:false,waiting:false};
  function spawn(){ const v=clamp(Math.round(LV[S.lv].gen()),0,34); S.cur={v,col:3,y:30}; S.fast=false; }
  function landY(col){ return FLOOR-(S.stacks[col]+1)*BH; }
  function land(){
    const b=S.cur, bin=Math.floor(b.v/5), y=landY(b.col);
    if(b.col===bin){ S.stacks[b.col]++; S.blocks.push({col:b.col,y,v:b.v,color:LV[S.lv].color}); addScore(50); sfx("hit"); burst(X0+b.col*CW+CW/2,y+12,LV[S.lv].color,10); }
    else { burst(X0+b.col*CW+CW/2,y+12,C.red,16); loseLife(`${b.v} GOES IN ${bin*5}-${bin*5+5}`,400,200); }
    S.cur=null; S.count++;
    if(G.over) return;
    if(S.count>=N){ S.waiting=true; askShape(); } else spawn();
  }
  function askShape(){
    const L=LV[S.lv];
    ask({kicker:"READ THE HISTOGRAM",title:"What shape is this?",body:L.title,correct:L.ans,points:150,
      opts:["<b>Bell curve (normal)</b><small>Most values in the middle, fewer at both edges</small>","<b>Skewed</b><small>A pile on one side and a long tail on the other</small>","<b>Two peaks (bimodal)</b><small>Two separate humps</small>"],
      right:["A bell curve means a stable process with only everyday variation.","Skewed: most people wait a little, but a long tail waits a long time. Hunt down what causes the tail.","Two peaks usually means two processes mixed together, here day and night shift. Split the data and compare."][L.ans],
      wrong:"Look at where the blocks piled up: one hump in the middle, one hump with a long tail, or two humps?"},()=>{
        S.lv++; S.waiting=false;
        if(S.lv>=LV.length){ endGame(true); return; }
        S.stacks=Array(NB).fill(0); S.blocks=[]; S.count=0;
        banner(`LEVEL ${S.lv+1}`,esc(LV[S.lv].title),"GO!",spawn);
      });
  }
  return {
    start(){ spawn(); },
    update(dt){
      if(!S.cur||S.waiting) return;
      const sp = (S.fast||G.keys.ArrowDown) ? 560 : 48+S.lv*14+S.count*1.5;
      S.cur.y+=sp*dt;
      if(S.cur.y>=landY(S.cur.col)) { S.cur.y=landY(S.cur.col); land(); }
      setStat("BLOCKS",`${Math.min(S.count+1,N)} / ${N}`);
    },
    draw(){
      bgGrid();
      txt(`LEVEL ${S.lv+1}: ${LV[Math.min(S.lv,LV.length-1)].title}`,400,16,{size:15,color:C.yellow});
      for(let i=0;i<NB;i++){ ctx.fillStyle=i%2?"#0f0c30":"#0b0926"; ctx.fillRect(X0+i*CW,40,CW,FLOOR-40); txt(`${i*5}-${i*5+5}`,X0+i*CW+CW/2,FLOOR+18,{size:14,color:C.muted}); }
      txt("minutes per bin →",X0+NB*CW+8,FLOOR+18,{size:12,align:"left",color:C.muted});
      line(X0,FLOOR,X0+NB*CW,FLOOR,C.cyan,3);
      S.blocks.forEach(b=>{ rr(X0+b.col*CW+4,b.y+2,CW-8,BH-4,5); ctx.fillStyle=b.color; ctx.fill(); txt(String(b.v),X0+b.col*CW+CW/2,b.y+BH/2+1,{size:13,color:"#050414"}); });
      if(S.cur){
        const c=S.cur, gx=X0+c.col*CW;
        rr(gx+4,landY(c.col)+2,CW-8,BH-4,5); ctx.strokeStyle="#ffffff40"; ctx.setLineDash([4,4]); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
        rr(gx+2,c.y,CW-4,BH,6); ctx.fillStyle="#ffffff"; if(!reduce){ctx.shadowColor=C.yellow;ctx.shadowBlur=14;} ctx.fill(); ctx.shadowBlur=0;
        txt(`${c.v} min`,gx+CW/2,c.y+BH/2+1,{size:14,color:"#050414"});
      }
      txt("◀ ▶ move · ▼ drop · or tap a column",400,488,{size:12,color:C.muted});
    },
    key(k){ if(!S.cur) return; if(k==="ArrowLeft") S.cur.col=Math.max(0,S.cur.col-1); if(k==="ArrowRight") S.cur.col=Math.min(NB-1,S.cur.col+1); if(k===" ") S.fast=true; if(S.cur.y>landY(S.cur.col)) S.cur.y=landY(S.cur.col); },
    down(x){ if(!S.cur) return; const col=Math.floor((x-X0)/CW); if(col>=0&&col<NB){ S.cur.col=col; if(S.cur.y>landY(col)) S.cur.y=landY(col); S.fast=true; } }
  };
}

/* =====================================================================
   GAME 3 · PARETO GALLERY · Pareto chart
   ===================================================================== */
function makePareto(){
  const R=[
    {title:"Pizza delivery complaints", cats:[["Late",48],["Cold",22],["Wrong topping",12],["No drink",7],["Crushed box",5],["Rude driver",4],["Other",2]]},
    {title:"Pharmacy dispensing errors", cats:[["Wrong dose",38],["Wrong drug",26],["Label error",18],["Wrong patient",7],["Missing item",6],["Other",5]]}
  ];
  const S={r:0,targets:[],ammo:4,shots:0,elim:0,phase:"shoot",sumT:0,flash:0,results:[]};
  function setup(){
    const rd=R[S.r]; S.ammo=4; S.shots=0; S.elim=0; S.phase="shoot";
    const sp=[70,-100,130]; S.targets=shuffle(rd.cats).map(([k,v],i)=>({k,v,r:16+Math.sqrt(v)*6.5,row:i%3})); [0,1,2].forEach(row=>{ const inRow=S.targets.filter(t=>t.row===row); inRow.forEach((t,j)=>{ t.x=(j+.5)*(W+140)/inRow.length-70+rnd(-20,20); t.y=180+row*112; t.vx=sp[row]; t.hit=false; }); });
  }
  setup();
  function finishRound(){ S.phase="summary"; S.sumT=0; const pct=S.elim; S.results.push(pct); if(pct>=80){ addScore(300); pop("VITAL FEW HIT! +300",400,90,C.green,14); sfx("win"); } }
  return {
    update(dt){
      if(S.phase==="shoot"){ S.targets.forEach(t=>{ if(t.hit) return; t.x+=t.vx*dt; if(t.x<-70) t.x+=W+140; if(t.x>W+70) t.x-=W+140; }); }
      else { S.sumT+=dt; }
      S.flash=Math.max(0,S.flash-dt);
      setStat("REMOVED",`${S.elim}%`); G.timeLabel=`R${S.r+1}/2`;
    },
    draw(){
      bgGrid("#0a0718");
      for(let i=0;i<3;i++){ const y=180+i*112; line(0,y+50,W,y+50,"#3a2a7a",4); for(let x=(i*30)%60;x<W;x+=60){ ctx.fillStyle=i%2?"#2a1f63":"#1f1750"; ctx.fillRect(x,y+52,30,8); } }
      const rd=R[S.r];
      txt(`ROUND ${S.r+1}: ${rd.title} (100 total)`,20,22,{size:15,align:"left",color:C.yellow});
      rr(20,40,500,22,11); ctx.fillStyle="#120e34"; ctx.fill(); rr(20,40,500*S.elim/100,22,11); ctx.fillStyle=S.elim>=80?C.green:C.orange; ctx.fill();
      line(20+500*.8,34,20+500*.8,68,C.pink,3); txt("80%",20+500*.8,80,{size:11,color:C.pink,kind:"pix"});
      txt(`${S.elim}% of ${rd.cats.length===7?"complaints":"errors"} removed`,530,51,{size:14,align:"left"});
      txt("SHOTS",640,84,{size:10,kind:"pix",color:C.muted,align:"right"}); for(let i=0;i<4;i++) circ(660+i*22,84,8,i<S.ammo?C.yellow:"#2a2560",null);
      if(S.phase==="shoot"){
        S.targets.forEach(t=>{ if(t.hit) return; circ(t.x,t.y,t.r,"#fff",null); circ(t.x,t.y,t.r*.72,C.red); circ(t.x,t.y,t.r*.44,"#fff"); circ(t.x,t.y,t.r*.2,C.red); pill(`${t.k} · ${t.v}`,t.x,t.y-t.r-14,{size:12,bg:"#120e34",border:C.cyan}); });
        const p=G.ptr; circ(p.x,p.y,16,null,C.green,2); line(p.x-24,p.y,p.x-8,p.y,C.green,2); line(p.x+8,p.y,p.x+24,p.y,C.green,2); line(p.x,p.y-24,p.x,p.y-8,C.green,2); line(p.x,p.y+8,p.x,p.y+24,C.green,2);
        if(S.flash>0){ ctx.fillStyle=`rgba(255,255,255,${S.flash*1.5})`; ctx.fillRect(0,0,W,H); }
      } else {
        ctx.fillStyle="#050414ee"; ctx.fillRect(40,90,720,390); ctx.strokeStyle=C.cyan; ctx.lineWidth=2; ctx.strokeRect(40,90,720,390);

  };
}

/* =====================================================================
   GAME 4 · FISHBONE SNAKE · Cause & effect
   ===================================================================== */
function makeSnake(){
  const COLS=14, ROWS=12, CELL=40, OX=0, OY=20;
  const CATS=["People","Machine","Method","Material","Measurement","Environment"];
  const CC={People:C.cyan,Machine:C.orange,Method:C.pink,Material:C.green,Measurement:C.yellow,Environment:C.purple};
  const PROBS=[
    {title:"BURNT PIZZAS", causes:{People:"New cook not trained",Machine:"Oven thermostat broken",Method:"No timer step in recipe",Material:"Dough base too thin",Measurement:"Oven dial reads wrong",Environment:"Kitchen is boiling hot"}},
    {title:"LATE LAB RESULTS", causes:{People:"One phlebotomist at night",Machine:"Analyzer keeps breaking",Method:"Samples sent in batches",Material:"Wrong tube types used",Measurement:"Result times not tracked",Environment:"Lab is 3 floors away"}}
  ];
  const S={lv:0,order:shuffle(CATS),ti:0,filled:{},snake:[],dir:[1,0],next:[1,0],stepT:0,grow:0,pellets:[],sw:null};
  function reset(){ S.snake=[[5,6],[4,6],[3,6],[2,6]]; S.dir=[1,0]; S.next=[1,0]; S.grow=0; }
  function free(x,y){ return !S.snake.some(s=>s[0]===x&&s[1]===y) && !S.pellets.some(p=>Math.abs(p.x-x)<3&&p.y===y); }
  function spawnPellets(){
    S.pellets=[]; const P=PROBS[S.lv], tgt=S.order[S.ti];
    const set=shuffle([tgt,...shuffle(CATS.filter(c=>c!==tgt)).slice(0,2)]);
    const h=S.snake[0];
    set.forEach(cat=>{ for(let k=0;k<200;k++){ const x=1+Math.floor(Math.random()*(COLS-2)), y=1+Math.floor(Math.random()*(ROWS-2)); if(free(x,y) && Math.abs(x-h[0])+Math.abs(y-h[1])>4 && !S.pellets.some(p=>Math.abs(p.y-y)<2&&Math.abs(p.x-x)<5)){ S.pellets.push({x,y,cat,text:P.causes[cat]}); break; } } });
  }
  reset();
  function step(){
    S.dir=S.next; const h=[S.snake[0][0]+S.dir[0],S.snake[0][1]+S.dir[1]];
    if(h[0]<0||h[1]<0||h[0]>=COLS||h[1]>=ROWS||S.snake.some(s=>s[0]===h[0]&&s[1]===h[1])){ burst(OX+S.snake[0][0]*CELL+20,OY+S.snake[0][1]*CELL+20,C.red,20); loseLife("CRASH!",300,240); reset(); spawnPellets(); return; }
    S.snake.unshift(h);
    const pi=S.pellets.findIndex(p=>p.x===h[0]&&p.y===h[1]);
    if(pi>=0){
      const p=S.pellets[pi], tgt=S.order[S.ti];
      if(p.cat===tgt){ S.grow+=2; addScore(100); sfx("good"); burst(OX+p.x*CELL+20,OY+p.y*CELL+20,CC[p.cat],18); pop(`${p.cat.toUpperCase()} ✓`,OX+p.x*CELL+20,OY+p.y*CELL,C.green,12); S.filled[p.cat]=p.text; S.ti++;
        if(S.ti>=CATS.length){ if(S.lv>=PROBS.length-1){ setTimeout(()=>endGame(true),300); return; } S.lv++; S.ti=0; S.order=shuffle(CATS); S.filled={}; reset(); banner("LEVEL 2","New problem: <b>Late lab results</b> in a hospital. Same 6 bones, new causes.","GO!",spawnPellets); S.pellets=[]; return; }
        spawnPellets();
      } else { loseLife(`THAT'S A ${p.cat.toUpperCase()} CAUSE`,OX+p.x*CELL+20,OY+p.y*CELL); spawnPellets(); }
    }
    if(S.grow>0) S.grow--; else S.snake.pop();
  }
  function turn(d){ if(d[0]===-S.dir[0]&&d[1]===-S.dir[1]) return; S.next=d; }
  return {
    start(){ spawnPellets(); },
    update(dt){ S.stepT+=dt; const iv=Math.max(.11,.17-S.ti*.004-S.lv*.02); while(S.stepT>=iv){ S.stepT-=iv; step(); if(G.over||G.paused) break; } setStat("FEED ME",S.order[S.ti]||"-"); },
    draw(){
      bgGrid("#060418");
      ctx.strokeStyle=C.cyan; ctx.lineWidth=3; ctx.strokeRect(OX+1,OY+1,COLS*CELL-2,ROWS*CELL-2);
      S.pellets.forEach(p=>{ const x=OX+p.x*CELL+20,y=OY+p.y*CELL+20; circ(x,y,13,"#fff",C.yellow,3); circ(x,y,6,C.yellow); });
      S.snake.forEach((s,i)=>{ const x=OX+s[0]*CELL+20,y=OY+s[1]*CELL+20; if(i===0){ circ(x,y,17,C.cyan,"#fff",2); circ(x+S.dir[0]*6-S.dir[1]*6,y+S.dir[1]*6+S.dir[0]*6,3.5,"#050414"); circ(x+S.dir[0]*6+S.dir[1]*6,y+S.dir[1]*6-S.dir[0]*6,3.5,"#050414"); } else { line(x-12*Math.abs(S.dir[1]||1),y-12*Math.abs(S.dir[0]||0),x+12*Math.abs(S.dir[1]||1),y+12*Math.abs(S.dir[0]||0),"#cfd8ff",4); circ(x,y,9,"#e9ecff",C.cyan,2); } });
      S.pellets.forEach(p=>{ const x=clamp(OX+p.x*CELL+20,90,COLS*CELL-90),y=OY+p.y*CELL-6; pill(p.text,x,y,{size:12,bg:"#120e34",border:"#5b55a8"}); });
      const px=575;
      txt(PROBS[S.lv].title,px+108,36,{size:12,kind:"pix",color:C.pink});
      rr(px,52,216,56,10); ctx.fillStyle="#120e34"; ctx.fill(); ctx.strokeStyle=C.yellow; ctx.lineWidth=2; ctx.stroke();
      txt("FEED ME:",px+108,68,{size:10,kind:"pix",color:C.muted}); txt((S.order[S.ti]||"DONE").toUpperCase(),px+108,92,{size:15,kind:"pix",color:CC[S.order[S.ti]]||C.green,glow:10});
      line(px+10,300,px+200,300,"#cfd8ff",4); ctx.beginPath(); ctx.moveTo(px+200,288); ctx.lineTo(px+214,300); ctx.lineTo(px+200,312); ctx.fillStyle="#cfd8ff"; ctx.fill();
      CATS.forEach((c,i)=>{ const top=i<3, cx=px+30+(i%3)*62, y0=top?130:470, ym=300; line(cx,y0+(top?20:-20),cx+30,ym,CC[c],3);
        txt({Measurement:"Measure",Environment:"Environ."}[c]||c,cx,top?y0+8:y0-8,{size:11,color:CC[c]});
        const f=S.filled[c]; if(f){ const words=f.split(" "); words.slice(0,4).forEach((w,k)=>txt(w,cx+(top?6:6),(top?y0+28:y0-78)+k*13,{size:10,color:"#fff",align:"left"})); }
      });
      txt("BONES FILLED",px+108,490,{size:9,kind:"pix",color:C.muted});
    },
    key(k){ const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[k]; if(m) turn(m); },
    down(x,y){ S.sw=[x,y]; },
    up(x,y){ if(!S.sw) return; const dx=x-S.sw[0], dy=y-S.sw[1]; S.sw=null; if(Math.max(Math.abs(dx),Math.abs(dy))<24) return; turn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]); }
  };
}

/* =====================================================================
   GAME 5 · SPEC LANE RACER · Process capability Cp / Cpk
   ===================================================================== */
function makeRacer(){
  const PY=400;
  const S={dist:0,mu:400,sig:34,parts:[],acc:0,total:0,defects:0,dSince:0,items:[],itemT:1.5,sumCpk:0,cp:0,cpk:0};
  const road=d=>({c:400+120*Math.sin(d/560)+46*Math.sin(d/210), w:Math.max(66,160-S.dist*.0115)});
  const GOOD=["Training","Maintenance","Standard work","Better tools"], BAD=["Worn tool","Rushed job","New supplier","Skipped check"];
  return {
    update(dt){
      S.dist+=210*dt;
      if(G.keys.ArrowLeft) S.mu-=300*dt; if(G.keys.ArrowRight) S.mu+=300*dt;
      if(G.ptr.down) S.mu+=(G.ptr.x-S.mu)*Math.min(1,dt*7);
      S.mu=clamp(S.mu,40,760);
      const R=road(S.dist), usl=R.c+R.w, lsl=R.c-R.w;
      S.acc+=dt*34;
      while(S.acc>=1){ S.acc--; const x=S.mu+randn()*S.sig, out=x<lsl||x>usl; S.total++; if(out){ S.defects++; S.dSince++; } S.parts.push({x,y:PY,out}); }
      S.parts.forEach(p=>p.y+=210*dt); S.parts=S.parts.filter(p=>p.y<H+10);
      S.itemT-=dt; if(S.itemT<=0){ S.itemT=rnd(1.6,2.6); const good=Math.random()<.68, R0=road(S.dist+PY+20); S.items.push({good,label:pick(good?GOOD:BAD),x:R0.c+rnd(-.7,.7)*R0.w,y:-20}); }
      S.items.forEach(it=>{ it.y+=210*dt; if(!it.got && Math.abs(it.y-PY)<20 && Math.abs(it.x-S.mu)<36){ it.got=true; if(it.good){ S.sig=Math.max(9,S.sig-5); sfx("good"); pop(`${it.label.toUpperCase()}: LESS VARIATION`,400,300,C.cyan,11); } else { S.sig=Math.min(60,S.sig+7); sfx("bad"); pop(`${it.label.toUpperCase()}: MORE VARIATION`,400,300,C.orange,11); } } });
      S.items=S.items.filter(it=>!it.got && it.y<H+20);
      S.cp=(usl-lsl)/(6*S.sig); S.cpk=Math.min(usl-S.mu,S.mu-lsl)/(3*S.sig);
      S.sumCpk+=S.cpk*dt; addScore(Math.round(dt*120*clamp(S.cpk,0,2)));
      if(S.dSince>=45){ S.dSince=0; loseLife("TOO MANY DEFECTS!",400,220); }
      setStat("Cp · Cpk",`${S.cp.toFixed(2)} · ${S.cpk.toFixed(2)}`);
    },
    draw(){
      ctx.fillStyle="#06140e"; ctx.fillRect(0,0,W,H);
      const L=[],Rt=[]; for(let y=0;y<=H;y+=10){ const r=road(S.dist+(PY-y)); L.push([r.c-r.w,y]); Rt.push([r.c+r.w,y]); }
      ctx.beginPath(); L.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); Rt.slice().reverse().forEach(p=>ctx.lineTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle="#1a1840"; ctx.fill();
      [L,Rt].forEach(side=>{ ctx.beginPath(); side.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle=C.pink; ctx.lineWidth=4; if(!reduce){ctx.shadowColor=C.pink;ctx.shadowBlur=10;} ctx.stroke(); ctx.shadowBlur=0; });
      ctx.beginPath(); for(let y=0;y<=H;y+=10){ const r=road(S.dist+(PY-y)); y?ctx.lineTo(r.c,y):ctx.moveTo(r.c,y); } ctx.strokeStyle="#ffffff30"; ctx.setLineDash([14,14]); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
      const R=road(S.dist);
      txt("LSL",R.c-R.w-6,PY+40,{size:12,kind:"pix",color:C.pink,align:"right"}); txt("USL",R.c+R.w+6,PY+40,{size:12,kind:"pix",color:C.pink,align:"left"}); txt("TARGET",R.c,PY+64,{size:9,kind:"pix",color:"#ffffff80"});
      S.parts.forEach(p=>{ ctx.fillStyle=p.out?C.red:C.green; ctx.fillRect(p.x-2,p.y-2,4,4); });
      S.items.forEach(it=>{ circ(it.x,it.y,16,it.good?"#0d3b4a":"#4a250d",it.good?C.cyan:C.orange,3); txt(it.good?"−σ":"+σ",it.x,it.y+1,{size:12,color:it.good?C.cyan:C.orange}); txt(it.label,it.x,it.y-26,{size:12,color:it.good?C.cyan:C.orange}); });
      const usl=R.c+R.w, lsl=R.c-R.w;
      ctx.beginPath(); for(let z=-4;z<=4;z+=.1){ const x=S.mu+z*S.sig, y=PY-80*Math.exp(-.5*z*z); z===-4?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.lineTo(S.mu+4*S.sig,PY); ctx.lineTo(S.mu-4*S.sig,PY); ctx.closePath();
      ctx.save(); ctx.clip(); ctx.fillStyle="#2de2e655"; ctx.fillRect(lsl,PY-90,usl-lsl,90); ctx.fillStyle="#ff4d6d99"; ctx.fillRect(0,PY-90,lsl,90); ctx.fillRect(usl,PY-90,W-usl,90); ctx.restore();
      ctx.beginPath(); for(let z=-4;z<=4;z+=.1){ const x=S.mu+z*S.sig, y=PY-80*Math.exp(-.5*z*z); z===-4?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.strokeStyle=C.cyan; ctx.lineWidth=2; ctx.stroke();
      rr(S.mu-16,PY,32,46,8); ctx.fillStyle=C.yellow; ctx.fill(); rr(S.mu-11,PY+8,22,12,4); ctx.fillStyle="#050414"; ctx.fill(); ctx.fillStyle="#050414"; ctx.fillRect(S.mu-20,PY+6,4,12); ctx.fillRect(S.mu+16,PY+6,4,12); ctx.fillRect(S.mu-20,PY+28,4,12); ctx.fillRect(S.mu+16,PY+28,4,12);
      rr(14,14,226,92,10); ctx.fillStyle="#050414dd"; ctx.fill(); ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.stroke();
      [["Cp",S.cp,C.cyan,36],["Cpk",S.cpk,C.yellow,70]].forEach(([n,v,col,y])=>{ txt(n,26,y,{size:14,align:"left",color:col}); rr(66,y-8,120,16,8); ctx.fillStyle="#1a1840"; ctx.fill(); rr(66,y-8,120*clamp(v/2,0,1),16,8); ctx.fillStyle=v>=1.33?C.green:v>=1?C.yellow:C.red; ctx.fill(); line(66+120*1.33/2,y-12,66+120*1.33/2,y+12,"#fff",2); txt(v.toFixed(2),194,y,{size:14,align:"left"}); });
      txt("white line = 1.33 target",26,96,{size:11,align:"left",color:C.muted});
      txt(`Defects: ${S.defects} / ${S.total} parts`,786,24,{size:13,align:"right",color:C.muted});
    },
    summary(){ const avg=G.time?S.sumCpk/G.time:0; return `<p style="text-align:center">Average Cpk: <b>${avg.toFixed(2)}</b> · defects ${S.defects} of ${S.total} parts (${S.total?Math.round(S.defects/S.total*1e6).toLocaleString():0} DPMO).</p>`; },
    avgCpk(){ return G.time?S.sumCpk/G.time:0; }
  };
}

/* =====================================================================
   GAME 6 · LINE LASER · Scatter plot, correlation, regression
   ===================================================================== */
function makeLaser(){
  const PX0=90,PX1=760,PY0=60,PY1=420;
  const ROUNDS=[
    {x:"Hours studied",y:"Exam score",xr:[0,10],yr:[20,100],n:22,f:(x,r)=>38+5.2*x+(r()-.5)*18,seed:11},
    {x:"Daily steps (thousands)",y:"Resting heart rate",xr:[2,14],yr:[50,95],n:24,f:(x,r)=>82-1.5*x+(r()-.5)*26,seed:7},
    {x:"Birthday month",y:"Height (cm)",xr:[1,12],yr:[140,200],n:24,f:(x,r)=>170+(r()-.5)*40,seed:5},
    {x:"Ice-cream sales (per day)",y:"Sunburn cases (per day)",xr:[5,50],yr:[0,60],n:22,f:(x,r)=>4+.95*x+(r()-.5)*12,seed:3,
      cause:{title:"Does ice cream cause sunburn?",opts:["<b>Yes</b><small>The more ice cream, the more sunburn</small>","<b>No</b><small>Something else drives both</small>"],correct:1,right:"Right! Hot, sunny days push up both ice-cream sales and sunburn. That hidden driver is a lurking variable. Correlation is not causation.",wrong:"Careful! Sunny weather drives both. A lurking variable can make two things move together without one causing the other."}},
    {x:"Nurses on shift",y:"ER wait (minutes)",xr:[3,12],yr:[0,140],n:22,f:(x,r)=>142-10.5*x+(r()-.5)*30,seed:9,
      cause:{title:"Waits fall as nurses rise. What's the best next step?",opts:["<b>It's proven</b><small>Hire nurses, done</small>","<b>Strong clue: test it</b><small>Run a controlled change and measure again</small>"],correct:1,right:"Yes. A strong correlation plus a sensible mechanism is a great lead. Confirm it with a test (PDCA or a designed experiment).",wrong:"A correlation is a clue, not proof. Test it with a controlled change before spending money."}}
  ];
  const S={r:0,pts:[],yl:240,yr:240,drag:null,phase:"fit",t:15,reg:null,fit:0};
  const mx=(r,x)=>PX0+(x-r.xr[0])/(r.xr[1]-r.xr[0])*(PX1-PX0), my=(r,y)=>PY1-(y-r.yr[0])/(r.yr[1]-r.yr[0])*(PY1-PY0);
  const iy=(r,py)=>r.yr[0]+(PY1-py)/(PY1-PY0)*(r.yr[1]-r.yr[0]);
  function setup(){
    const R=ROUNDS[S.r], rng=mulberry(R.seed);
    S.pts=Array.from({length:R.n},()=>{ const x=R.xr[0]+rng()*(R.xr[1]-R.xr[0]); return {x,y:clamp(R.f(x,rng),R.yr[0]+1,R.yr[1]-1)}; });
    const n=S.pts.length, sx=S.pts.reduce((a,p)=>a+p.x,0)/n, sy=S.pts.reduce((a,p)=>a+p.y,0)/n;
    let sxy=0,sxx=0,syy=0; S.pts.forEach(p=>{ sxy+=(p.x-sx)*(p.y-sy); sxx+=(p.x-sx)**2; syy+=(p.y-sy)**2; });
    const b=sxy/sxx, a=sy-b*sx; S.reg={a,b,r:sxy/Math.sqrt(sxx*syy),sse:S.pts.reduce((s,p)=>s+(p.y-(a+b*p.x))**2,0)};
    S.yl=S.yr=(PY0+PY1)/2; S.phase="fit"; S.t=15;
  }
  setup();
  function userLine(){ const R=ROUNDS[S.r]; const y0=iy(R,S.yl), y1=iy(R,S.yr); const b=(y1-y0)/(R.xr[1]-R.xr[0]); return {a:y0-b*R.xr[0],b}; }
  function fitPct(){ const u=userLine(); const sse=S.pts.reduce((s,p)=>s+(p.y-(u.a+u.b*p.x))**2,0); return clamp(S.reg.sse/sse,0,1); }
  function cat(r){ return r>=.7?0:r>=.3?1:r>-.3?2:r>-.7?3:4; }
  function lock(){
    if(S.phase!=="fit") return;
    S.phase="reveal"; S.fit=fitPct(); const pts=Math.round(S.fit*400); addScore(pts); sfx(S.fit>.85?"good":"hit"); pop(`FIT ${Math.round(S.fit*100)}%  +${pts}`,400,90,S.fit>.85?C.green:C.yellow,14);
    setTimeout(()=>{ if(G.over) return; const R=ROUNDS[S.r];
      ask({kicker:"CORRELATION",title:"How strong is the link?",body:`r = ? for <b>${esc(R.x)}</b> vs <b>${esc(R.y)}</b>`,correct:cat(S.reg.r),points:200,
        opts:["<b>Strong positive</b><small>r above +0.7</small>","<b>Moderate positive</b><small>r between +0.3 and +0.7</small>","<b>No real link</b><small>r near 0</small>","<b>Moderate negative</b><small>r between −0.3 and −0.7</small>","<b>Strong negative</b><small>r below −0.7</small>"],
        right:`The real r is ${S.reg.r.toFixed(2)}.`, wrong:`The real r is ${S.reg.r.toFixed(2)}. Tight cloud = strong, round blob = none, slope up = positive, slope down = negative.`},()=>{
          const next=()=>{ if(S.r>=ROUNDS.length-1){ endGame(true); return; } S.r++; setup(); };
          if(R.cause) ask(Object.assign({kicker:"CAUSATION CHECK",points:200},R.cause),next); else next();
        });
    },1400);
  }
  return {
    update(dt){ if(S.phase==="fit"){ S.t-=dt; if(S.t<=0) lock(); } G.timeLabel=`R${S.r+1}/5`; setStat("FIT", S.phase==="fit"?`${Math.round(fitPct()*100)}%`:`${Math.round(S.fit*100)}%`); },
    draw(){
      bgGrid(); const R=ROUNDS[S.r];
      line(PX0,PY1,PX1,PY1,C.muted,2); line(PX0,PY0,PX0,PY1,C.muted,2);

/* =====================================================================
   GAME 7 · VERDICT · Hypothesis testing (p-value)
   ===================================================================== */
function binomP(n,k,p){
  if(n===0) return 1;
  const lf=[0]; for(let i=1;i<=n;i++) lf[i]=lf[i-1]+Math.log(i);
  const pm=i=>Math.exp(lf[n]-lf[i]-lf[n-i]+i*Math.log(p)+(n-i)*Math.log(1-p));
  const obs=pm(k); let s=0; for(let i=0;i<=n;i++){ const q=pm(i); if(q<=obs*(1+1e-7)) s+=q; }
  return Math.min(1,s);
}
function makeCourt(){
  const CASES=shuffle([
    {name:"The Lucky Coin",claim:"This coin is fair: heads 50% of the time.",p0:.5,pt:.5,succ:"Heads",fail:"Tails"},
    {name:"Loaded Dice?",claim:"A six comes up 1 time in 6 (17%).",p0:1/6,pt:.42,succ:"Six",fail:"Not six"},
    {name:"Fast-Track Clinic",claim:"Nothing changed: 60% of patients are still seen within 30 min.",p0:.6,pt:.86,succ:"Seen in 30 min",fail:"Waited longer"},
    {name:"Coffee Machine",claim:"Only 10% of cups are overfilled.",p0:.1,pt:.1,succ:"Overfilled",fail:"Fine"},
    {name:"Fridge Alarm",claim:"Only 20% of vaccine-fridge alarms are false alarms.",p0:.2,pt:.5,succ:"False alarm",fail:"Real alarm"},
    {name:"Red or Blue?",claim:"The spinner lands on red half the time.",p0:.5,pt:.5,succ:"Red",fail:"Blue"}
  ]);
  const BUDGET=60;
  const S={c:0,n:0,k:0,beads:[],p:1,phase:"collect",verdictT:0,msg:"",msgCol:C.green,gavel:0,log:[]};
  function trial(m=1){ if(S.phase!=="collect") return; const cs=CASES[S.c]; for(let i=0;i<m && S.n<BUDGET;i++){ const s=Math.random()<cs.pt; S.n++; if(s) S.k++; S.beads.push(s); } S.p=binomP(S.n,S.k,cs.p0); sfx("tick"); }
  function verdict(guilty){
    if(S.phase!=="collect") return;
    if(S.n<5){ pop("COLLECT AT LEAST 5 TRIALS",400,250,C.orange,12); sfx("bad"); return; }
    const cs=CASES[S.c], truth=cs.pt!==cs.p0, sig=S.p<.05; S.phase="verdict"; S.verdictT=0; S.gavel=1; sfx("hit");
    let pts=0, life=false, msg;
    if(guilty&&sig){ if(truth){ pts=300+(BUDGET-S.n)*3; msg="GUILTY! Strong evidence, and the claim really was false."; } else { pts=80; msg="Type I error: the claim was true. With α = 0.05 this happens 1 time in 20. Bad luck, good method."; } }
    else if(guilty&&!sig){ life=true; msg="CONVICTED WITHOUT ENOUGH EVIDENCE! p ≥ 0.05 means: don't reject the claim."; }
    else if(!guilty&&!sig){ if(!truth){ pts=200; msg="Correct. Not enough evidence against the claim, and it really was true."; } else { pts=40; msg=`Type II error: the claim was false (real rate ${Math.round(cs.pt*100)}%). More trials would have shown it.`; } }
    else { life=true; msg="IGNORED STRONG EVIDENCE! p < 0.05 means: reject the claim."; }
    S.msg=msg; S.msgCol=life?C.red:pts>=200?C.green:C.orange; addScore(pts); if(pts) pop("+"+pts,400,200,C.yellow,16);
    S.log.push({name:cs.name,guilty,p:S.p,truth});
    if(life) loseLife(null);
  }
  function next(){ if(S.c>=CASES.length-1){ endGame(true); return; } S.c++; S.n=0; S.k=0; S.beads=[]; S.p=1; S.phase="collect"; S.msg=""; }
  return {
    update(dt){ S.gavel=Math.max(0,S.gavel-dt*2.5); if(S.phase==="verdict") S.verdictT+=dt; G.timeLabel=`CASE ${S.c+1}/6`; setStat("p-VALUE",S.n?S.p.toFixed(3):"-"); },
    draw(){
      const cs=CASES[S.c];
      ctx.fillStyle="#150d0a"; ctx.fillRect(0,0,W,H); for(let y=0;y<H;y+=24){ ctx.fillStyle=y%48?"#1d120d":"#22150f"; ctx.fillRect(0,y,W,24); }
      rr(30,16,740,76,10); ctx.fillStyle="#4a2c1a"; ctx.fill(); ctx.strokeStyle=C.yellow; ctx.lineWidth=2; ctx.stroke();
      txt(`CASE ${S.c+1}: ${cs.name.toUpperCase()}`,400,42,{size:13,kind:"pix",color:C.yellow});
      txt(`The claim (H₀): ${cs.claim}`,400,70,{size:14,color:"#fff"});
      const gx=690, gy=150; ctx.save(); ctx.translate(gx,gy); ctx.rotate(-.6+S.gavel*.9); rr(-8,-50,16,60,4); ctx.fillStyle="#8b5a2b"; ctx.fill(); rr(-30,-70,60,26,6); ctx.fillStyle="#b07a40"; ctx.fill(); ctx.restore(); rr(650,170,90,14,4); ctx.fillStyle="#6b4226"; ctx.fill();
      rr(40,110,330,230,14); ctx.fillStyle="#0d0a28"; ctx.fill(); ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.stroke();
      txt("EVIDENCE",205,130,{size:11,kind:"pix",color:C.cyan});
      S.beads.forEach((b,i)=>{ const col=i%12, row=Math.floor(i/12); circ(68+col*25,160+row*30,10,b?C.green:C.red,"#ffffff40",1); });
      for(let i=S.beads.length;i<BUDGET;i++){ const col=i%12,row=Math.floor(i/12); circ(68+col*25,160+row*30,4,"#2a2560"); }
      txt(`● ${cs.succ}   ● ${cs.fail}`,205,322,{size:13,color:C.muted});
      ctx.fillStyle=C.green; ctx.fillRect(128,318,0,0);
      rr(392,200,376,140,14); ctx.fillStyle="#0d0a28"; ctx.fill(); ctx.strokeStyle=C.line; ctx.stroke();
      const obs=S.n?Math.round(S.k/S.n*100):0;
      txt(`Trials: ${S.n}/${BUDGET} · ${cs.succ}: ${S.k} (${obs}%)`,580,220,{size:14}); txt(`The claim says: ${Math.round(cs.p0*100)}%`,580,240,{size:13,color:C.yellow});
      const bx=420,bw=320,by=268; rr(bx,by,bw,22,11); ctx.fillStyle="#1a1840"; ctx.fill();
      const lp=v=>bx+bw*(1-clamp(Math.log10(Math.max(v,1e-4))/-4,0,1));
      rr(lp(S.p)-6,by-4,12,30,6); ctx.fillStyle=S.p<.05?C.red:C.green; ctx.fill();
      line(lp(.05),by-10,lp(.05),by+32,C.yellow,3); txt("α = 0.05",lp(.05),by+44,{size:12,color:C.yellow});
      txt("p = 1",bx,by+44,{size:11,color:C.muted,align:"left"}); txt("0.0001",bx+bw,by+44,{size:11,color:C.muted,align:"right"});
      txt(S.n?(S.p<.05?"p < 0.05 → strong evidence against the claim":"p ≥ 0.05 → not enough evidence yet"):"Run trials to collect evidence",580,326,{size:13,color:S.p<.05?C.red:C.green});
      if(S.phase==="collect"){ txt("TEST ×1 / ×10 to gather evidence, then rule: GUILTY (reject H₀) or NOT GUILTY",400,372,{size:14,color:C.muted}); }
      else {
        rr(40,360,720,120,14); ctx.fillStyle="#050414ee"; ctx.fill(); ctx.strokeStyle=S.msgCol; ctx.lineWidth=3; ctx.stroke();
        const words=S.msg.split(" "); let ln="",ly=392; const lines=[]; words.forEach(w=>{ ctx.font=font(16); if(ctx.measureText(ln+w).width>680){ lines.push(ln); ln=""; } ln+=w+" "; }); lines.push(ln);
        lines.forEach((l,i)=>txt(l.trim(),400,ly+i*22,{size:16,color:S.msgCol}));
        txt(`Truth: the real rate was ${Math.round(cs.pt*100)}%. ${S.verdictT>1.2?"Tap to continue":""}`,400,462,{size:13,color:C.muted});
      }
    },
    down(){ if(S.phase==="verdict" && S.verdictT>1.2) next(); },
    key(k){ if(S.phase==="verdict"){ if(S.verdictT>1.2 && (k===" "||k==="Enter")) next(); return; } if(k===" "||k==="t") trial(1); if(k==="x") trial(10); if(k==="g") verdict(true); if(k==="n") verdict(false); },
    summary(){ return `<p style="text-align:center">${S.log.filter(l=>(l.p<.05)===l.guilty).length} of ${S.log.length} verdicts followed the p-value rule.</p>`; }
  };
}

/* =====================================================================
   GAME 8 · DEFECT INVADERS · DPMO & sigma level
   ===================================================================== */
function makeInvaders(){
  const COLS=6, ROWS=3, SX=104, SY=86, OPP=3, BOTTOM=410;
  const WAVES=[{name:"PILL BOTTLES",liq:"#ffffff",cap:C.red},{name:"JUICE BOTTLES",liq:C.orange,cap:C.green},{name:"IV FLUID BOTTLES",liq:"#8fd3ff",cap:C.purple}];
  const S={w:0,prods:[],fx:0,fy:0,dir:1,gun:400,bullets:[],cool:0,shipped:0,shipDef:0,rejected:0,scrapped:0,caught:0,target:null};
  function wave(){ S.prods=[]; S.fx=60; S.fy=-6; S.dir=1; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const d=Math.random()<.28?pick(["cap","label","fill"]):null; S.prods.push({c,r,def:d,alive:true}); } }
  wave();
  const px=p=>S.fx+p.c*SX+40, py=p=>S.fy+p.r*SY+60;
  function fire(){ if(S.cool>0) return; S.cool=.32; S.bullets.push({x:S.gun,y:430}); sfx("shot"); }
  const dpmo=()=>S.shipped?S.shipDef/(S.shipped*OPP)*1e6:0;
  return {
    update(dt){
      S.cool-=dt;
      if(G.keys.ArrowLeft) S.gun-=360*dt; if(G.keys.ArrowRight) S.gun+=360*dt;
      if(S.target!=null){ const d=S.target-S.gun; S.gun+=clamp(d,-480*dt,480*dt); if(Math.abs(d)<4){ S.target=null; fire(); } }
      S.gun=clamp(S.gun,30,770);
      const speed=38+S.w*22, alive=S.prods.filter(p=>p.alive);
      S.fx+=S.dir*speed*dt;
      const xs=alive.map(px); if(xs.length && (Math.max(...xs)>760&&S.dir>0 || Math.min(...xs)<40&&S.dir<0)){ S.dir*=-1; S.fy+=26; }
      S.fy+=dt*(4+S.w*2);
      alive.forEach(p=>{ if(py(p)+30>BOTTOM){ p.alive=false; S.shipped++; if(p.def){ S.shipDef++; loseLife("DEFECT SHIPPED!",px(p),BOTTOM-20); } else pop("SHIPPED ✓",px(p),BOTTOM-20,C.cyan,9); } });
      S.bullets.forEach(b=>{ b.y-=620*dt; const hit=S.prods.filter(p=>p.alive&&Math.abs(px(p)-b.x)<22&&b.y<py(p)+32&&b.y>py(p)-32).sort((a,c)=>py(c)-py(a))[0]; if(hit){ b.dead=true; hit.alive=false; if(hit.def){ S.rejected++; addScore(100); sfx("hit"); burst(px(hit),py(hit),C.green,16); pop("REJECTED ✓",px(hit),py(hit)-30,C.green,10); } else { S.scrapped++; addScore(-50); sfx("bad"); burst(px(hit),py(hit),C.orange,10); pop("GOOD ONE SCRAPPED",px(hit),py(hit)-30,C.orange,9); } } });
      S.bullets=S.bullets.filter(b=>!b.dead&&b.y>-10);
      if(!S.prods.some(p=>p.alive)&&!G.over){ S.w++; if(S.w>=WAVES.length){ endGame(true); return; } wave(); pop(`WAVE ${S.w+1}: ${WAVES[S.w].name}`,400,250,C.yellow,14); }
      const sg=sigmaFromDpmo(dpmo()); setStat("DPMO · σ",`${Math.round(dpmo()).toLocaleString()} · ${sg.toFixed(1)}σ`); G.timeLabel=`W${S.w+1}/3`;
    },
    draw(){
      bgGrid("#05030f");
      for(let x=0;x<W;x+=40){ ctx.fillStyle=(Math.floor(x/40)+Math.floor(G.time*4))%2?"#1c1844":"#141034"; ctx.fillRect(x,BOTTOM,40,10); }

        rr(x-16,y-22,32,50,8); ctx.fillStyle="#d8e6ff22"; ctx.fill(); ctx.strokeStyle="#d8e6ff"; ctx.lineWidth=2; ctx.stroke();

      });
      S.bullets.forEach(b=>{ ctx.fillStyle=C.green; ctx.fillRect(b.x-2,b.y-10,4,14); });
      const g=S.gun; ctx.beginPath(); ctx.moveTo(g-26,476); ctx.lineTo(g+26,476); ctx.lineTo(g+14,452); ctx.lineTo(g-14,452); ctx.closePath(); ctx.fillStyle=C.cyan; ctx.fill(); ctx.fillRect(g-4,438,8,16); txt("QC",g,466,{size:8,kind:"pix",color:"#050414"});

    },

    sigma(){ return sigmaFromDpmo(dpmo()); }
  };
}

/* =====================================================================
   GAME 9 · GAUGE RANGE · Measurement system analysis
   ===================================================================== */
function makeGauge(){
  const CX=400, CY=255, RAD=170;
  const GAUGES=shuffle([
    {name:"Kitchen scale",bias:[0,0],sd:8,ans:0},
    {name:"Ear thermometer",bias:[62,-44],sd:8,ans:1},
    {name:"Old blood-pressure cuff",bias:[0,0],sd:46,ans:2},
    {name:"Bathroom scale",bias:[-58,48],sd:44,ans:3}
  ]);
  const OPTS=["<b>Accurate and precise</b><small>Tight group on the bullseye. Trust the data.</small>","<b>Precise but biased</b><small>Tight group, off-center. Calibrate it.</small>","<b>Accurate but not precise</b><small>Centered, but scattered. Repair or replace.</small>","<b>Neither</b><small>Scattered and off-center. Replace it.</small>"];
  const S={g:0,shots:[],phase:"shoot",cal:[0,0],dragStart:null};
  const groupMean=()=>{ const n=S.shots.length; return [S.shots.reduce((a,s)=>a+s[0],0)/n, S.shots.reduce((a,s)=>a+s[1],0)/n]; };
  function shoot(x,y){
    if(S.phase!=="shoot"&&S.phase!=="verify") return;
    const g=GAUGES[S.g], sx=x+g.bias[0]+S.cal[0]+randn()*g.sd, sy=y+g.bias[1]+S.cal[1]+randn()*g.sd;
    S.shots.push([sx,sy]); sfx("shot"); burst(sx,sy,C.yellow,8);
    const d=Math.hypot(sx-CX,sy-CY), ring=d<RAD*.2?100:d<RAD*.4?60:d<RAD*.6?30:d<RAD*.8?10:0; addScore(ring); if(ring) pop("+"+ring,sx,sy-14,C.yellow,10);
    if(S.phase==="shoot" && S.shots.length>=5){ S.phase="wait"; setTimeout(classify,700); }
    if(S.phase==="verify" && S.shots.length>=3){ S.phase="wait"; const m=groupMean(), ok=Math.hypot(m[0]-CX,m[1]-CY)<26; if(ok){ addScore(200); pop("CALIBRATED! +200",400,90,C.green,14); sfx("win"); } else pop("STILL OFF: SEE THE GROUP",400,90,C.orange,12); setTimeout(nextG,1300); }
  }
  function classify(){
    const g=GAUGES[S.g];
    ask({kicker:"ANALYZE THE GROUP",title:`What's wrong with the ${g.name.toLowerCase()}?`,opts:OPTS,correct:g.ans,points:250,penalty:"life",
      right:["Spot on. A good gauge: accurate (no bias) and precise (repeatable).","Right. It's precise, so you can fix the bias by calibrating. Do it now: drag the target view to pull the group onto the bullseye.","Right. Calibration can't fix scatter. A noisy gauge must be repaired or replaced.","Right. Big bias and big scatter: replace it before trusting any data."][g.ans],
      wrong:"Look at two things: where the group's center is (accuracy, bias) and how tight it is (precision, repeatability)."},ok=>{
        if(ok && g.ans===1){ S.phase="calibrate"; S.mean=groupMean(); }
        else nextG();
      });
  }
  function nextG(){ S.g++; S.shots=[]; S.cal=[0,0]; S.phase="shoot"; if(S.g>=GAUGES.length) endGame(true); }
  return {
    update(){ G.timeLabel=`G${Math.min(S.g+1,4)}/4`; setStat("PHASE",{shoot:"MEASURE ×5",wait:"...",calibrate:"CALIBRATE",verify:"VERIFY ×3"}[S.phase]||""); },
    draw(){
      bgGrid("#06120c");
      const g=GAUGES[Math.min(S.g,GAUGES.length-1)];
      [1,.8,.6,.4,.2].forEach((f,i)=>circ(CX,CY,RAD*f,i%2?"#f5f5f5":"#e9455e",null)); circ(CX,CY,4,"#050414");
      txt(`GAUGE ${S.g+1}/4: ${g.name.toUpperCase()}`,400,24,{size:13,kind:"pix",color:C.yellow});
      const off=S.phase==="calibrate"?S.cal:[0,0];
      S.shots.forEach(s=>{ const x=s[0]+(S.phase==="calibrate"?S.cal[0]:0), y=s[1]+(S.phase==="calibrate"?S.cal[1]:0); circ(x,y,7,"#050414",C.cyan,3); });
      if(S.phase==="calibrate"){ const m=S.mean; const mx=m[0]+S.cal[0], my=m[1]+S.cal[1]; line(mx-14,my,mx+14,my,C.green,3); line(mx,my-14,mx,my+14,C.green,3); txt("DRAG to move the group's center (+) onto the bullseye, then release",400,476,{size:14,color:C.green}); }
      else if(S.phase==="shoot"||S.phase==="verify"){ txt(S.phase==="shoot"?`Aim at the bullseye and tap: shot ${S.shots.length+1} of 5`:`Calibrated! Fire 3 check shots: ${S.shots.length+1} of 3`,400,476,{size:14,color:C.muted}); const p=G.ptr; circ(p.x,p.y,14,null,C.green,2); line(p.x-20,p.y,p.x+20,p.y,C.green,1.5); line(p.x,p.y-20,p.x,p.y+20,C.green,1.5); }
      rr(620,60,166,110,10); ctx.fillStyle="#050414cc"; ctx.fill(); ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.stroke();
      txt("ACCURACY",703,82,{size:9,kind:"pix",color:C.cyan}); txt("= center on target",703,100,{size:12,color:C.muted});
      txt("PRECISION",703,128,{size:9,kind:"pix",color:C.pink}); txt("= tight group",703,146,{size:12,color:C.muted});
    },
    down(x,y){ if(S.phase==="calibrate"){ S.dragStart=[x-S.cal[0],y-S.cal[1]]; return; } shoot(x,y); },
    move(x,y){ if(S.phase==="calibrate"&&S.dragStart&&G.ptr.down){ S.cal=[x-S.dragStart[0],y-S.dragStart[1]]; } },
    up(){ if(S.phase==="calibrate"&&S.dragStart){ S.dragStart=null; const m=S.mean; if(Math.hypot(m[0]+S.cal[0]-CX,m[1]+S.cal[1]-CY)<22){ sfx("good"); S.phase="verify"; S.shots=[]; pop("NOW VERIFY: 3 SHOTS",400,90,C.green,12); } } }
  };
}

/* =====================================================================
   GAME 10 · RISK DEFENSE · FMEA (RPN = S × O × D)
   ===================================================================== */
function makeFmea(){
  const PATH=[[-40,170],[250,170],[250,340],[520,340],[520,170],[690,170],[690,420]];
  const SEG=[]; let LEN=0; for(let i=1;i<PATH.length;i++){ const a=PATH[i-1],b=PATH[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]); SEG.push({a,b,l,s:LEN}); LEN+=l; }
  const at=d=>{ const s=SEG.find(s=>d<=s.s+s.l)||SEG[SEG.length-1]; const f=clamp((d-s.s)/s.l,0,1); return [s.a[0]+(s.b[0]-s.a[0])*f, s.a[1]+(s.b[1]-s.a[1])*f]; };
  const WAVES=[
    {name:"Car service",base:"DRIVER",tokens:3,modes:[["Brakes not checked",10,3,4],["Oil not topped up",5,6,3],["Tyre pressure wrong",6,7,5],["Washer fluid empty",2,8,2],["Wrong invoice",3,5,6],["Wheel bolt loose",8,4,6]]},
    {name:"Medication round",base:"PATIENT",tokens:4,modes:[["Wrong patient",10,2,3],["Dose miscalculated",9,4,5],["Dose given late",5,8,4],["Allergy not checked",9,3,4],["Chart hard to read",4,6,6],["Pump set wrong",8,4,7]]},
    {name:"Surgery day",base:"PATIENT",tokens:3,modes:[["Wrong-site surgery",10,1,2],["Instrument count wrong",8,3,5],["Poor sterilization",8,3,6],["Patient not fasting",6,4,3],["Theatre starts late",3,8,2],["Consent form missing",5,4,2]]}
  ];
  const S={w:0,enemies:[],spawnT:0,spawned:0,tokens:3,hp:100,best:new Set(),picks:0,smart:0,between:false};
  function setup(){
    const Wv=WAVES[S.w]; S.tokens=Wv.tokens; S.spawned=0; S.spawnT=.5; S.enemies=[];
    const list=Wv.modes.map(([m,s,o,d])=>({m,s,o,d,rpn:s*o*d}));
    const must=list.filter(x=>x.s>=9), rest=list.filter(x=>x.s<9).sort((a,b)=>b.rpn-a.rpn);
    S.best=new Set([...must,...rest].slice(0,Wv.tokens).map(x=>x.m));
    S.queue=shuffle(list);
  }
  setup();
  function hitTest(x,y){ return S.enemies.filter(e=>e.alive).find(e=>{ const [ex,ey]=at(e.pos), cx=clamp(ex,96,704); return Math.hypot(ex-x,ey-y)<30 || (Math.abs(cx-x)<92 && y>ey-78 && y<ey-24); }); }
  return {
    start(){ banner("WAVE 1: CAR SERVICE",`Failure modes march toward the driver. You have <b>${WAVES[0].tokens} fixes</b>. Work out RPN = S × O × D and fix the riskiest. Any severity 9-10 must always be fixed.`,"DEFEND!"); },
    update(dt){
      if(S.between) return;
      S.spawnT-=dt;
      if(S.spawnT<=0 && S.queue.length){ S.spawnT=5.4; S.enemies.push(Object.assign({pos:0,alive:true},S.queue.shift())); }
      S.enemies.forEach(e=>{ if(!e.alive) return; e.pos+=42*dt; if(e.pos>=LEN){ e.alive=false; const dmg=Math.round(e.rpn/10)+(e.s>=9?20:0); S.hp=Math.max(0,S.hp-dmg); sfx("bad"); shakeT=.3; pop(`${e.m.toUpperCase()}: −${dmg} HP`,620,380,C.red,10); if(e.s>=9) pop("NEVER IGNORE SEVERITY 9-10!",400,460,C.red,11); if(S.hp<=0) setTimeout(()=>endGame(false),300); } });
      if(!S.queue.length && !S.enemies.some(e=>e.alive) && !G.over){
        S.w++; if(S.w>=WAVES.length){ addScore(S.hp*5); endGame(true); return; }
        S.between=true; setup();
        banner(`WAVE ${S.w+1}: ${WAVES[S.w].name.toUpperCase()}`,`New failure modes. You have <b>${WAVES[S.w].tokens} fixes</b>.`,"DEFEND!",()=>{ S.between=false; });
      }
      setStat("FIXES · HP",`${S.tokens} · ${S.hp}`); G.timeLabel=`W${S.w+1}/3`;
    },
    draw(){
      bgGrid("#070512");
      ctx.beginPath(); PATH.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle="#241d5c"; ctx.lineWidth=44; ctx.lineJoin="round"; ctx.stroke(); ctx.strokeStyle=C.purple; ctx.lineWidth=2; ctx.setLineDash([10,10]); ctx.stroke(); ctx.setLineDash([]);
      const Wv=WAVES[Math.min(S.w,WAVES.length-1)];
      rr(640,420,100,64,10); ctx.fillStyle="#1a1840"; ctx.fill(); ctx.strokeStyle=C.cyan; ctx.lineWidth=3; ctx.stroke(); txt(Wv.base,690,444,{size:11,kind:"pix",color:C.cyan}); rr(652,458,76,12,6); ctx.fillStyle="#050414"; ctx.fill(); rr(652,458,76*S.hp/100,12,6); ctx.fillStyle=S.hp>60?C.green:S.hp>30?C.yellow:C.red; ctx.fill();
      txt(`WAVE ${S.w+1}: ${Wv.name.toUpperCase()} · FIXES LEFT: ${S.tokens}`,20,24,{size:12,kind:"pix",color:C.yellow,align:"left"});
      txt("Tap a failure mode to fix it. RPN = Severity × Occurrence × Detection",20,48,{size:13,color:C.muted,align:"left"});
      S.enemies.forEach(e=>{ if(!e.alive) return; const [x,y]=at(e.pos), cx=clamp(x,96,704);
        const hue=e.s>=9?C.red:e.rpn>=150?C.orange:C.purple;
        circ(x,y,20,hue,"#fff",2); circ(x-7,y-4,4,"#fff"); circ(x+7,y-4,4,"#fff"); circ(x-7,y-4,2,"#050414"); circ(x+7,y-4,2,"#050414");
        rr(cx-92,y-78,184,50,8); ctx.fillStyle="#0d0a28ee"; ctx.fill(); ctx.strokeStyle=hue; ctx.lineWidth=2; ctx.stroke();
        txt(e.m,cx,y-64,{size:13});
        [["S",e.s,C.red],["O",e.o,C.orange],["D",e.d,C.cyan]].forEach(([l,v,c],i)=>{ txt(`${l}${v}`,cx-48+i*48,y-42,{size:14,color:c}); });
      });
    },
    down(x,y){
      const e=hitTest(x,y); if(!e) return;
      if(S.tokens<=0){ pop("NO FIXES LEFT",x,y-20,C.orange,11); sfx("bad"); return; }
      S.tokens--; e.alive=false; S.picks++; const [ex,ey]=at(e.pos); burst(ex,ey,C.green,22);
      if(S.best.has(e.m)){ S.smart++; addScore(150); sfx("good"); pop(`RPN ${e.rpn} · SMART FIX +150`,ex,ey-90,C.green,10); }
      else { addScore(30); sfx("hit"); pop(`RPN ${e.rpn} · LOW PRIORITY`,ex,ey-90,C.orange,10); }
    },
    summary(){ return `<p style="text-align:center">Smart fixes: <b>${S.smart}</b> of ${S.picks}. ${G.def.id==="fmea"?`Base health left: <b>${S.hp}</b>.`:""}</p>`; },
    hp(){ return S.hp; }
  };
}

      <h2>WHAT DOES “SIGMA” MEAN?</h2>
      <p>σ (sigma) is the symbol for <b>standard deviation</b>, a measure of spread. A process's <b>sigma level</b> tells you how many defects it makes per million opportunities (<b>DPMO</b>). Higher is better:</p>
      <div class="tbl-wrap"><table class="sig-table"><thead><tr><th>LEVEL</th><th>DPMO</th><th>RIGHT FIRST TIME</th><th style="width:40%">DEFECTS (LOG SCALE)</th></tr></thead><tbody>
        ${sig.map(([s,d,y],i)=>`<tr><td>${s}σ</td><td>${d}</td><td>${y}</td><td><div class="sig-bar" style="width:${[100,90,74,55,33,12][i]}%;${s>=6?"background:var(--green)":""}"></div></td></tr>`).join("")}
      </tbody></table></div>
      <p style="color:var(--muted);font-size:14px">At 3σ a hospital pharmacy filling 10,000 prescriptions would make about 2,000 errors (3 checks each). At 6σ: about 0.1.</p>
    </section>

    <section class="panel">
      <span class="eyebrow">YOUR POWER-UPS</span>
      <h2>THREE STATS TO KNOW</h2>
      <div class="trio">
        <div class="mini"><b>Mean (average)</b><span>The center of your data. Add up, divide by the count.</span><svg viewBox="0 0 200 60"><path d="M10 55 Q60 55 80 25 Q100 0 120 25 Q140 55 190 55" fill="none" stroke="#2DE2E6" stroke-width="3"/><path d="M100 0 V58" stroke="#FFE45E" stroke-width="3" stroke-dasharray="4 4"/></svg></div>
        <div class="mini"><b>Standard deviation (σ)</b><span>The spread: how far values typically sit from the mean.</span><svg viewBox="0 0 200 60"><path d="M10 55 Q60 55 80 25 Q100 0 120 25 Q140 55 190 55" fill="none" stroke="#2DE2E6" stroke-width="3"/><path d="M75 40 H125" stroke="#FF3CAC" stroke-width="3"/><path d="M75 34 V46 M125 34 V46" stroke="#FF3CAC" stroke-width="3"/></svg></div>
        <div class="mini"><b>Variation: common vs special</b><span>Common = everyday wobble. Special = something changed. Only special causes need a hunt.</span><svg viewBox="0 0 200 60"><polyline points="10,32 30,26 50,36 70,28 90,34 110,8 130,30 150,27 170,35 190,29" fill="none" stroke="#2DE2E6" stroke-width="3"/><circle cx="110" cy="8" r="5" fill="#FF4D6D"/></svg></div>
      </div>
    </section>

    <section id="cabinets" style="display:grid;gap:12px">
      <div class="panel" style="gap:6px"><span class="eyebrow">CHOOSE YOUR GAME</span><h2>THE ARCADE</h2><p>Every cabinet teaches one tool. Read the card, press start, and beat the high score.</p></div>
      <div class="cabinets">
        ${GAMES.map((g,i)=>{ const st=SAVE.stars[g.id]||0; return `<article class="cab" style="--glow:${g.color}44">
          <div class="scr"><span class="num">#${String(i+1).padStart(2,"0")}</span><svg viewBox="0 0 160 100" aria-hidden="true">${ICON[g.id]}</svg></div>
          <h3>${esc(g.name)}</h3><span class="tool">${esc(g.tool)}</span>
          <p>${esc(g.blurb)}</p>
          <div class="meta"><span>${esc(g.phase)}</span><span class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</span></div>
          <div class="meta"><span>HI ${(SAVE.best[g.id]||0).toLocaleString()}</span><button class="btn" type="button" data-play="${g.id}">PLAY</button></div>
        </article>`; }).join("")}
      </div>
    </section>

    <section class="panel">
      <span class="eyebrow">HOW TO PLAY</span>
      <h2>RULES OF THE ARCADE</h2>
      <ol class="rules">
        <li><b>Pick a cabinet.</b> A card explains the tool, how to play and the controls. Read it, then press START.</li>
        <li><b>Controls:</b> mouse or touch work everywhere. Keyboard players use the arrow keys and <kbd>SPACE</kbd>. On phones, use the big buttons under the screen.</li>
        <li><b>Lives (♥)</b> are lost for statistical mistakes, such as tampering, wrong bins or wrong verdicts. Some games use a timer, ammo or base health instead.</li>
        <li><b>Stars:</b> 1-3 stars per game, based on how well you used the tool, not just reflexes.</li>
        <li><b>Paused?</b> Press <kbd>?</kbd>, <kbd>P</kbd> or <kbd>ESC</kbd> at any time to see the instructions again.</li>
      </ol>
    </section>
  </div>`;
  $("#go-cab").onclick=()=>$("#cabinets").scrollIntoView({behavior:reduce?"auto":"smooth"});
  document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{ sfx("coin"); startGame(b.dataset.play); });
}

/* =====================================================================
   BOOT
   ===================================================================== */
$("#b-back").onclick=goHome;
$("#b-help").onclick=showHelp;
function sndLabel(){ $("#b-snd").textContent=SAVE.muted?"✕":"♪"; $("#b-snd").setAttribute("aria-label",SAVE.muted?"Sound off. Turn on":"Sound on. Turn off"); }
$("#b-snd").onclick=()=>{ SAVE.muted=!SAVE.muted; persist(); sndLabel(); };
sndLabel();
document.addEventListener("visibilitychange",()=>{ if(document.hidden && G.game && !G.over && !G.paused) showHelp(); });
if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>SAVE);
window.__SA = {startGame, G, endGame};
renderHome();
})();
</script>
</body>
</html>
