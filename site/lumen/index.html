/*$vite$:1*/
/* Phase 1: task-first layout and accessible reading scale */
:root{--sidebar-w:234px}
body{font-size:15px}
.page-content{max-width:1600px;margin-inline:auto}
.page-title-row h1{font-size:clamp(29px,2.3vw,37px);line-height:1.18;font-weight:620}
.page-subtitle,.section-description,.book-card-info p,.continue-info p,.insight-card p,.recall-invite p,.studio-hero p,.hero-copy p{font-size:15px;line-height:1.65}
.small,.book-meta,.results-caption,.library-footnote,.insight-source,.recall-preview-card p,.studio-disclaimer{font-size:13px;line-height:1.55}
.tiny,.eyebrow,.pill,.source-chip,.quote-source,.book-card-tags,.book-progress,.focus-total,.sidebar-label{font-size:12px;line-height:1.45}
.button{font-size:14px;min-height:44px;padding:11px 18px}
.icon-button{min-width:42px;min-height:42px;width:42px;height:42px}
.reader-toolbar .icon-button{min-width:40px;min-height:40px;width:40px;height:40px}
.segmented>button{min-height:40px;font-size:13px}
.main-navigation button,.secondary-navigation button,.sidebar-settings,.global-search-button,.library-filters button{font-size:14px}
input,textarea,select{font-size:14px}
:where(button,a,input,textarea,select,summary):focus-visible{outline:3px solid #326d5b;outline-offset:3px}
.icon-button[data-tip]:is(:hover,:focus-visible):after{opacity:1;visibility:visible;transition-delay:.15s;transform:translate(-50%)translateY(0)}
.phase1-action-strip{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(450px,1.7fr);align-items:center;gap:24px;margin:20px 0 24px;padding:22px 26px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.phase1-action-intro .eyebrow{color:var(--green)}
.phase1-action-intro h2{font-family:Manrope,DM Sans,sans-serif;font-size:clamp(19px,1.6vw,25px);line-height:1.25;letter-spacing:-.7px;margin:5px 0 7px}
.phase1-action-intro p{font-size:13px;line-height:1.5;color:var(--muted)}
.phase1-action-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.phase1-action-buttons button{display:flex;align-items:center;gap:12px;min-height:82px;border-radius:14px;padding:13px 15px;text-align:left;transition:transform .18s,box-shadow .18s,background .18s}
.phase1-action-buttons button:hover{transform:translateY(-2px);box-shadow:0 8px 20px #142d1b18}
.phase1-action-buttons button>i:first-child{font-size:24px;flex:none}
.phase1-action-buttons button>i:last-child{margin-left:auto;font-size:17px;flex:none}
.phase1-action-buttons button span{display:grid;gap:4px;min-width:0}
.phase1-action-buttons strong{font-size:15px;line-height:1.25}
.phase1-action-buttons small{font-size:12px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.phase1-main-action{background:#285d49;color:#fff}
.phase1-review-action{background:var(--green-light);color:var(--ink-strong);border:1px solid var(--line)}
.hero-card{min-height:300px}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:58% center}
.hero-copy h2{font-size:clamp(39px,4vw,56px)}
.hero-image-credit{background:#1a2a2099;color:#fff;border-radius:8px;padding:4px 8px}
@media(max-width:1100px){.phase1-action-strip{grid-template-columns:1fr}.phase1-action-buttons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.phase1-action-strip{padding:18px;margin:16px 0 20px}.phase1-action-buttons{grid-template-columns:1fr}.phase1-action-buttons button{min-height:70px}.page-subtitle{max-width:none}.hero-art img{object-position:65% center}.hero-copy h2{font-size:41px}}
@media(prefers-reduced-motion:reduce){.phase1-action-buttons button{transition:none}.phase1-action-buttons button:hover{transform:none}}

/* Phase 2: guided learning and visual recall */
.phase2-lab{margin:18px 0 28px;color:var(--ink)}
.phase2-lab-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;padding:24px 28px;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0}
.phase2-lab-head h2{font-family:Instrument Serif,serif;font-size:38px;line-height:1.05;font-weight:400;margin:5px 0 8px}
.phase2-lab-head p,.phase2-instruction{font-size:14px;line-height:1.55;color:var(--muted)}
.phase2-session-count{white-space:nowrap;background:var(--green-light);color:var(--green);padding:8px 12px;border-radius:999px;font-size:12px}
.phase2-steps{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-inline:1px solid var(--line);border-bottom:1px solid var(--line);gap:4px;padding:10px 20px}
.phase2-steps button{min-height:44px;padding:8px;border-radius:9px;color:var(--muted);font-weight:650;font-size:13px}
.phase2-steps button.active{background:var(--green);color:#fff}.phase2-steps button.done{background:var(--green-light);color:var(--green)}
.phase2-panel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:26px 28px;display:grid;gap:18px}
.phase2-panel h3,.phase2-occlusion h3,.phase2-history h3{font-size:20px;line-height:1.3}
.phase2-panel textarea,.phase2-panel input,.phase2-panel select,.phase2-image-controls input,.phase2-mask-row input{width:100%;padding:12px 13px;min-height:45px;font-size:15px}
.phase2-panel textarea{line-height:1.6}
.phase2-fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(105px,.6fr);gap:14px}
.phase2-panel label,.phase2-image-controls label{display:grid;gap:7px;font-size:13px;font-weight:650}
.phase2-wide-label{max-width:850px}
.phase2-source-preview{border-left:4px solid var(--green);padding:16px 18px;background:var(--green-light);border-radius:0 12px 12px 0;display:grid;gap:10px;max-width:850px}
.phase2-source-preview p{font-size:14px;line-height:1.6;white-space:pre-wrap;max-height:170px;overflow:auto}
.phase2-inline-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.phase2-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phase2-check-grid>div{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--surface-2)}
.phase2-check-grid p{font-size:14px;line-height:1.65;white-space:pre-wrap;margin:9px 0;max-height:280px;overflow:auto}
.phase2-checkline{display:flex!important;align-items:center;gap:10px!important;font-size:14px!important}.phase2-checkline input{width:20px!important;min-height:20px!important;height:20px}
.phase2-confidence{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}.phase2-confidence span{margin-right:8px}.phase2-confidence button{width:42px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}.phase2-confidence button.selected{background:var(--green);color:#fff}
.phase2-complete{text-align:center;justify-items:center}.phase2-complete>i{font-size:44px;color:var(--green)}.phase2-complete p{font-size:14px;max-width:500px;line-height:1.6}
.phase2-occlusion,.phase2-history{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 28px;margin-top:22px;display:grid;gap:16px}
.phase2-occlusion>div:first-child p{font-size:14px;color:var(--muted);line-height:1.55;margin-top:5px}
.phase2-image-controls{display:flex;align-items:end;gap:18px;flex-wrap:wrap}.phase2-image-controls label{max-width:240px}.phase2-image-controls input[type=file]{font-size:12px;padding:8px}.phase2-image-controls>span{font-size:13px;color:var(--muted)}
.phase2-image-stage{position:relative;width:min(100%,900px);margin:auto;line-height:0;cursor:crosshair;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}.phase2-image-stage>img{width:100%;height:auto;display:block}
.phase2-mask{position:absolute;background:#17362fe6;color:#fff;border:2px solid #fff;border-radius:7px;font-size:18px;font-weight:700;line-height:1.2;min-width:35px;min-height:35px}.phase2-mask.revealed{background:#e3f1e3be;color:#17362f;border-color:#285d49;font-size:11px;overflow:hidden}
.phase2-mask-row{display:flex;align-items:center;gap:10px;max-width:500px}.phase2-mask-row input{flex:1}.phase2-image-empty{border:2px dashed var(--line);border-radius:13px;padding:30px;text-align:center;color:var(--muted);font-size:14px}
.phase2-history>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.phase2-history article{border:1px solid var(--line);border-radius:12px;padding:17px;display:grid;gap:10px}.phase2-history article strong{font-size:15px}.phase2-history article p{font-size:13px;line-height:1.55;max-height:75px;overflow:auto;white-space:pre-wrap}.phase2-history article>div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
@media(max-width:760px){.phase2-lab-head,.phase2-panel,.phase2-occlusion,.phase2-history{padding:18px}.phase2-lab-head{display:grid}.phase2-steps{padding:8px;gap:2px}.phase2-steps button{font-size:11px}.phase2-check-grid,.phase2-history>div{grid-template-columns:1fr}.phase2-fields{grid-template-columns:minmax(0,1fr) 95px}}
.phase2-meta-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;padding:18px;background:var(--surface-2);border-radius:12px}.phase2-meta-editor h3,.phase2-meta-editor p{grid-column:1/-1}.phase2-meta-editor h3{font-size:16px}.phase2-meta-editor p{font-size:13px;line-height:1.5;color:var(--muted)}.phase2-meta-editor input{min-height:42px;font-size:14px}@media(max-width:580px){.phase2-meta-editor{grid-template-columns:1fr}}

/* Phase 3: reliable daily use */
.phase3-ocr-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.phase3-ocr-actions span{font-size:13px;color:var(--muted)}
.phase3-storage-health{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface-2);display:grid;gap:9px;margin:16px 0}.phase3-storage-health h3{font-size:17px}.phase3-storage-health p{font-size:13px;line-height:1.55}.phase3-storage-health button{justify-self:start}
.phase3-load-more{display:block;margin:20px auto;padding:13px 22px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--green);font-weight:650;font-size:14px}.phase3-load-more:hover{background:var(--green-light)}

/* HCA v3 — Lumen experience layer styles. Injected after the existing HCA stylesheet. */

/* ---------- Fixes ---------- */
/* Playfair's zero reads as the letter O in metrics ("0 cards" looked like "O cards"). Numbers that are read as data use Inter, lining and even-width. */
.hca-metric strong, .hca3-tile strong, .focus-time { font-family: Inter, system-ui, sans-serif !important; font-weight: 500 !important; letter-spacing: -0.03em !important; }
.hca-metric strong, .metric-card strong, .stat-card strong, .hca-tile strong, .hca3-tile strong, .focus-duration, .hca-chart-column strong, .nav-count, .hca-badge { font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; }
/* The sidebar showed the academy name twice, the second copy truncated. */
.app-sidebar .brand-link + .sidebar-label, .app-sidebar .hca-brand ~ .sidebar-label:first-of-type { display: none; }
/* The sidebar quote card is clipped mid-word on laptop-height screens. Show it whole when there is room, otherwise leave it out. */
.app-sidebar .sidebar-note { overflow: visible; height: auto; max-height: none; flex: none; }
@media (max-height: 1000px) { .app-sidebar .sidebar-note { display: none; } }
/* Filter bars mixed 40/44/60px controls and 11px labels. One height, readable labels. */
.segmented-control button, .tabs button, .filter-tabs button, .library-tabs button { font-size: 13.5px !important; min-height: 40px; }
.library-toolbar input, .notes-toolbar input, .search-field input, .library-toolbar select, .notes-toolbar select, .studio-toolbar select { min-height: 44px; font-size: 15px; }
:where(.page-content) select { min-height: 44px; }
.button.small, .button.soft { font-size: 13.5px; }
/* Long words in titles and cards never push layouts wider than the screen. */
.app-main, .workspace-main, .page-content { min-width: 0; }
.page-content :where(h1, h2, h3, p, strong) { overflow-wrap: break-word; }

@media (max-width: 760px) {
  /* Today's resume + focus grid kept desktop column widths and made the page 458px wide on a 390px phone. */
  .hca-work-grid, .hca-lower-grid { grid-template-columns: minmax(0, 1fr) !important; }
  .hca-work-grid > *, .hca-metrics > *, .hca-resume-body > * { min-width: 0; }
  .hca-resume-body { flex-wrap: wrap; }
  .hca-resume .hca-section-head { flex-wrap: wrap; gap: 8px; }
  /* Bottom navigation pushed "Progress" off-screen. Six equal columns always fit. */
  .mobile-bottom-nav { display: grid !important; grid-template-columns: repeat(6, minmax(0, 1fr)); width: 100%; left: 0; right: 0; padding-left: 4px; padding-right: 4px; box-sizing: border-box; }
  .mobile-bottom-nav button { min-width: 0; padding-left: 0; padding-right: 0; font-size: 11px; }
  .mobile-bottom-nav button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  /* The top bar's contents were 10px wider than a 390px phone; let the page title give way. */
  .app-topbar { min-width: 0; max-width: 100vw; box-sizing: border-box; }
  .topbar-location { min-width: 0; flex-shrink: 1; overflow: hidden; }
  .topbar-location * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Hidden hover tooltips on the right-hand icons stretched the page; phones have no hover, so drop them. */
  .app-topbar [data-tip]::before, .app-topbar [data-tip]::after, .mobile-bottom-nav [data-tip]::before, .mobile-bottom-nav [data-tip]::after { display: none !important; }
  .toast-container { left: 12px; right: 12px; width: auto; max-width: calc(100vw - 24px); }
  /* The focus timer kept a two-column grid inside a one-column card. */
  .focus-widget { grid-template-columns: minmax(0, 1fr) !important; }
  .focus-widget > * { grid-column: 1 / -1 !important; min-width: 0; }
  .focus-duration, .focus-controls { width: auto !important; }
  /* Library filter tabs were wider than the screen; let them scroll sideways instead of widening the page. */
  .library-toolbar, .notes-toolbar, .studio-toolbar { flex-wrap: wrap; }
  .library-toolbar > *, .notes-toolbar > * { min-width: 0; max-width: 100%; }
  .segmented { max-width: 100%; overflow-x: auto; scrollbar-width: none; }

.tone-teal { --tone: var(--accent,#5B3FD1); } .tone-navy { --tone: #10253a; } .tone-copper { --tone: #bd764a; } .tone-blue { --tone: #1f6feb; }

/* HCA v12: the Reading room. Appended to the shared shell styles by build-web.mjs (after day.css).
   Everything is scoped to the reader (.hca-reader-root) or to body.hl-* so no other route is touched.
   No !important: the bundle's own rules are beaten by specificity (body.hs .hca-reader-root ...) and source order. */

body.hs.hl-reading .hs-tabs,

body.hs .hca-reader-root .reader-document-header{flex:none}
body.hs .hca-reader-root .reading-room{flex:1 1 auto;height:auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

body.hs .hca-reader-root .reader-bottom-toolbar,body.hs .hca-reader-root .reader-toolbar{flex:none}

/* the bundle forces this bar visible with !important (v10 mobile layer); the reader must hide it, so this one rule matches it */
body.hs.hl-reading .app-shell .mobile-bottom-nav{display:none!important}
