/* HCA v3 — Lumen experience layer styles. Injected after the existing HCA stylesheet. */

/* ---------- Fixes ---------- */
/* Playfair's zero reads as the letter O in metrics ("0 cards" looked like "O cards"). Numbers that are read as data use Inter, lining and even-width. */
.hca-metric strong, .hca3-tile strong, .focus-time { font-family: Inter, system-ui, sans-serif !important; font-weight: 500 !important; letter-spacing: -0.03em !important; }
.hca-metric strong, .metric-card strong, .stat-card strong, .hca-tile strong, .hca3-tile strong, .focus-duration, .hca-chart-column strong, .nav-count, .hca-badge { font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; }
/* The sidebar showed the academy name twice, the second copy truncated. */
.app-sidebar .brand-link + .sidebar-label, .app-sidebar .hca-brand ~ .sidebar-label:first-of-type { display: none; }
/* The sidebar quote card is clipped mid-word on laptop-height screens. Show it whole when there is room, otherwise leave it out. */
.app-sidebar .sidebar-note { overflow: visible; height: auto; max-height: none; flex: none; }
@media (max-height: 1000px) { .app-sidebar .sidebar-note { display: none; } }
/* Filter bars mixed 40/44/60px controls and 11px labels. One height, readable labels. */
.segmented-control button, .tabs button, .filter-tabs button, .library-tabs button { font-size: 13.5px !important; min-height: 40px; }
.library-toolbar input, .notes-toolbar input, .search-field input, .library-toolbar select, .notes-toolbar select, .studio-toolbar select { min-height: 44px; font-size: 15px; }
:where(.page-content) select { min-height: 44px; }
.button.small, .button.soft { font-size: 13.5px; }
/* Long words in titles and cards never push layouts wider than the screen. */
.app-main, .workspace-main, .page-content { min-width: 0; }
.page-content :where(h1, h2, h3, p, strong) { overflow-wrap: break-word; }

@media (max-width: 760px) {
  /* Today's resume + focus grid kept desktop column widths and made the page 458px wide on a 390px phone. */
  .hca-work-grid, .hca-lower-grid { grid-template-columns: minmax(0, 1fr) !important; }
  .hca-work-grid > *, .hca-metrics > *, .hca-resume-body > * { min-width: 0; }
  .hca-resume-body { flex-wrap: wrap; }
  .hca-resume .hca-section-head { flex-wrap: wrap; gap: 8px; }
  /* Bottom navigation pushed "Progress" off-screen. Six equal columns always fit. */
  .mobile-bottom-nav { display: grid !important; grid-template-columns: repeat(6, minmax(0, 1fr)); width: 100%; left: 0; right: 0; padding-left: 4px; padding-right: 4px; box-sizing: border-box; }
  .mobile-bottom-nav button { min-width: 0; padding-left: 0; padding-right: 0; font-size: 11px; }
  .mobile-bottom-nav button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  /* The top bar's contents were 10px wider than a 390px phone; let the page title give way. */
  .app-topbar { min-width: 0; max-width: 100vw; box-sizing: border-box; }
  .topbar-location { min-width: 0; flex-shrink: 1; overflow: hidden; }
  .topbar-location * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Hidden hover tooltips on the right-hand icons stretched the page; phones have no hover, so drop them. */
  .app-topbar [data-tip]::before, .app-topbar [data-tip]::after, .mobile-bottom-nav [data-tip]::before, .mobile-bottom-nav [data-tip]::after { display: none !important; }
  .toast-container { left: 12px; right: 12px; width: auto; max-width: calc(100vw - 24px); }
  /* The focus timer kept a two-column grid inside a one-column card. */
  .focus-widget { grid-template-columns: minmax(0, 1fr) !important; }
  .focus-widget > * { grid-column: 1 / -1 !important; min-width: 0; }
  .focus-duration, .focus-controls { width: auto !important; }
  /* Library filter tabs were wider than the screen; let them scroll sideways instead of widening the page. */
  .library-toolbar, .notes-toolbar, .studio-toolbar { flex-wrap: wrap; }
  .library-toolbar > *, .notes-toolbar > * { min-width: 0; max-width: 100%; }
  .segmented { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .segmented button { flex: none; }
}

/* ---------- Shared pieces ---------- */
.hca3-shell { display: flex; flex-direction: column; }
.hca3-shell > .page-content { display: contents; }
.hca3-shell > .page-content > * { order: 10; }
.hca3-shell > .page-content > .hca-page-heading { order: 1; }
.hca3-today > .hca3-plan { order: 2; }
.hca3-today > .hca3-onboard { order: 3; }
.hca3-today > .hca3-hero-toggle { order: 4; }
.hca3-today > .page-content > .hca-hero { order: 5; }
.hca3-today.hero-off > .page-content > .hca-hero { display: none; }
.hca3-progress > .page-content > .hca-metrics { order: 2; }
.hca3-progress > .hca3-insights { order: 3; }
.hca3-shell > .page-content > .hca-footer { order: 20; }

.hca3-meter { display: block; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 10px; max-width: 360px; }
.hca3-meter.wide { max-width: none; margin: 14px 0 6px; }
.hca3-meter > span { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width .4s ease; }
.hca3-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 550; white-space: nowrap; }
.hca3-chip.warm { color: #9a5427; border-color: #e6c3a6; background: #fbf1e8; }
:root[data-theme=dark] .hca3-chip.warm { color: #f0bf95; border-color: #6a4a33; background: #3a2c22; }
.hca3-chip.action { cursor: pointer; color: var(--ink-strong); }
.hca3-chip.action:hover { border-color: var(--green); }
.hca3-chip kbd, .hca3-palette kbd, .hca3-keylist kbd { font: 600 11px/1 Inter, system-ui, sans-serif; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface-2); color: var(--muted); }
.hca3-icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.hca3-icon-btn:hover { background: var(--surface-2); color: var(--ink-strong); }
.text-link.inline { min-height: 0; padding: 0; display: inline; text-decoration: underline; text-underline-offset: 3px; }
.hca3-lock { overflow: hidden; }

/* ---------- Today: plan ---------- */
.hca3-plan { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px 26px 10px; margin: 0 0 22px; box-shadow: var(--shadow); }
.hca3-plan-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.hca3-plan-head h2 { font-size: 30px; margin: 4px 0 6px; }
.hca3-plan-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.hca3-steps { list-style: none; margin: 8px 0 0; padding: 0; }
.hca3-step { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line); }
.hca3-step:first-child { border-top: 0; }
.hca3-step-index { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--green-light); color: var(--green); font: 650 14px/1 Inter, sans-serif; font-variant-numeric: lining-nums; }
.hca3-step.done .hca3-step-index { background: var(--green); color: #fff; }
.hca3-step-body { display: flex; flex-direction: column; min-width: 0; }
.hca3-step-title { display: flex; gap: 8px; align-items: center; font-weight: 620; font-size: 16.5px; color: var(--ink-strong); }
.hca3-step-title i { color: var(--green); font-size: 18px; }
.hca3-step-meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.hca3-step .button { min-height: 42px; white-space: nowrap; }
.hca3-hero-toggle { display: flex; justify-content: flex-end; margin: -6px 0 6px; }
.hca3-hero-toggle .text-link { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; min-height: 36px; }

/* ---------- Today: getting started ---------- */
.hca3-onboard { border: 1px dashed color-mix(in srgb, var(--green) 45%, var(--line)); background: color-mix(in srgb, var(--green-light) 55%, var(--surface)); border-radius: 8px; padding: 22px 24px; margin: 0 0 22px; }
.hca3-onboard-head { display: flex; justify-content: space-between; gap: 12px; }
.hca3-onboard-head h2 { font-size: 26px; margin: 4px 0 0; }
.hca3-onboard-list { list-style: none; padding: 0; margin: 6px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hca3-onboard-list button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 12px; text-align: left; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-strong); font-size: 14px; cursor: pointer; }
.hca3-onboard-list button:hover { border-color: var(--green); }
.hca3-onboard-list button span { flex: 1; min-width: 0; }
.hca3-onboard-list button i { font-size: 20px; color: var(--muted); }
.hca3-onboard-list button.done { color: var(--muted); }
.hca3-onboard-list button.done span { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
.hca3-onboard-list button.done i { color: var(--green); }

/* ---------- Progress: insights ---------- */
.hca3-insights { margin-bottom: 28px; }
.hca3-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0 26px; }
.hca3-tile { display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); }
.hca3-tile-label { display: flex; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; }
.hca3-tile-label i { color: var(--green); }
.hca3-tile strong { font: 400 30px/1.2 'Playfair Display', Georgia, serif; color: var(--ink-strong); }
.hca3-tile-detail { color: var(--muted); font-size: 13px; }
.hca3-insight-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 36px; }
.hca3-insight-grid h3 { font-size: 15px; font-weight: 650; margin: 0 0 12px; }
.hca3-insight-grid h3 ~ h3 { margin-top: 24px; }
.hca3-heatmap-wrap { overflow-x: auto; padding-bottom: 4px; }
.hca3-heatmap-months { display: grid; font-size: 11px; color: var(--muted); margin-bottom: 4px; min-width: 300px; }
.hca3-heatmap { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; min-width: 300px; }
.hca3-heatmap span, .hca3-legend span { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); min-width: 10px; }
.hca3-heatmap .l1, .hca3-legend .l1 { background: color-mix(in srgb, var(--green) 25%, var(--surface-2)); }
.hca3-heatmap .l2, .hca3-legend .l2 { background: color-mix(in srgb, var(--green) 50%, var(--surface-2)); }
.hca3-heatmap .l3, .hca3-legend .l3 { background: color-mix(in srgb, var(--green) 75%, var(--surface-2)); }
.hca3-heatmap .l4, .hca3-legend .l4 { background: var(--green); }
.hca3-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 12px; color: var(--muted); margin-top: 8px; }
.hca3-legend span { width: 12px; }
.hca3-forecast { display: grid; gap: 6px; }
.hca3-forecast > div { display: grid; grid-template-columns: 48px minmax(0, 1fr) 32px; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.hca3-forecast strong { text-align: right; color: var(--ink-strong); font-variant-numeric: tabular-nums; }
.hca3-forecast-bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hca3-forecast-bar span { display: block; height: 100%; background: var(--copper, #bd764a); border-radius: inherit; min-width: 0; }
.hca3-stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.hca3-stack span { flex-basis: 0; }
.hca3-stack .new, .hca3-stack-legend .new::before { background: #b9c3c6; }
.hca3-stack .learning, .hca3-stack-legend .learning::before { background: var(--copper, #bd764a); }
.hca3-stack .mature, .hca3-stack-legend .mature::before { background: var(--green); }
.hca3-stack-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0 14px; }
.hca3-stack-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

/* ---------- Goals dialog ---------- */
.hca3-form { display: grid; gap: 16px; }
.hca3-form > label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; color: var(--ink-strong); }
.hca3-form input[type=text], .hca3-form input:not([type]), .hca3-form input[type=date], .hca3-form input[type=number] { min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 400; }
.hca3-form fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.hca3-form legend { font-weight: 600; font-size: 14px; margin-bottom: 6px; color: var(--ink-strong); }
.hca3-radio { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.hca3-radio.checked { border-color: var(--green); background: color-mix(in srgb, var(--green-light) 60%, transparent); }
.hca3-radio input { margin-top: 4px; accent-color: var(--green); }
.hca3-radio > span { display: grid; gap: 2px; }

/* ---------- Command palette ---------- */
.hca3-palette-backdrop { position: fixed; inset: 0; z-index: 1000; background: color-mix(in srgb, #07142a 46%, transparent); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding: min(12vh, 120px) 16px 16px; animation: hca3-fade .14s ease-out; }
.hca3-palette { width: min(680px, 100%); max-height: min(70vh, 640px); display: flex; flex-direction: column; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 30px 90px #07142a40, 0 2px 8px #07142a14; overflow: hidden; animation: hca3-rise .16s ease-out; }
.hca3-palette-input { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.hca3-palette-input > i { font-size: 20px; color: var(--muted); }
.hca3-palette-input input { flex: 1; min-width: 0; height: 58px; border: 0; outline: 0; background: transparent; color: var(--ink-strong); font-size: 17px; }
.hca3-palette-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.hca3-palette-group { padding: 12px 10px 6px; font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hca3-palette-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; cursor: pointer; min-height: 44px; }
.hca3-palette-item.active { background: var(--green-light); }
.hca3-palette-icon { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 7px; background: var(--surface-2); color: var(--green); font-size: 16px; }
.hca3-palette-item.active .hca3-palette-icon { background: var(--surface); }
.hca3-palette-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }

}

}

.page-subtitle, .hca-page-heading p { margin-top: 4px !important; max-width: 70ch !important; }
@keyframes hca9-slide { to { background-position: 300% 0; } }

/* Sidebar: room for the longer Study desk */

.hca8-desk-nav > button.hca9-guide-link i { color: #6fd3c7; }

/* ---------- Today ---------- */
.hca9-today { gap: 22px; }
.hca9-today > .hca9-hero { order: 1; }
.hca9-today .hca-page-heading, .hca9-today .hca-hero, .hca9-today > .hca3-hero-toggle { display: none !important; }

.hca9-today > .hca9-saved { order: 19; }

.hca9-hero {
  position: relative; isolation: isolate; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .9fr); gap: 28px;
  padding: clamp(24px, 3.2vw, 44px); border-radius: 22px; color: #eaf3f1; background: #0d1f2d;
  box-shadow: 0 24px 60px -24px #0d1f2d99; animation: hca9-rise .7s cubic-bezier(.2, .7, .2, 1) both;
}
.hca9-aurora { position: absolute; inset: 0; z-index: -2; filter: blur(48px); opacity: .85; }
.hca9-aurora span { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: hca9-drift 18s ease-in-out infinite alternate; }
.hca9-aurora span:nth-child(1) { width: 52%; height: 90%; left: -10%; top: -30%; background: var(--accent,#5B3FD1); }
.hca9-aurora span:nth-child(2) { width: 40%; height: 70%; left: 35%; top: 50%; background: #bd764a; opacity: .55; animation-duration: 22s; animation-delay: -6s; }
.hca9-aurora span:nth-child(3) { width: 38%; height: 70%; right: -8%; top: -20%; background: #1f6feb; opacity: .45; animation-duration: 26s; animation-delay: -12s; }
.hca9-hero-grid { position: absolute; inset: 0; z-index: -1; opacity: .12; background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 38px 38px; mask-image: radial-gradient(ellipse at 30% 40%, #000 20%, transparent 75%); }
@keyframes hca9-drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(12%, 10%) scale(1.2); } }
@keyframes hca9-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.hca9-hero-copy { display: grid; gap: 16px; align-content: center; }
.hca9-kicker { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: 1.6px; font-weight: 700; color: #9fe3d9; }
.hca9-pulse { width: 8px; height: 8px; border-radius: 50%; background: #3ee0c5; box-shadow: 0 0 0 0 #3ee0c5aa; animation: hca9-pulse 2.2s infinite; }
@keyframes hca9-pulse { 70% { box-shadow: 0 0 0 10px #3ee0c500; } 100% { box-shadow: 0 0 0 0 #3ee0c500; } }
.hca9-hero h1 { margin: 0; color: #fff; font-family: 'Playfair Display', 'Instrument Serif', Georgia, serif; font-weight: 500; font-size: clamp(34px, 4vw, 60px); line-height: 1.04; letter-spacing: -1px; }
.hca9-rotator { display: inline-block; height: 1.12em; overflow: hidden; vertical-align: bottom; }
.hca9-rotator > span { display: flex; flex-direction: column; animation: hca9-words 10s cubic-bezier(.7, 0, .3, 1) infinite; }
.hca9-rotator em { display: block; height: 1.12em; font-style: italic; background: linear-gradient(90deg, #f3b58a, #6fd3c7); -webkit-background-clip: text; background-clip: text; color: transparent; }
@keyframes hca9-words { 0%, 20% { transform: translateY(0); } 25%, 45% { transform: translateY(-1.12em); } 50%, 70% { transform: translateY(-2.24em); } 75%, 95% { transform: translateY(-3.36em); } 100% { transform: translateY(0); } }
.hca9-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hca9-hero p { margin: 0; max-width: 54ch; font-size: 16px; line-height: 1.6; color: #c9dbd8; }
.hca9-cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hca9-cta .button.primary { background: #3ee0c5; border-color: #3ee0c5; color: #062a26; box-shadow: 0 8px 24px -8px #3ee0c5aa; }
.hca9-cta .button.primary:hover { transform: translateY(-1px); }
.hca9-ghost { font-size: 14px !important; display: inline-flex; gap: 7px; align-items: center; min-height: 42px; padding: 0 15px; border-radius: 8px; border: 1px solid #ffffff33; background: #ffffff10; color: #fff; font: inherit; font-weight: 600; cursor: pointer; backdrop-filter: blur(6px); transition: background .2s, transform .2s; }
.hca9-ghost:hover { background: #ffffff22; transform: translateY(-1px); }
.hca9-stats { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hca9-stats li { animation: hca9-rise .6s both; animation-delay: calc(.25s + var(--i) * .08s); }
.hca9-stats button { width: 100%; display: grid; gap: 2px; justify-items: start; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid #ffffff22; background: #ffffff0d; color: #fff; cursor: pointer; font: inherit; transition: background .2s, transform .2s; }
.hca9-stats button:hover { background: #ffffff1c; transform: translateY(-2px); }
.hca9-stats i { color: #6fd3c7; font-size: 16px; }
.hca9-stats strong { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hca9-stats span { font-size: 12px; color: #b8cbc8; }

.hca9-hero-visual { position: relative; min-height: 300px; }
.hca9-photo { position: absolute; inset: 0 0 0 8%; width: 92%; height: 100%; object-fit: cover; border-radius: 18px; box-shadow: 0 20px 50px -20px #000a; mask-image: linear-gradient(90deg, transparent 0, #000 22%); }
.hca9-photo-empty { background: linear-gradient(135deg, var(--accent,#5B3FD1), #10253a); }
.hca9-float { position: absolute; display: grid; gap: 3px; padding: 12px 14px; border-radius: 14px; background: #ffffffe6; color: #10253a; box-shadow: 0 16px 34px -14px #0008; backdrop-filter: blur(10px); animation: hca9-bob 6s ease-in-out infinite; }
.hca9-float .eyebrow { color: var(--accent,#5B3FD1); font-size: 10px; margin: 0; }
.hca9-float strong { font-size: 14px; line-height: 1.3; }
.hca9-float small { color: #5b6b7a; font-size: 11px; }
.hca9-float.f1 { left: 0; bottom: 18%; max-width: 220px; }
.hca9-float.f2 { right: 4%; top: 8%; grid-auto-flow: column; align-items: center; gap: 7px; animation-delay: -2s; }
.hca9-float.f2 i, .hca9-float.f3 i { color: var(--accent,#5B3FD1); font-size: 18px; }
.hca9-float.f3 { right: 10%; bottom: 6%; grid-auto-flow: column; align-items: center; gap: 7px; animation-delay: -4s; }
@keyframes hca9-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.hca9-section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 14px; }
.hca9-section-head h2 { margin: 2px 0 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: clamp(24px, 2.2vw, 34px); color: var(--ink-strong); }
.hca9-section-head h2 em { color: #bd764a; }
.hca9-bento { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.hca9-tile { animation: hca9-rise .6s both; animation-delay: calc(var(--i) * .07s); }
.hca9-tile.wide { grid-column: span 2; }
.hca9-tile > button {
  position: relative; overflow: hidden; width: 100%; height: 100%; min-height: 170px; display: grid; gap: 8px; align-content: start; text-align: left; cursor: pointer;
  padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
  transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s, border-color .25s;
}
.hca9-tile > button::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, #ffffff55 50%, transparent 70%); transform: translateX(-100%); transition: transform .7s; pointer-events: none; }
.hca9-tile > button:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -20px #10253a55; border-color: var(--tone); }
.hca9-tile > button:hover::after { transform: translateX(100%); }
.hca9-tile-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--tone); color: #fff; font-size: 22px; box-shadow: 0 8px 18px -8px var(--tone); }
.hca9-tile strong { font-size: 17px; line-height: 1.3; color: var(--ink-strong); }
.hca9-tile-text { font-size: 14px; line-height: 1.55; color: var(--muted); }
.hca9-tile-cta { margin-top: auto; display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 13px; color: var(--tone); }
.hca9-tile-cta i { transition: transform .2s; }
.hca9-tile > button:hover .hca9-tile-cta i { transform: translateX(4px); }
.hca9-tile.wide > button { background: linear-gradient(135deg, var(--surface) 55%, color-mix(in srgb, var(--surface) 80%, var(--tone) 20%)); }
.tone-teal { --tone: var(--accent,#5B3FD1); } .tone-navy { --tone: #10253a; } .tone-copper { --tone: #bd764a; } .tone-blue { --tone: #1f6feb; }
.tone-purple { --tone: #7a4fd1; } .tone-pink { --tone: #d03b8c; } .tone-green { --tone: #2f8f46; } .tone-sand { --tone: #9a7b3c; }

.hca9-saved { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 18px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--accent,#5B3FD1) 27%, transparent); background: color-mix(in srgb, var(--surface) 88%, var(--accent,#5B3FD1) 12%); }
.hca9-saved-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--accent,#5B3FD1); color: #fff; font-size: 20px; flex: none; }
.hca9-saved-copy { flex: 1; min-width: 220px; display: grid; gap: 2px; }
.hca9-saved-copy span { font-size: 13px; color: var(--muted); }
.hca9-saved-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Readable recall cards ---------- */
.review-card-face { background: #fffdf8 !important; color: #10253a !important; border: 1px solid #e3ddd0 !important; box-shadow: inset 0 4px 0 var(--accent,#5B3FD1), 0 10px 30px -18px #10253a66; }
.review-card-face.back { background: #0f3d3b !important; color: #f4fbf9 !important; border-color: #0f3d3b !important; box-shadow: inset 0 4px 0 #3ee0c5; }
.review-card-face > .eyebrow { color: var(--accent,#5B3FD1) !important; font-size: 11px !important; letter-spacing: 2px !important; font-weight: 700; }
.review-card-face.back > .eyebrow { color: #8fe6d8 !important; }
.review-card-face > strong { font-family: 'DM Sans', Manrope, system-ui, sans-serif !important; font-weight: 600 !important; font-size: clamp(22px, 2.1vw, 28px) !important; line-height: 1.4 !important; max-width: 620px !important; letter-spacing: -.2px; }
.review-card-face .flip-hint { color: #4d5f6e !important; font-size: 13px !important; font-weight: 600; }
.review-card-face.back .flip-hint { color: #b9e6df !important; }
.review-card-face .flip-hint > i { font-size: 15px !important; }
.recall-preview-card h3 { font-size: 17px !important; font-weight: 650 !important; line-height: 1.5 !important; color: var(--ink-strong); }
.recall-preview-card > details { font-size: 13px !important; color: #4d5f6e !important; }
.recall-preview-card details > p { font-size: 15px !important; line-height: 1.6 !important; color: var(--ink) !important; background: var(--canvas); border-left: 3px solid var(--accent,#5B3FD1); padding: 10px 12px !important; border-radius: 6px; }
[data-theme=dark] .review-card-face { background: #1d2a33 !important; color: #f1f5f4 !important; border-color: #2c3b45 !important; }
[data-theme=dark] .review-card-face .flip-hint { color: #b7c6cc !important; }
[data-theme=dark] .recall-preview-card > details { color: #b7c6cc !important; }

/* ---------- Storage window ---------- */
.hca9-saved-win { left: 262px; top: 70px; width: min(860px, calc(100vw - 284px)); height: min(700px, calc(100vh - 90px)); }
.hca9-store-diagram { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 6px; }
.hca9-store-diagram .node { display: grid; justify-items: center; text-align: center; gap: 2px; padding: 12px 8px; border-radius: 12px; background: var(--canvas); border: 1px solid var(--line); }
.hca9-store-diagram .node i { font-size: 22px; color: var(--accent,#5B3FD1); }
.hca9-store-diagram .node.device { background: #10253a; color: #fff; border-color: #10253a; }
.hca9-store-diagram .node.device i { color: #6fd3c7; }
.hca9-store-diagram .node small { font-size: 11px; color: var(--muted); }
.hca9-store-diagram .node.device small { color: #b8cbc8; }
.hca9-store-diagram .flow { display: grid; justify-items: center; gap: 3px; min-width: 70px; }
.hca9-store-diagram .flow span { width: 100%; height: 3px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--accent,#5B3FD1) 0 8px, transparent 8px 14px); background-size: 28px 3px; animation: hca9-flow 1s linear infinite; }
.hca9-store-diagram .flow small { font-size: 10px; color: var(--muted); white-space: nowrap; }
@keyframes hca9-flow { to { background-position: 28px 0; } }
.hca9-store-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.hca9-store-table th { text-align: left; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
.hca9-store-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.hca9-store-table td:first-child { display: flex; gap: 8px; }
.hca9-store-table td:first-child i { color: var(--accent,#5B3FD1); font-size: 17px; }
.hca9-store-table td span { display: grid; }
.hca9-store-table small { color: var(--muted); }
.hca9-callouts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hca9-callouts > div { padding: 12px 14px; border-radius: 10px; font-size: 13px; }
.hca9-callouts ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.45; }
.hca9-callouts .ok { background: #e3f2ef; color: #0b4a46; }
.hca9-callouts .warn { background: #fff2e2; color: #6a3d12; }
.hca9-store-meter { display: grid; gap: 6px; font-size: 13px; }

/* ---------- Guide ---------- */
.hca9-guide-win { left: 262px; top: 70px; width: min(940px, calc(100vw - 284px)); height: min(680px, calc(100vh - 90px)); }
.hca9-guide-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.hca9-guide-tabs button { display: inline-flex; gap: 6px; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.hca9-guide-tabs button[aria-pressed=true] { background: #10253a; border-color: #10253a; color: #fff; }
.hca9-guide-intro { padding: 16px 18px; border-radius: 14px; background: linear-gradient(120deg, #10253a, #0f4b48); color: #eaf3f1; }
.hca9-guide-intro h3 { margin: 0 0 6px; color: #fff; font-size: 20px; }
.hca9-guide-intro p { margin: 0; line-height: 1.6; color: #c9dbd8; }
.hca9-guide-overview h4 { margin: 4px 0 0; font-size: 15px; }
.hca9-guide-overview { display: grid; gap: 14px; }
.hca9-flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; position: relative; }
.hca9-flow::before { content: ''; position: absolute; left: 7%; right: 7%; top: 24px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent,#5B3FD1), #bd764a); transform-origin: left; animation: hca9-grow 1.4s .2s both; }
@keyframes hca9-grow { from { transform: scaleX(0); } }
.hca9-flow li { position: relative; animation: hca9-rise .5s both; animation-delay: calc(.2s + var(--i) * .12s); }
.hca9-flow button { width: 100%; display: grid; justify-items: center; text-align: center; gap: 4px; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; padding: 0; }
.hca9-flow-dot { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent,#5B3FD1); color: var(--accent,#5B3FD1); font-size: 20px; transition: transform .2s, background .2s; }
.hca9-flow button:hover .hca9-flow-dot { transform: scale(1.1); background: var(--accent,#5B3FD1); color: #fff; }
.hca9-flow strong { font-size: 13px; }
.hca9-flow small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.hca9-when-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hca9-when-grid > div { align-content: start; display: grid; gap: 4px; padding: 12px; border-radius: 10px; background: var(--canvas); border: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
.hca9-when-grid strong { color: var(--accent,#5B3FD1); }
.hca9-guide-topic { display: grid; gap: 14px; animation: hca9-rise .35s both; }
.hca9-guide-topic > header { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.hca9-guide-topic > header > div { flex: 1; min-width: 220px; }
.hca9-guide-topic h3 { margin: 0; font-size: 22px; }
.hca9-guide-topic header p { margin: 4px 0 0; color: var(--muted); line-height: 1.5; }
.hca9-guide-icon { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg, var(--accent,#5B3FD1), #10253a); color: #fff; font-size: 26px; }
.hca9-guide-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hca9-guide-cols section { padding: 14px 16px; border-radius: 12px; background: var(--canvas); border: 1px solid var(--line); }
.hca9-guide-cols h4 { margin: 0 0 8px; display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--accent,#5B3FD1); }
.hca9-guide-cols ol, .hca9-guide-cols ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.5; font-size: 14px; }
.hca9-tip { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 12px 14px; border-radius: 10px; background: #fff7e6; color: #6a4a12; font-size: 14px; line-height: 1.5; }
.hca9-tip i { color: #bd764a; font-size: 18px; }

/* ---------- Techniques ---------- */
.hca9-tech-win { left: 262px; top: 64px; width: min(1000px, calc(100vw - 284px)); height: min(720px, calc(100vh - 80px)); }
.hca9-chapters { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.hca9-chapters button { width: 100%; display: grid; justify-items: center; gap: 4px; border: 0; background: none; cursor: pointer; padding: 4px 0; color: var(--muted); font: inherit; }
.hca9-chapters span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); font-weight: 700; font-size: 13px; background: var(--surface); transition: all .25s; }
.hca9-chapters em { font-style: normal; font-size: 10.5px; line-height: 1.2; text-align: center; }
.hca9-chapters button.seen span { border-color: var(--accent,#5B3FD1); color: var(--accent,#5B3FD1); }
.hca9-chapters button[aria-current] span { background: var(--accent,#5B3FD1); border-color: var(--accent,#5B3FD1); color: #fff; transform: scale(1.12); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent,#5B3FD1) 13%, transparent); }
.hca9-chapters button[aria-current] em { color: var(--ink-strong); font-weight: 700; }
.hca9-chapter { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 22px; align-items: start; animation: hca9-rise .45s both; }

/* ---------- 10. Fixes found in the audit ---------- */
/* Pen/Marker switch: the selected side used the (light in dark mode) strong ink with white text */
:root[data-theme=dark] .hca-reader-root .hca7-seg button[aria-pressed=true]{background:#5B3FD1;color:#fff}
/* the pop-out toggle keeps its label in the window, but only an icon next to Close in the narrow docked column */
body.hs .hca-reader-root .hl-sh .hl-pop span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.hs .hca-reader-root .hl-sh .hl-pop{min-width:44px;justify-content:center;padding:0}

/* HCA v13: the arranged reader toolbar and the "Customise toolbar" dialog (src/toolbar.js). Appended after reader.css by build-web.mjs.
   The bar is one flex row: .hl-items (groups of buttons, in the learner's order) then .hl-tail (More and the gear, always last).
   toolbar.js decides how much fits: names become icons from the right ([data-ico]), then buttons from the right get .hl-spill and live under More.
   No !important: specificity (body.hs .hca-reader-root ...) beats the bundle's own rules. */

/* ---------- The bar ---------- */
body.hs .hca-reader-root .hl-tools{display:flex;align-items:center;flex-wrap:nowrap;gap:8px;flex:1 1 0;min-width:0;width:100%;max-width:100%;margin:0}

body.hs .hca-reader-root .hl-it{display:flex;align-items:center;flex:none}
body.hs .hca-reader-root .hl-it.hl-spill,body.hs .hca-reader-root .hl-group.hl-empty{display:none}
body.hs .hca-reader-root .hl-group{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);flex:none}
body.hs .hca-reader-root .hl-group.hl-solo{padding:0;border:0;border-radius:0;background:none}
body.hs .hca-reader-root .hl-tail{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}

body.hs .hca-reader-root .hl-tools .hca-reader-tool{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;min-width:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
body.hs .hca-reader-root .hl-tools .hca-reader-tool:hover:not(:disabled){background:var(--surface)}
body.hs .hca-reader-root .hl-tools .hca-reader-tool.active,body.hs .hca-reader-root .hl-tools .hca-reader-tool.active:hover:not(:disabled){background:var(--green-light);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
body.hs .hca-reader-root .hl-tools .hca-reader-tool:disabled{opacity:.45}
body.hs .hca-reader-root .hl-tools .hca-reader-tool i{font-size:18px;color:var(--green)}
body.hs .hca-reader-root .hl-tools .hl-menu>summary{position:relative}
/* the bundle hides the name inside menu buttons below 1500px wide; the bar decides that itself */
body.hs .hca-reader-root .hl-tools .hl-menu>summary>span{display:inline}

/* reading view: three buttons, the chosen one raised (not green: it is a choice, not a tool that is on) */
body.hs .hca-reader-root .hl-views{display:flex;align-items:center;gap:2px}
body.hs .hca-reader-root .hl-tools .hl-view-btn{color:var(--muted)}
body.hs .hca-reader-root .hl-tools .hl-view-btn i{color:inherit}
body.hs .hca-reader-root .hl-tools .hl-view-btn[aria-pressed=true]{background:var(--surface);color:var(--ink-strong);box-shadow:0 1px 3px rgba(16,37,58,.14)}

/* icons only (per button, from the right): the name stays in the page for screen readers and as the tooltip, but is not drawn */
body.hs .hca-reader-root .hl-tools :is(.hl-it,.hl-tail)[data-ico="1"]:not([data-hl-try="lab"]) :is(.hca-reader-tool,.hl-menu>summary)>span:not(.hl-sr),
body.hs .hca-reader-root .hl-tools :is(.hl-it,.hl-tail)[data-hl-try="ico"] :is(.hca-reader-tool,.hl-menu>summary)>span:not(.hl-sr){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.hs .hca-reader-root .hl-tools :is(.hl-it,.hl-tail)[data-ico="1"]:not([data-hl-try="lab"]) .hca-reader-tool,
body.hs .hca-reader-root .hl-tools :is(.hl-it,.hl-tail)[data-hl-try="ico"] .hca-reader-tool{padding:0 8px}

/* a tool that is on but lives under More says so on the More button */
.hl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.hs .hca-reader-root .hl-more.has-active>summary{border-color:var(--green)}
body.hs .hca-reader-root .hl-more .hl-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--surface)}
body.hs .hca-reader-root .hl-more-menu .hl-more-foot{position:sticky;bottom:-8px;margin:8px -8px -8px;padding:6px 8px 8px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 14px 14px}
body.hs .hca-reader-root .hl-menu .hca-reader-more-menu p.hl-menu-sec{margin:8px 12px 2px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* the gear at the end of the bar */
body.hs .hca-reader-root .hl-gear{display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;min-width:40px;height:40px;padding:0;border:1px solid transparent;border-radius:12px;background:none;color:var(--muted);cursor:pointer}
body.hs .hca-reader-root .hl-gear:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
body.hs .hca-reader-root .hl-gear i{font-size:19px}
@container hlmain (max-width:599px){
  body.hs .hca-reader-root .hl-gear{display:none}
  body.hs .hca-reader-root .hl-items,body.hs .hca-reader-root .hl-tools{gap:4px}
}
@media (pointer:coarse),(max-width:759px){
  body.hs .hca-reader-root .hl-tools .hca-reader-tool{min-height:44px;min-width:44px}
  body.hs .hca-reader-root .hl-gear{width:44px;min-width:44px;height:44px}

/* HCA v13: Workspace storage ("Your learning space"). Appended to the shared shell styles by build-web.mjs (after reader.css).
   Scoped to .space-modal, .space-ask, .sp-mini and .sp-gap, so nothing else is touched. No !important. No animation. */
.space-modal,.space-ask,.sp-mini,.sp-gap{--sp-acc:#5B3FD1;--sp-acc-soft:#EEEAFD;--sp-warn-bg:#FFF3D6;--sp-warn-ink:#6E4300;--sp-full-bg:#FDEAEA;--sp-full-ink:#872626;--sp-ok-ink:#1D6046;--sp-c1:#5B3FD1;--sp-c2:#0F8A86;--sp-c3:#3557D6;--sp-c4:#B4506E;--sp-c5:#6B7A8A;--sp-track:#E7E2D8}
:root[data-theme=dark] .space-modal,:root[data-theme=dark] .space-ask,:root[data-theme=dark] .sp-mini,:root[data-theme=dark] .sp-gap{--sp-acc:#B9ABFF;--sp-acc-soft:#2D2950;--sp-warn-bg:#3A2F14;--sp-warn-ink:#F3D590;--sp-full-bg:#412126;--sp-full-ink:#F6B8B8;--sp-ok-ink:#9BD9BC;--sp-c1:#A592FF;--sp-c2:#4FC3BE;--sp-c3:#8FA7FF;--sp-c4:#E58BA5;--sp-c5:#9AA8B6;--sp-track:#3A463E}

.modal.space-modal{max-width:780px}

.space-modal .modal-body{padding-bottom:28px}
.space-modal button,.space-modal input,.space-modal select,.space-ask button{font-family:inherit}

.sp-hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

.sp-intro{display:flex;gap:12px;align-items:flex-start;margin:0;font-size:15px;line-height:1.6;color:var(--muted)}
.sp-intro i{flex:none;margin-top:2px;font-size:20px;color:var(--sp-acc)}

.sp-live{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-strong)}

.sp-card{position:relative;margin:16px 0 0;padding:18px 18px 20px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--ink) 3%,var(--surface))}

.sp-lead{margin:0 0 14px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.sp-small{margin:12px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.sp-warn{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--sp-warn-ink)}

/* the meter */
.sp-meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.sp-meter-head>h3{margin:0;font-family:inherit;font-size:19px;font-weight:650;color:var(--ink-strong)}

.sp-bar{display:flex;width:100%;height:100%}

.sp-seg.c1{background:var(--sp-c1)}.sp-seg.c2{background:var(--sp-c2)}.sp-seg.c3{background:var(--sp-c3)}.sp-seg.c4{background:var(--sp-c4)}.sp-seg.c5{background:var(--sp-c5)}

.sp-state.is-full{background:var(--sp-full-bg);color:var(--sp-full-ink)}
.sp-legend{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.sp-legend li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center}

.sp-sug{list-style:none;margin:0;padding:0}

.sp-src-meta,.sp-src-att{font-size:13.5px;line-height:1.45;color:var(--muted)}
.sp-chip{padding:4px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink);background:var(--surface)}
.sp-chip.st-notes{border-color:transparent;background:var(--sp-warn-bg);color:var(--sp-warn-ink)}
.sp-chip.st-folder{border-color:transparent;background:var(--sp-acc-soft);color:var(--sp-acc)}
.sp-chip.st-missing{border-color:transparent;background:var(--sp-full-bg);color:var(--sp-full-ink)}
.sp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sp-actions .button{margin-top:0}
.space-modal .button.sp-danger{color:var(--sp-full-ink);border-color:color-mix(in srgb,var(--sp-full-ink) 40%,var(--line))}
.sp-confirm{margin-top:12px;padding:14px;border-radius:12px;background:var(--sp-warn-bg);border:1px solid color-mix(in srgb,var(--sp-warn-ink) 25%,transparent)}
.sp-confirm>strong{display:block;font-size:15.5px;color:var(--sp-warn-ink)}
.sp-confirm>p{margin:6px 0 0;font-size:14.5px;line-height:1.55;color:var(--sp-warn-ink)}
.sp-working{margin:10px 0 0;font-size:14px;color:var(--muted)}
.sp-more{margin-top:12px}
.sp-none{display:grid;gap:8px;justify-items:start}
.sp-none>strong{font-size:16px;color:var(--ink-strong)}
.sp-none>span{font-size:14.5px;line-height:1.55;color:var(--muted)}

/* where the space lives, and the limit */
.sp-radios{display:grid;gap:10px}
.sp-where{grid-template-columns:repeat(3,minmax(0,1fr))}
.sp-radio{position:relative;display:grid;align-content:start;gap:4px;min-height:44px;padding:14px 44px 14px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.sp-radio i{font-size:22px;color:var(--sp-acc)}
.sp-radio strong{font-size:15.5px;font-weight:650;color:var(--ink-strong)}
.sp-radio small{font-size:13.5px;line-height:1.45;color:var(--muted)}
.sp-radio:hover{border-color:color-mix(in srgb,var(--sp-acc) 55%,var(--line))}
.sp-radio.on{border-color:var(--sp-acc);background:var(--sp-acc-soft)}
.sp-radio:focus-visible,.sp-check input:focus-visible,.sp-custom input:focus-visible,.sp-custom select:focus-visible{outline:3px solid var(--sp-acc);outline-offset:2px}
.sp-where .sp-radio::after{content:'';position:absolute;top:14px;right:14px;width:20px;height:20px;box-sizing:border-box;border:2px solid var(--muted);border-radius:50%}
.sp-where .sp-radio.on::after{border-color:var(--sp-acc);background:radial-gradient(circle,var(--sp-acc) 0 4.5px,transparent 5.5px)}
.sp-radio.off{border-style:dashed;background:transparent;cursor:default}
.sp-where-body{margin-top:14px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.sp-where-body p{margin:0 0 12px}
.sp-folder{display:flex;gap:12px;align-items:flex-start}
.sp-folder i{flex:none;margin-top:2px;font-size:22px;color:var(--sp-acc)}
.sp-folder small{display:block;font-size:13.5px;line-height:1.45;color:var(--muted)}
.sp-callout{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;padding:14px;border-radius:12px;background:var(--sp-acc-soft);color:var(--ink)}
.sp-callout>i{flex:none;margin-top:2px;font-size:20px;color:var(--sp-acc)}
.sp-callout>div{display:grid;gap:8px;justify-items:start;min-width:0}
.sp-callout p{margin:0}
.sp-callout.is-warn{background:var(--sp-warn-bg);color:var(--sp-warn-ink)}
.sp-callout.is-warn>i{color:var(--sp-warn-ink)}
.sp-check{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:8px 0;cursor:pointer;font-size:15px;line-height:1.45;color:var(--ink-strong)}
.sp-check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--sp-acc)}
.sp-check small{display:block;font-size:13.5px;color:var(--muted)}
.sp-limits{display:flex;flex-wrap:wrap}
.sp-limits .sp-radio{min-width:92px;padding:10px 18px;place-items:center;text-align:center;font-size:15.5px;font-weight:600}
.sp-limits .sp-radio.on{border-width:2.5px;font-weight:700;color:var(--ink-strong)}
.sp-custom{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.sp-custom label{font-size:14.5px;font-weight:600;color:var(--ink-strong)}
.sp-custom input,.sp-custom select{height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
.sp-custom input{width:130px}
.sp-custom .sp-warn{flex-basis:100%;margin:0}

/* protection and backup */
.sp-prot{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
.sp-prot>i{flex:none;margin-top:1px;font-size:24px;color:var(--muted)}
.sp-prot.on>i{color:var(--sp-ok-ink)}
.sp-prot strong{display:block;font-size:16px;font-weight:650;color:var(--ink-strong)}
.sp-prot small{display:block;margin-top:2px;font-size:14px;line-height:1.5;color:var(--muted)}
.space-modal .file-button{min-height:44px}

/* the compact card in the privacy dialog, and the line in "Your work and where it lives" */
.sp-mini{margin:0 0 20px}
.sp-mini .sp-mini-line{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.sp-mini .sp-mini-line strong{font-size:22px;color:var(--ink-strong)}
.sp-mini .sp-bar{height:12px;margin:12px 0;border-radius:99px;background:var(--sp-track);overflow:hidden}
.sp-mini .sp-mini-note{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--muted)}
.sp-mini .sp-mini-note i{flex:none;margin-top:1px;font-size:18px;color:var(--sp-acc)}
.sp-inline{display:grid;gap:8px;justify-items:start;margin:0}
.sp-inline .sp-bar{width:min(320px,100%);height:10px;border-radius:99px;background:var(--sp-track);overflow:hidden}

/* the reader's "no file here" panel */
.sp-gap{display:grid;gap:10px;justify-items:center}
.sp-gap .sp-warn{max-width:420px;text-align:center}

@media (max-width:760px){
  .space-modal .modal-header h2{font-size:30px;max-width:none}
  .sp-card{padding:14px 14px 16px}
  .sp-where{grid-template-columns:1fr}
  .sp-sug li{grid-template-columns:minmax(0,1fr)}
  .sp-sug .button,.sp-actions .button{flex:1 1 100%}
  .sp-src-top{grid-template-columns:40px minmax(0,1fr)}
  .sp-src-top .sp-chip{grid-column:2;justify-self:start}
  .sp-meter-num strong{font-size:26px}
  .sp-limits .sp-radio{flex:1 1 calc(50% - 5px)}
  .space-ask .modal-footer{flex-direction:column;align-items:stretch}
  .space-ask .modal-footer .button{width:100%}
}
@media (forced-colors:active){
  .sp-seg,.sp-sw{forced-color-adjust:none}
  .sp-radio.on{outline:2px solid Highlight}
}

.hcaw-min{display:none!important}
.hcaw-dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:1250;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:calc(100vw - 32px);padding:6px;border-radius:14px;background:var(--surface,#fffdf8);border:1px solid var(--line,rgba(16,37,58,.14));box-shadow:0 8px 28px rgba(16,37,58,.18)}
.hcaw-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line,rgba(16,37,58,.14));background:transparent;color:inherit;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.hcaw-chip:hover{background:rgba(16,37,58,.06)}
.hcaw-chip i,.hcaw-chip svg{font-size:15px}
.hcaw-close{color:#9e3e3e}
@media (max-width:1023px){.hcaw-dock{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
