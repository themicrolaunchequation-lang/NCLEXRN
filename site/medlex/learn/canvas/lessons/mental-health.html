 Health Organization / Mental disorders","url":"https://www.who.int/news-room/fact-sheets/detail/mental-disorders"}],"blocks":[{"type":"fact","title":"Anxiety","text":"01 Apprehension or worry, often about anticipated threat. It can occur as an ordinary experience or a clinical symptom."},{"type":"fact","title":"Generalized anxiety disorder · GAD","text":"02 Persistent, difficult-to-control worry across everyday areas, with other symptoms and interference in life."},{"type":"fact","title":"Panic attack","text":"03 An abrupt surge of intense fear or discomfort with psychological and physical symptoms."},{"type":"fact","title":"Panic disorder","text":"04 Recurrent unexpected panic attacks with ongoing concern or related behavioural change."},{"type":"quiz","items":[{"text":"Which statement is supported by the terminology?","answers":["One panic attack always proves panic disorder","A panic attack is an episode; panic disorder is a diagnosis","Anxiety only produces psychological symptoms","GAD means generalized affect disorder"],"correct":1,"why":"A panic attack describes an episode. Panic disorder requires a broader clinical pattern and assessment."}],"label":""}],"art":{"src":"shared/img/art-0a21c504cf50ab14.webp","alt":"A head and a lotus, for mental health"},"prompts":[],"contextNotes":[],"panels":[{"type":"insights","items":[{"type":"fact","title":"Anxiety","text":"01 Apprehension or worry, often about anticipated threat. It can occur as an ordinary experience or a clinical symptom."},{"type":"fact","title":"Generalized anxiety disorder · GAD","text":"02 Persistent, difficult-to-control worry across everyday areas, with other symptoms and interference in life."},{"type":"fact","title":"Panic attack","text":"03 An abrupt surge of intense fear or discomfort with psychological and physical symptoms."}],"id":"9-0"},{"type":"insights","items":[{"type":"fact","title":"Panic disorder","text":"04 Recurrent unexpected panic attacks with ongoing concern or related behavioural change."}],"id":"9-1"},{"type":"quiz","question":{"text":"Which statement is supported by the terminology?","answers":["One panic attack always proves panic disorder","A panic attack is an episode; panic disorder is a diagnosis","Anxiety only produces psychological symptoms","GAD means generalized affect disorder"],"correct":1,"why":"A panic attack describes an episode. Panic disorder requires a broader clinical pattern and assessment."},"id":"9-2"}],"role":"assessment"},{"index":10,"title":"Obsessions, compulsions, and trauma-related terms","titleHTML":"Obsessions, compulsions, and trauma-related terms","kicker":"Clinical terms","subtitle":"Clinical terms / The words describe different experiences.","references":[{"label":"World Health Organization / Mental disorders","url":"https://www.who.int/news-room/fact-sheets/detail/mental-disorders"},{"label":"NIMH · Obsessive-compulsive disorder","url":"https://www.nimh.nih.gov/health/publications/obsessive-compulsive-disorder-when-unwanted-thoughts-or-repetitive-behaviors-take-over"},{"label":"NIMH · Post-traumatic stress disorder","url":"https://www.nimh.nih.gov/health/publications/post-traumatic-stress-disorder-ptsd"},{"label":"MSD Manual · Depersonalisation / derealisation","url":"https://www.msdmanuals.com/professional/psychiatric-disorders/dissociative-disorders/depersonalization-derealization-disorder"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"}],"blocks":[{"type":"fact","title":"Obsession / compulsion","text":"OCD VOCABULARY Obsession: recurrent intrusive, unwanted thoughts, images, or urges. Compulsion: repetitive behaviour or a mental act, often performed in response to an obsession. A mental act can be a compulsion Repeating words silently or counting can be compulsive, even when no outward ritual is visible."},{"type":"fact","title":"PTSD / dissociation","text":"TRAUMA VOCABULARY PTSD: post-traumatic stress disorder, involving a persistent pattern after traumatic exposure. Dissociation: disruption in the usual integration of awareness, memory, identity, or perception. Two related descriptions Depersonalisation: feeling detached from oneself. Derealisation: surroundings feel unreal. These are distinct from hallucinations."},{"type":"fact","title":"","text":"OCD is more than a preference for order. Exposure to trauma alone does not establish PTSD. Exact diagnostic requirements differ across classification systems."}],"art":{"src":"shared/img/art-0a21c504cf50ab14.webp","alt":"A head and a lotus, for mental health"},"prompts":[],"contextNotes":[],"layoutHint":"single-concept","panels":[{"type":"insights","items":[{"type":"fact","title":"Obsession / compulsion","text":"OCD VOCABULARY Obsession: recurrent intrusive, unwanted thoughts, images, or urges. Compulsion: repetitive behaviour or a mental act, often performed in response to an obsession. A mental act can be a compulsion Repeating words silently or counting can be compulsive, even when no outward ritual is visible."},{"type":"fact","title":"PTSD / dissociation","text":"TRAUMA VOCABULARY PTSD: post-traumatic stress disorder, involving a persistent pattern after traumatic exposure. Dissociation: disruption in the usual integration of awareness, memory, identity, or perception. Two related descriptions Depersonalisation: feeling detached from oneself. Derealisation: surroundings feel unreal."},{"type":"fact","title":"PTSD / dissociation · continued","text":"These are distinct from hallucinations."}],"id":"10-0"},{"type":"insights","items":[{"type":"fact","title":"","text":"OCD is more than a preference for order. Exposure to trauma alone does not establish PTSD. Exact diagnostic requirements differ across classification systems."}],"id":"10-1"}],"role":"editorial-cards"},{"index":11,"title":"Thought and perception: locate the difference","titleHTML":"Thought and perception: locate the difference","kicker":"Clinical terms","subtitle":"Clinical terms / Psychosis is a clinical state, trength or identifying imprint.","meaning":"Strength is the amount per dosage unit. Dose is the amount administered at one time. Formulation, route and regimen influence the drug’s journey; appearance cannot supply those details.","remember":"One unit is not always one dose. Read the verified label and instruction; never identify a medicine or strength from colour or shape alone.","key":"tablets","src":"shared/img/review-b3-tablets.webp","thumb":"shared/img/review-b3-tablets-thumb.webp","limit":"Generic fictional product only. Not a medicine identification, prescribing, administration or dosing recommendation.","references":[{"title":"FDA · Generic drug facts","url":"https://www.fda.gov/drugs/generic-drugs/generic-drug-facts"},{"title":"IUPHAR · Clinical pharmacokinetics","url":"https://pharmacologyeducation.org/clinical-pharmacokinetics/"}]}},"font":"Segoe UI"}</script><script type="application/json" id="savedCanvasState">{}</script><script>/* MedLex Canvas Studio: fixed viewport, content-specific slides, self-contained assets. */

// Image-only enlargement: hover/focus on desktop, tap on touch screens.
let imagePreviewTimer=null,previewSource=null;
function hideImagePreview(){clearTimeout(imagePreviewTimer);const box=$('#imageHoverPreview');if(box)box.hidden=true;if(previewSource)previewSource.removeAttribute('aria-describedby');previewSource=null;}
function enlargedImageSource(im){const asset=im.dataset.asset,guide=Object.values(cfg.guide||{}).find(g=>g.thumb===asset);return guide&&cfg.assets[guide.src]?data(guide.src):im.currentSrc||im.src;}
function showImagePreview(im,immediate=false){
 hideImagePreview();if(dialog.open||$('#imageLightbox').open||editing||tool!=='pointer')return;
 const reveal=()=>{
  if(!im.isConnected)return;
  const box=$('#imageHoverPreview'),large=$('img',box),r=im.getBoundingClientRect(),pad=16;
  const maxW=Math.min(660,innerWidth-pad*2),maxH=Math.min(570,innerHeight-pad*2),ratio=(im.naturalWidth||600)/(im.naturalHeight||450);
  let w=maxW,h=(w-28)/ratio+28;if(h>maxH){h=maxH;w=(h-28)*ratio+28;}
  let x=r.right+22,y=r.top+(r.height-h)/2;
  if(x+w>innerWidth-pad)x=r.left-w-22;
  if(x<pad){x=Math.max(pad,Math.min(innerWidth-w-pad,r.left+(r.width-w)/2));y=r.top-h-20;if(y<pad)y=r.bottom+20;}
  x=Math.max(pad,Math.min(innerWidth-w-pad,x));y=Math.max(pad,Math.min(innerHeight-h-pad,y));
  large.src=enlargedImageSource(im);large.alt=im.alt;box.style.width=w+'px';box.style.height=h+'px';box.style.left=x+'px';box.style.top=y+'px';box.hidden=false;previewSource=im;im.setAttribute('aria-describedby','imageHoverPreview');
 };
 if(immediate)reveal();else imagePreviewTimer=setTimeout(reveal,180);
}
function imageOnlyDialog(im){hideImagePreview();const lightbox=$('#imageLightbox'),large=$('img',lightbox);large.src=enlargedImageSource(im);large.alt=im.alt;lightbox.showModal();}
function bindImagePreview(im){
 im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','Enlarge teaching image: hover or focus to preview');
 im.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&matchMedia('(hover:hover)').matches)showImagePreview(im);});
 im.addEventListener('pointerleave',()=>{hideImagePreview();});
 im.addEventListener('focus',()=>{if(matchMedia('(hover:hover)').matches)showImagePreview(im,true);});im.addEventListener('blur',hideImagePreview);
 im.onclick=()=>{if(matchMedia('(hover:none)').matches)imageOnlyDialog(im);};
 im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();imageOnlyDialog(im);}if(e.key==='Escape')hideImagePreview();};
}

// Compact navigation explains both its purpose and the next teaching view.
function contentViewName(p){
 if(!p)return '';
 if(p.type==='quiz')return plain(p.question.text);
 if(p.type==='insights')return p.items.map(x=>x.title||x.text).join(' · ');
 if(p.type==='visual')return p.items[0]?.alt||'Teaching image';
 if(p.type==='table'||p.type==='record')return 'Compare terms and meanings';
 return {cover:'Lesson introduction',recall:'Recall and reveal the meaning',bank:'Search and practise the word bank',builder:'Build a term and check its meaning',parts:'Inspect the word parts',sequence:'Explore the steps',response:'Write your explanation',regions:'Explore anatomical regions',model:'Explore the interactive teaching model',references:'References and source links',roadmap:'Choose a lesson section'}[p.type]||'Additional teaching content';
}
