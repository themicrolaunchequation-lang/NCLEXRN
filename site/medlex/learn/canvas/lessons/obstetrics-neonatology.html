mating-the-due-date"},{"label":"[4] WHO","url":"https://www.who.int/news-room/fact-sheets/detail/preterm-birth"},{"label":"[7] ACOG / SMFM","url":"https://www.acog.org/clinical/guidance/committee-opinion/2013/11/definition-of-term-pregnancy/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"World Health Organization / Preterm and low birth weight","url":"https://www.who.int/teams/maternal-newborn-child-adolescent-health-and-ageing/newborn-health/preterm-and-low-birth-weight"}],"blocks":[{"type":"model","model":"gestation","assumptions":"Gestational age describes elapsed time, not birth weight. This teaching scale uses term categories; clinical dating requires the appropriate assessment. Convention used: ACOG/SMFM term categories. This is a named educational convention; AIHW reporting may group term births differently. Gestational age and birth weight are separate measures. ACOG definition ↗ · AIHW reporting ↗","id":"6-0"},{"type":"fact","title":"","text":"Gestational age (GA) is usually counted from the first day of the last menstrual period (LMP), with ultrasound used to establish or refine dating. EDD = estimated due date."},{"type":"fact","title":"","text":"35+2 means 35 completed weeks and 2 days. It does not mean 35.2 decimal weeks."}],"art":{"src":"shared/img/art-cc3c3b9039a81c67.webp","alt":"A fetus inside the womb"},"prompts":[],"contextNotes":[],"panels":[{"type":"model","model":"gestation","assumptions":"Gestational age describes elapsed time, not birth weight. This teaching scale uses term categories; clinical dating requires the appropriate assessment. Convention used: ACOG/SMFM term categories. This is a named educational convention; AIHW reporting may group term births differently. Gestational age and birth weight are separate measures. ACOG definition ↗ · AIHW reporting ↗","id":"6-0"},{"type":"insights","items":[{"type":"fact","title":"","text":"Gestational age (GA) is usually counted from the first day of the last menstrual period (LMP), with ultrasound used to establish or refine dating. EDD = estimated due date."},{"type":"fact","title":"","text":"35+2 means 35 completed weeks and 2 days. It does not mean 35.2 decimal weeks."}],"id":"6-1"}],"role":"interactive-model"},{"index":7,"title":"Gravidity counts pregnancies; parity counts events","titleHTML":"Gravidity counts pregnancies; parity counts events","kicker":"07 / OBSTETRIC HISTORY","subtitle":"","references":[{"label":"[8] Merck Manual Professional","url":"https://www.merckmanuals.com/professional/gynecology-and-obstetrics/approach-to-the-pregnant-woman-and-prenatal-care/evaluation-of-the-obstetric-patient"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"World Health Organization / Preterm and low birth weight","url":"https://www.who.int/teams/maternal-newborn-child-adolescent-health-and-ageing/newborn-health/preterm-and-low-birth-weight"}],"blocks":[{"type":"fact","title":"G · gravidity","text":"Total pregnancies, including the current one. A twin pregnancy counts once."},{"type":"fact","title":"P · parity","text":"Pregnancies reaching the locally defined gestational threshold, regardless of the number of infants or survival."},{"type":"fact","title":"TPAL","text":"Term births · Preterm births · Abortions / losses below the threshold · Living children."},{"type":"fact","title":"","text":"Currently pregnant; one previous twin birth at 38 weeks; both children living; no losses."},{"type":"reveal","items":[{"title":"Translate the example","text":"G2 P1; G2 T1 P0 A0 L2 in TPAL notation. The two uses of P differ: total parity versus the preterm category."}]},{"type":"fact","title":"","text":"Many US systems use ≥20 weeks for parity. Definitions and notation vary; use the institution’s standard. The A category includes spontaneous and induced losses."}],"art":{"src":"shared/img/art-cc3c3b9039a81c67.webp","alt":"A baby in the womb, for obstetrics and newborn care"},"pro ,"meaning":"Coding represents documented information under a specific classification and rules. Identify jurisdiction, care setting and governing date, then verify a candidate in the applicable official reference.","remember":"Context → record → candidate → verify. A clinical phrase alone is not a complete code assignment, and a code does not guarantee payment.","key":"clinical-record","src":"shared/img/review-b3-clinical-record.webp","thumb":"shared/img/review-b3-clinical-record-thumb.webp","limit":"The sheet contains no patient information or codes. The image is a workflow cue, not a live coding system or an official record.","references":[{"title":"CMS · ICD-10 official files","url":"https://www.cms.gov/medicare/coding-billing/icd-10-codes"}]},"shared/img/review-b3-newborn.webp":{"title":"Newborn · age and size are different","what":"A generic swaddled newborn illustration with no measurements or clinical findings.","meaning":"A newborn may be described by gestational age, birth weight and size relative to a reference chart. Preterm describes birth before 37 completed gestational weeks; it does not itself specify weight.","remember":"Time and size answer different questions. A small picture is not a small-for-gestational-age diagnosis. Use the actual record and appropriate chart.","key":"newborn","src":"shared/img/review-b3-newborn.webp","thumb":"shared/img/review-b3-newborn-thumb.webp","limit":"The illustration does not establish prematurity, measured weight, health, Apgar components or any newborn condition.","references":[{"title":"WHO · Preterm birth","url":"https://www.who.int/news-room/fact-sheets/detail/preterm-birth"}]}},"font":"Segoe UI"}</script><script type="application/json" id="savedCanvasState">{}</script><script>/* MedLex Canvas Studio: fixed viewport, content-specific slides, self-contained assets. */

// Image-only enlargement: hover/focus on desktop, tap on touch screens.
let imagePreviewTimer=null,previewSource=null;
function hideImagePreview(){clearTimeout(imagePreviewTimer);const box=$('#imageHoverPreview');if(box)box.hidden=true;if(previewSource)previewSource.removeAttribute('aria-describedby');previewSource=null;}
function enlargedImageSource(im){const asset=im.dataset.asset,guide=Object.values(cfg.guide||{}).find(g=>g.thumb===asset);return guide&&cfg.assets[guide.src]?data(guide.src):im.currentSrc||im.src;}
function showImagePreview(im,immediate=false){
 hideImagePreview();if(dialog.open||$('#imageLightbox').open||editing||tool!=='pointer')return;
 const reveal=()=>{
  if(!im.isConnected)return;
  const box=$('#imageHoverPreview'),large=$('img',box),r=im.getBoundingClientRect(),pad=16;
  const maxW=Math.min(660,innerWidth-pad*2),maxH=Math.min(570,innerHeight-pad*2),ratio=(im.naturalWidth||600)/(im.naturalHeight||450);
  let w=maxW,h=(w-28)/ratio+28;if(h>maxH){h=maxH;w=(h-28)*ratio+28;}
  let x=r.right+22,y=r.top+(r.height-h)/2;
  if(x+w>innerWidth-pad)x=r.left-w-22;
  if(x<pad){x=Math.max(pad,Math.min(innerWidth-w-pad,r.left+(r.width-w)/2));y=r.top-h-20;if(y<pad)y=r.bottom+20;}
  x=Math.max(pad,Math.min(innerWidth-w-pad,x));y=Math.max(pad,Math.min(innerHeight-h-pad,y));
  large.src=enlargedImageSource(im);large.alt=im.alt;box.style.width=w+'px';box.style.height=h+'px';box.style.left=x+'px';box.style.top=y+'px';box.hidden=false;previewSource=im;im.setAttribute('aria-describedby','imageHoverPreview');
 };
 if(immediate)reveal();else imagePreviewTimer=setTimeout(reveal,180);
}
function imageOnlyDialog(im){hideImagePreview();const lightbox=$('#imageLightbox'),large=$('img',lightbox);large.src=enlargedImageSource(im);large.alt=im.alt;lightbox.showModal();}
function bindImagePreview(im){
 im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','Enlarge teaching image: hover or focus to preview');
 im.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&matchMedia('(hover:hover)').matches)showImagePreview(im);});
 im.addEventListener('pointerleave',()=>{hideImagePreview();});
 im.addEventListener('focus',()=>{if(matchMedia('(hover:hover)').matches)showImagePreview(im,true);});im.addEventListener('blur',hideImagePreview);
 im.onclick=()=>{if(matchMedia('(hover:none)').matches)imageOnlyDialog(im);};
 im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();imageOnlyDialog(im);}if(e.key==='Escape')hideImagePreview();};
}

// Compact navigation explains both its purpose and the next teaching view.
function contentViewName(p){
 if(!p)return '';
 if(p.type==='quiz')return plain(p.question.text);
 if(p.type==='insights')return p.items.map(x=>x.title||x.text).join(' · ');
 if(p.type==='visual')return p.items[0]?.alt||'Teaching image';
 if(p.type==='table'||p.type==='record')return 'Compare terms and meanings';
 return {cover:'Lesson introduction',recall:'Recall and reveal the meaning',bank:'Search and practise the word bank',builder:'Build a term and check its meaning',parts:'Inspect the word parts',sequence:'Explore the steps',response:'Write your explanation',regions:'Explore anatomical regions',model:'Explore the interactive teaching model',references:'References and source links',roadmap:'Choose a lesson section'}[p.type]||'Additional teaching content';
}

 setTip($('#panelCounter'),summary);$('#panelCounter').tabIndex=0;
 $('#panelNavigation').dataset.single=String(n===1);$('#panelNavigation').setAttribute('aria-label','Content views within the current slide');

 setTip($('#nextPanel'),state.panel<n-1?'Next content view: '+contentViewName(panels[state.panel+1]).slice(0,150):'You are at the last content view.');

}
