="Close image preview">×</button><img alt=""></dialog><script type="application/json" id="canvasConfig">{"slug":"female-reproductive","title":"Female reproductive system","category":"Body systems","num":21,"precision":["“Total” needs its procedural context.","A total hysterectomy removes the uterus and cervix. Removal of ovaries or uterine tubes requires additional procedure terminology."],"terms":[{"form":"Adenomyosis","meaning":"Endometrial glands and stroma within the myometrium.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Amenorrhoea / amenorrhea","meaning":"Absence of menstrual periods.","example":"","category":"Female reproductive terminology"},{"form":"Anovulation","meaning":"Absence of ovulation.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Abnormal uterine bleeding (AUB)","meaning":"Uterine bleeding abnormal in pattern or amount in a nonpregnant person.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Bilateral","meaning":"On both sides.","example":"","category":"Female reproductive terminology","image":"shared/img/97f6d749fb33792a.webp"},{"form":"Bilateral salpingo-oophorectomy (BSO)","meaning":"Removal of both uterine tubes and both ovaries.","example":"","category":"Female reproductive terminology","image":"shared/img/3ff5f3ddd17e8e2d.webp"},{"form":"Biopsy","meaning":"Sampling tissue or cells for examination.","example":"","category":"Female reproductive terminology","image":"shared/img/art-286c5516f67d26fc.webp"},{"form":"Cervicitis","meaning":"Inflammation of the cervix.","example":"","category":"Female reproductive terminology"},{"form":"Cervix","meaning":"Lower part of the uterus opening into the vagina.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Colposcopy","meaning":"Magnified examination of the cervix and, as indicated, vaginal or vulvar tissue.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Corpus luteum","meaning":"Structure formed from an ovulated follicle that produces progesterone and other hormones.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Cystocele","meaning":"Prolapse of the bladder into the anterior vaginal wall.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Dyspareunia","meaning":"Pain associated with sexual intercourse.","example":"","category":"Female reproductive terminology"},{"form":"Dysmenorrhoea / dysmenorrhea","meaning":"Pain associated with menstruation.","example":"","category":"Female reproductive terminology"},{"form":"Endometrial ablation","meaning":"Destruction or removal of endometrial tissue. It is not contraception.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Endometrial polyp","meaning":"Localised growth arising from the endometrium.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Endometritis","meaning":"Inflammation of the endometrium.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Endometriosis","meaning":"Endometrium-like tissue outside the uterus.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Endometrium","meaning":"The inner lining of the uterus.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Fimbriae","meaning":"Finger-like projections near the ovarian end of a uterine tube.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Follicle","meaning":"Ovarian structure containing an oocyte and supporting cells.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Follicle-stimulating hormone (FSH)","meaning":"Pituitary hormone supporting ovarian follicular development.","example":"","category":"Female reproductive terminology"},{"form":"Gynaecology / gynecology","meaning":"The medical specialty concerned with female reproductive health.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Heavy menstrual bleeding (HMB)","meaning":"Menstrual blood loss that interferes with quality of life.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Hysterectomy","meaning":"Surgical removal of the uterus. The type and extent must be specified.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Hysterosalpingography (HSG)","meaning":"Contrast X-ray examination of the uterine cavity and tubal patency.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Hysteroscopy","meaning":"Direct visual examination of the uterine cavity using a scope.","example":"","category":"Female reproductive terminology"},{"form":"Human papillomavirus (HPV)","meaning":"A group of viruses. Persistent high-risk HPV infection can cause cervical and other cancers.","example":"","category":"Female reproductive terminology","image":"shared/img/art-b49b4da590311251.webp"},{"form":"HPV test","meaning":"A test detecting high-risk HPV infection. It is distinct from cytology.","example":"","category":"Female reproductive terminology"},{"form":"Infertility","meaning":"Difficulty achieving pregnancy, evaluated in an individual and couple context.","example":"","category":"Female reproductive terminology"},{"form":"Intermenstrual bleeding","meaning":"Bleeding between menstrual periods.","example":"","category":"Female reproductive terminology"},{"form":"Intrauterine device (IUD)","meaning":"A device placed within the uterine cavity for contraception.","example":"","category":"Female reproductive terminology"},{"form":"Intrauterine insemination (IUI)","meaning":"Placement of prepared sperm into the uterus.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"In vitro fertilisation (IVF)","meaning":"Fertilisation outside the body, followed by embryo transfer in treatment.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Leiomyoma","meaning":"A benign smooth-muscle tumour. Uterine leiomyomas are commonly called fibroids.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Luteinising hormone (LH)","meaning":"Pituitary hormone whose mid-cycle surge triggers ovulation. US spelling: luteinizing.","example":"","category":"Female reproductive terminology","image":"shared/img/art-0b361914f0e5a27b.webp"},{"form":"Mammography","meaning":"X-ray imaging of the breast.","example":"","category":"Female reproductive terminology","image":"shared/img/art-f4aafbb4bb4ac2da.webp"},{"form":"Mastalgia","meaning":"Breast pain.","example":"","category":"Female reproductive terminology"},{"form":"Mastitis","meaning":"Inflammation of breast tissue.","example":"","category":"Female reproductive terminology","image":"shared/img/art-f4aafbb4bb4ac2da.webp"},{"form":"Menarche","meaning":"First menstrual period.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Menopause","meaning":"Natural menopause is recognised after 12 months without menstruation when no other cause explains it.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Menorrhagia","meaning":"Older term commonly used for heavy menstrual bleeding.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Menstruation","meaning":"Shedding of the functional endometrial layer with blood through the vagina.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Myomectomy","meaning":"Surgical removal of uterine fibroids.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Myometrium","meaning":"The muscular layer of the uterus.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Oestrogen / estrogen","meaning":"A group of hormones involved in reproductive function and other body systems.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Oligomenorrhoea / oligomenorrhea","meaning":"Infrequent menstrual periods.","example":"","category":"Female reproductive terminology"},{"form":"Oocyte","meaning":"A developing egg cell.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Oophorectomy","meaning":"Surgical removal of an ovary or ovaries as specified.","example":"","category":"Female reproductive terminology"},{"form":"Ovary","meaning":"Gonad containing oocytes and producing reproductive hormones.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Ovulation","meaning":"Release of an oocyte from an ovarian follicle.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Pap test","meaning":"Cervical cytology: assessment of sampled cells for abnormalities.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Pelvic inflammatory disease (PID)","meaning":"Infection and inflammation of the upper reproductive tract.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Pelvic organ prolapse","meaning":"Descent of pelvic organs from their usual supported position.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Perimenopause","meaning":"The transition around menopause.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Perimetrium","meaning":"Outer covering of the uterus over much of its surface.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Polycystic ovary syndrome (PCOS)","meaning":"A hormonal and metabolic syndrome associated with ovulatory dysfunction and/or androgen excess.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Postmenopausal bleeding","meaning":"Bleeding after menopause. It needs clinical assessment.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Progesterone","meaning":"Hormone supporting secretory endometrial changes after ovulation.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Salpingectomy","meaning":"Surgical removal of a uterine tube or tubes as specified.","example":"","category":"Female reproductive terminology"},{"form":"Salpingitis","meaning":"Inflammation of a uterine tube.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Salpingo-oophorectomy","meaning":"Removal of a uterine tube and ovary, with side or sides specified.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Subtotal hysterectomy","meaning":"Removal of the uterine body while retaining the cervix. Also called supracervical hysterectomy.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Total hysterectomy","meaning":"Removal of the uterus and cervix. Ovarian or tubal removal is separately specified.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Transvaginal ultrasonography (TVUS)","meaning":"Ultrasound imaging using a vaginal probe.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Tubal patency","meaning":"Whether a uterine tube is open to passage.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Unilateral","meaning":"On one side.","example":"","category":"Female reproductive terminology","image":"shared/img/9e945287aca3e044.webp"},{"form":"Uterine tube","meaning":"Tube linking the region near an ovary to the uterus. Also called fallopian tube.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Uterus","meaning":"Muscular organ containing the endometrial cavity.","example":"","category":"Female reproductive terminology","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Vagina","meaning":"Internal canal extending from the cervix to its external opening.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Vaginitis","meaning":"Inflammation of the vagina.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Vulva","meaning":"Collective term for the external genital structures.","example":"","category":"Female reproductive terminology","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"Vulvodynia","meaning":"Persistent vulvar pain without a clearly identifiab sson","image":"shared/img/c5a9323151f8efa5.webp"},{"form":"-itis / -algia","meaning":"-itis / -algia Inflammation / pain: cervicitis, mastalgia.","example":"","category":"In this lesson","image":"shared/img/18842ff0ae6e3a5f.webp"},{"form":"Leiomyoma / fibroid","meaning":"Leiomyoma / fibroid A benign smooth-muscle tumour of the uterus.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Cervicitis / vaginitis","meaning":"Cervicitis / vaginitis Inflammation of the cervix / vagina, respectively.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Ovulation / anovulation","meaning":"Ovulation / anovulation Release of an oocyte from an ovary / absence of ovulation.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"-ectomy / -scopy","meaning":"-ectomy / -scopy Surgical removal / visual examination: salpingectomy, hysteroscopy.","example":"","category":"In this lesson","image":"shared/img/3ff5f3ddd17e8e2d.webp"},{"form":"Anatomy","meaning":"Anatomy Vulva is external. Vagina is an internal canal. Cervix is part of the uterus.","example":"","category":"In this lesson","image":"shared/img/art-cc3c3b9039a81c67.webp"},{"form":"dys- / oligo-","meaning":"dys- / oligo- Painful, difficult or abnormal / few or scanty: dysmenorrhoea, oligomenorrhoea.","example":"","category":"In this lesson","image":"shared/img/52bfa6ac53066cea.webp"},{"form":"Salpingectomy / oophorectomy","meaning":"Salpingectomy / oophorectomy Removal of a uterine tube / ovary. Laterality must be specified.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Symptoms","meaning":"Symptoms Amenorrhoea: absent periods. Dysmenorrhoea: painful periods. Describe bleeding patterns clearly.","example":"","category":"In this lesson","image":"shared/img/e89c897a220e1dd6.webp"},{"form":"Myomectomy / endometrial ablation","meaning":"Myomectomy / endometrial ablation Myomectomy removes fibroids. Ablation destroys or removes endometrial tissue.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Tubal occlusion / salpingectomy","meaning":"Tubal occlusion / salpingectomy Tubal occlusion blocks the uterine tubes. Salpingectomy removes a tube or tubes.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Total / subtotal hysterectomy","meaning":"Total / subtotal hysterectomy Total removes the uterus and cervix. Subtotal, or supracervical, retains the cervix.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"HPV test / Pap test","meaning":"HPV test / Pap test HPV testing detects high-risk viral infection. Cervical cytology examines cells for abnormalities.","example":"","category":"In this lesson","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"TVUS / pelvic ultrasound","meaning":"TVUS / pelvic ultrasound Transvaginal ultrasonography uses a vaginal probe. Transabdominal imaging is another approach.","example":"","category":"In this lesson","image":"shared/img/art-4bdb811bfa8eadae.webp"},{"form":"IVF / IUI","meaning":"IVF / IUI In vitro fertilisation involves fertilisation outside the body. Intrauterine insemination places prepared sperm in the uterus.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Pelvic inflammatory disease · PID","meaning":"Pelvic inflammatory disease · PID Infection and inflammation involving the upper reproductive tract, often including the uterus and uterine tubes.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"},{"form":"Hysteroscopy / HSG","meaning":"Hysteroscopy / HSG Hysteroscopy views the uterine cavity. Hysterosalpingography uses contrast X-ray imaging to assess the cavity and tubal patency.","example":"","category":"In this lesson","image":"shared/img/dc1786eb7d0c6b35.webp"} ial proliferation. After ovulation, corpus-luteum progesterone supports secretory changes."},{"type":"fact","title":"Menarche","text":"The first menstrual period. This differs from menopause."},{"type":"fact","title":"Menopause & perimenopause","text":"Natural menopause is recognised after 12 months without menstruation when no other cause explains it. Perimenopause is the transition around menopause."},{"type":"fact","title":"","text":"Amenorrhoea means absent menstrual periods. It is a finding with possible physiological and pathological causes, rather than one diagnosis."}],"art":{"src":"shared/img/art-4bdb811bfa8eadae.webp","alt":"The uterus, tubes and ovaries, for the female reproductive system"},"prompts":[],"contextNotes":["Medical terminology · Female reproductive system · 10 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"FSH & LH","text":"Follicle-stimulating hormone supports follicular development. A mid-cycle LH surge triggers ovulation."},{"type":"fact","title":"Oestrogen & progesterone","text":"Oestrogen supports endometrial proliferation. After ovulation, corpus-luteum progesterone supports secretory changes."},{"type":"fact","title":"Menarche","text":"The first menstrual period. This differs from menopause."}],"id":"9-0"},{"type":"insights","items":[{"type":"fact","title":"Menopause & perimenopause","text":"Natural menopause is recognised after 12 months without menstruation when no other cause explains it. Perimenopause is the transition around menopause."},{"type":"fact","title":"","text":"Amenorrhoea means absent menstrual periods. It is a finding with possible physiological and pathological causes, rather than one diagnosis."}],"id":"9-1"}],"role":"editorial-cards"},{"index":10,"title":"Menstrual & pelvic symptoms","titleHTML":"Menstrual & pelvic symptoms","kicker":"11 / Describe before diagnosing","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607451/"},{"label":"[4]","url":"https://www.acog.org/womens-health/faqs/abnormal-uterine-bleeding"},{"label":"[7]","url":"https://www.nichd.nih.gov/about/org/der/branches/ghdb/programs"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Female reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/female/"}],"blocks":[{"type":"recall","items":[{"title":"amenorrhoea / amenorrhea","text":"Absence of menstrual periods."}]},{"type":"recall","items":[{"title":"dysmenorrhoea / dysmenorrhea","text":"Pain associated with menstruation."}]},{"type":"recall","items":[{"title":"oligomenorrhoea / oligomenorrhea","text":"Infrequent menstrual periods."}]},{"type":"recall","items":[{"title":"heavy menstrual bleeding · HMB","text":"Menstrual bleeding that interferes with physical, social, emotional or material quality of life."}]},{"type":"recall","items":[{"title":"intermenstrual bleeding","text":"Bleeding between menstrual periods."}]},{"type":"recall","items":[{"title":"dyspareunia","text":"Pain associated with sexual intercourse."}]},{"type":"fact","title":"","text":"AUB = abnormal uterine bleeding in the nonpregnant context. Describe the pattern and impact. “Menorrhagia” is an older term you may still encounter for heavy menstrual bleeding."}],"art":{"src":"shared/img/art-4bdb811bfa8eadae.webp","alt":"The uterus, tubes and ovaries, for the female reproductive system"},"prompts":[],"contextNotes":["Medical terminology · Female reproductive system · 11 / 20"],"panels":[{"type":"recall","items":[{"title":"amenorrhoea / amenorrhea","text":"Absence of menstrual periods."},{"title":"dysmenorrhoea / dysmenorrhea","text":"Pain associated with menstruation."},{"title":"oligomenorrhoea / oligomenorrhea","text":"Infrequent menstrual periods."},{"title":"heavy menstrual bleeding · HMB","text":"Menstrual bleeding that interferes with physical, social, emotional or material quality of life."},{"title":"intermenstrual bleeding","text":"Bleeding between menstrual periods."},{"title":"dyspareunia","text":"Pain associated with sexual intercourse."}],"id":"10-0"},{"type":"insights","items":[{"type":"fact","title":"","text":"AUB = abnormal uterine bleeding in the nonpregnant context. Describe the pattern and impact. “Menorrhagia” is an older term you may still encounter for heavy menstrual bleeding."}],"id":"10-1"}],"role":"recall-studio"},{"index":11,"title":"Similar names, different conditions","titleHTML":"Similar names, different conditions","kicker":"12 / Localise the disease","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607451/"},{"label":"[5]","url":"https://www.who.int/news-room/fact-sheets/detail/endometriosis"},{"label":"[7]","url":"https://www.nichd.nih.gov/about/org/der/branches/ghdb/programs"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Female reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/female/"}],"blocks":[{"type":"fact","title":"Endometriosis","text":"Tissue similar to endometrium occurs outside the uterus. It can cause pain and impaired fertility."},{"type":"fact","title":"Adenomyosis","text":"Endometrial glands and stroma occur within the myometrium."},{"type":"fact","title":"Leiomyoma / fibroid","text":"A benign smooth-muscle tumour of the uterus."},{"type":"fact","title":"Endometrial polyp","text":"A localised growth arising from the endometrium."},{"type":"fact","title":"","text":"Endometriosis differs from endometritis, which means inflammation of the endometrium. The ending matters, and the full clinical definition matters too."}],"art":{"src":"shared/img/art-4bdb811bfa8eadae.webp","alt":"The uterus, tubes and ovaries, for the female reproductive system"},"prompts":[],"contextNotes":["Medical terminology · Female reproductive system · 12 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"Endometriosis","text":"Tissue similar to endometrium occurs outside the uterus. It can cause pain and impaired fertility."},{"type":"fact","title":"Adenomyosis","text":"Endometrial glands and stroma occur within the myometrium."},{"type":"fact","title":"Leiomyoma / fibroid","text":"A benign smooth-muscle tumour of the uterus."}],"id":"11-0"},{"type":"insights","items":[{"type":"fact","title":"Endometrial polyp","text":"A localised growth arising from the endometrium."},{"type":"fact","title":"","text":"Endometriosis differs from endometritis, which means inflammation of the endometrium. The ending matters, and the full clinical definition matters too."}],"id":"11-1"}],"role":"editorial-cards"},{"index":12,"title":"Ovarian & inflammatory terms","titleHTML":"Ovarian & inflammatory terms","kicker":"13 / Apply anatomical precision","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607451/"},{"label":"[6]","url":"https://www.nichd.nih.gov/health/topics/pcos/conditioninfo"},{"label":"[8]","url":"https://www.cdc.gov/pid/about/index.html"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Female reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/female/"}],"blocks":[{"type":"fact","title":"Polycystic ovary syndrome · PCOS","text":"A hormonal and metabolic syndrome associated with ovulatory dysfunction and/or androgen excess. Multiple ovarian follicles may be present."},{"type":"fact","title":"Ovarian cyst","text":"A fluid-filled or partly fluid-filled ovarian structure. A cyst alone does not establish PCOS."},{"type":"fact","title":"Cervicitis / vaginitis","text":"Inflammation of the cervix / vagina, respectively."},{"type":"fact","title":"Pelvic inflammatory disease · PID","text":"Infection and inflammation involving the upper reproductive tract, often including the uterus and uterine tubes."},{"type":"fact","title":"","text":"Salpingitis = inflammation of a uterine tube. PID can follow sexually transmitted and other infections. The term alone does not identify an organism."}],"art":{"src":"shared/img/art-4bdb811bfa8eadae.webp","alt":"The uterus, tubes and ovaries, for the female reproductive system"},"prompts":[],"contextNotes":["Medical terminology · Female reproductive system · 13 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"Polycystic ovary syndrome · PCOS","text":"A hormonal and metabolic syndrome associated with ovulatory dysfunction and/or androgen excess. Multiple ovarian follicles may be present."},{"type":"fact","title":"Ovarian cyst","text":"A fluid-filled or partly fluid-filled ovarian structure. A cyst alone does not establish PCOS."},{"type":"fact","title":"Cervicitis / vaginitis","text":"Inflammation of the cervix / vagina, respectively."}],"id":"12-0"},{"type":"insights","items":[{"type":"fact","title":"Pelvic inflammatory disease · PID","text":"Infection and inflammation involving the upper reproductive tract, often including the uterus and uterine tubes."},{"type":"fact","title":"","text":"Salpingitis = inflammation of a uterine tube. PID can follow sexually transmitted and other infections. The term alone does not identify an organism."}],"id":"12-1"}],"role":"editorial-cards"},{"index":13,"title":"Screening is different from diagnosis","titleHTML":"Screening is different from diagnosis","kicker":"14 / Investigations & abbreviations","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607451/"},{"label":"[9]","url":"https://www.cancer.gov/types/cervical/screening"},{"label":"[11]","url":"https://wtcs.pressbooks.pub/medterm/chapter/7-7-medical-specialists-diagnostic-testing-and-procedures-related-to-the-female-reproductive-system/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Female reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/female/"}],"blocks":[{"type":"fact","title":"HPV test / Pap test","text":"HPV testing detects high-risk viral infection. Cervical cytology examines cells for abnormalities."},{"type":"fact","title":"Colposcopy & biopsy","text":"Colposcopy magnifies the cervix and related areas. Biopsy samples tissue for pathological examination."},{"type":"fact","title":"TVUS / pelvic ultrasound","text":"Transvaginal ultrasonography uses a vaginal probe. Transabdominal imaging is another approach."},{"type":"fact","title":"Hysteroscopy / HSG","text":"Hysteroscopy views the uterine cavity. Hysterosalpingography uses contrast X-ray imaging to assess the cavity and tubal patency."},{"type":"fact","title":"","text":"An abnormal screening result does not equal cancer. A Pap test is not an ovarian cancer screening test. Test choice and screening intervals depend on current local guidance and clinical history."}],"art":{"src":"shared/img/art-4bdb811bfa8eadae.webp","alt":"The uterus, tubes and ovaries, for the female reproductive system"},"prompts":[],"contextNotes":["Medical terminology · Female reproductive system · 14 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"HPV test / Pap test","text":"HPV testing detects high-risk viral infection. Cervical cytology examines cells for abnormalities."},{"type":"fact","title":"Colposcopy & biopsy","text":"Colposcopy magnifies the cervix and related areas. Biopsy samples tissue for pathological examination."},{"type":"fact","title":"TVUS / pelvic ultrasound","text":"Transvaginal ultrasonography uses a vaginal probe. Transabdominal imaging is another approach."}],"id":"13-0"},{"type":"insights","items":[{"type":"fact","title":"Hysteroscopy / HSG","text":"Hysteroscopy views the uterine cavity. Hysterosalpingography uses contrast X-ray imaging to assess the cavity and tubal patency."},{"type":"fact","title":"","text":"An abnormal screening result does not equal cancer. A Pap test is not an ovarian cancer screening test. Test choice and screening intervals depend on current local guidance and clinical history."}],"id":"13-1"}],"role":"editorial-cards"},{"index":14,"title":"Procedures: what is removed?","titleHTML":"Procedures: what is removed?","kicker":"15 / Surgical precision","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607451/"},{"label":"[10]","url":"https://www.cancer.gov/publications/dictionaries/cancer-terms/def/total-hysterectomy"},{"label":"[11]","url":"https://wtcs.pressbooks.pub/medterm/chapter/7-7-medical-specialists-diagnostic-testing-and-procedures-related-to-the-female-reproductive-system/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Female reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/female/"}],"blocks":[{"type":"fact","title":"Total / subtotal hysterectomy","text":"Total removes the uterus and cervix. Subtotal, or supracervical, retains the cervix."},{"type":"fact","title":"Salpingectomy / oophorectomy","text":"Removal of a uterine tube / ovary. Laterality must be specified."},{"type":"fact","title":"Salpingo-oophorectomy","text":"Removal of the tube and ovary on the stated side or sides."},{"type":"fact","title":"Myomectomy / endometrial ablation","text":"Myomectomy removes fibroids. Ablation destroys or removes endometrial tissue."},{"type":"fact","title":"","text":"Bilateral means both sides. Unilateral means one side. Hysterectomy does not automatically mean that the ovaries were removed."}],"art":{"src":"shared/img/art-4bdb811bfa8eadae.webp","alt":"The uterus, tubes and ovaries, for the female reproductive system"},"prompts":[],"contextNotes":["Medical terminology · Female reproductive system · 15 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"Total / subtotal hysterectomy","text":"Total removes the uterus and cervix. Subtotal, or supracervical, retains the cervix."},{"type":"fact","title":"Salpingectomy / oophorectomy","text":"Removal of a uterine tube / ovary. Laterality must be specified."},{"t $('#moreTools').onclick=()=>{popover('Canvas tools','<div class="popover-grid">'+toolDefs.slice(2).map(([id,name])=>'<button data-more-tool="'+id+'">'+icon(id)+'<span>'+name+'</span></button>').join('')+'<button id="mobileOutline">'+icon('grid')+'<span>Slides</span></button><button id="mobileNotes">'+icon('notes')+'<span>Notes</span></button><button id="mobileEdit">'+icon('edit')+'<span>Edit text</span></button><button id="mobileClear">'+icon('clear')+'<span>Clear</span></button></div>');$$('[data-more-tool]',$('#toolPopover')).forEach(b=>b.onclick=()=>toolClick(b.dataset.moreTool));$('#mobileOutline').onclick=outline;$('#mobileNotes').onclick=notes;$('#mobileEdit').onclick=()=>{closePopover();setEditing(!editing);};$('#mobileClear').onclick=clearMenu;};
$('#imageUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>15*1024*1024)return toast('Choose a PNG, JPEG or WebP image below 15 MB.');const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const cv=document.createElement('canvas'),factor=Math.min(1,1400/Math.max(image.width,image.height));cv.width=Math.round(image.width*factor);cv.height=Math.round(image.height*factor);cv.getContext('2d').drawImage(image,0,0,cv.width,cv.height);checkpoint();items().push({id:Date.now()+'',type:'image',x:.3,y:.32,w:.4,h:.4,src:cv.toDataURL('image/webp',.9)});renderInk();save();toast('Image added. Use Pointer to move it.');};image.src=reader.result;};reader.readAsDataURL(f);e.target.value='';};
function exportHTML(){hideImagePreview();hideTooltip();save();const clone=document.documentElement.cloneNode(true);clone.querySelector('#savedCanvasState').textContent=JSON.stringify(state).replace(/<\//g,'<\\/');clone.querySelector('#slideContent').replaceChildren();clone.querySelector('#inkLayer').replaceChildren();clone.querySelector('#toolPopover').hidden=true;clone.querySelector('#studioDialog').removeAttribute('open');clone.querySelector('#toast').classList.remove('visible');clone.querySelector('#stage').classList.remove('is-editing');clone.querySelector('#imageHoverPreview').hidden=true;clone.querySelector('#imageHoverPreview img').removeAttribute('src');clone.querySelector('#imageLightbox').removeAttribute('open');clone.querySelector('#imageLightbox img').removeAttribute('src');clone.querySelector('#studioTooltip').hidden=true;const source='<!doctype html>\n'+clone.outerHTML,blob=new Blob([source],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MedLex-'+cfg.slug+'-Canvas.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Self-contained HTML saved with your notes, edits and annotations.');}
$('#editContent').onclick=()=>{setEditing(!editing);if(!editing)render();};$('#notesButton').onclick=notes;$('#saveButton').onclick=exportHTML;$('#themeButton').onclick=()=>theme(state.mode==='night'?'day':'night');$('#focusButton').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('Fullscreen is unavailable in this browser.'));};$('#prevSlide').onclick=()=>goSlide(state.slide-1);$('#nextSlide').onclick=()=>goSlide(state.slide+1);$('#prevPanel').onclick=()=>goPanel(state.panel-1);$('#nextPanel').onclick=()=>goPanel(state.panel+1);$('#openOutline').onclick=outline;$('#sourcesButton').onclick=sources;$('#lessonSelect').value=cfg.slug;$('#lessonCategory').textContent=cfg.category;$('#lessonSelect').onchange=e=>location.href=e.target.value+'.html';
document.addEventListener('pointerdown',e=>{if(popoverOpen&&!e.target.closest('#toolPopover,.edit-dock'))closePopover();});document.addEventListener('keydown',e=>{if(dialog.open||$('#imageLightbox').open||e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.ctrlKey||e.metaKey){if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoAction():undoAction();}return;}if(e.key==='Escape'){closePopover();setTool('pointer');setEditing(false,false);}if(e.key==='ArrowRight'){e.preventDefault();goSlide(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();goSlide(state.slide-1);}if(e.key==='PageDown'){e.preventDefault();goPanel(state.panel+1);}if(e.key==='PageUp'){e.preventDefault();goPanel(state.panel-1);}if(e.key.toLowerCase()==='n')notes();if(e.key.toLowerCase()==='f')$('#focusButton').click();if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();checkpoint();state.annotations[annotationKey()]=items().filter(a=>a.id!==selected);selected=null;renderInk();save();}});
// Image-only enlargement: hover/focus on desktop, tap on touch screens.
let imagePreviewTimer=null,previewSource=null;
function hideImagePreview(){clearTimeout(imagePreviewTimer);const box=$('#imageHoverPreview');if(box)box.hidden=true;if(previewSource)previewSource.removeAttribute('aria-describedby');previewSource=null;}
function enlargedImageSource(im){const asset=im.dataset.asset,guide=Object.values(cfg.guide||{}).find(g=>g.thumb===asset);return guide&&cfg.assets[guide.src]?data(guide.src):im.currentSrc||im.src;}
function showImagePreview(im,immediate=false){
 hideImagePreview();if(dialog.open||$('#imageLightbox').open||editing||tool!=='pointer')return;
 const reveal=()=>{
  if(!im.isConnected)return;
  const box=$('#imageHoverPreview'),large=$('img',box),r=im.getBoundingClientRect(),pad=16;
  const maxW=Math.min(660,innerWidth-pad*2),maxH=Math.min(570,innerHeight-pad*2),ratio=(im.naturalWidth||600)/(im.naturalHeight||450);
  let w=maxW,h=(w-28)/ratio+28;if(h>maxH){h=maxH;w=(h-28)*ratio+28;}
  let x=r.right+22,y=r.top+(r.height-h)/2;
  if(x+w>innerWidth-pad)x=r.left-w-22;
  if(x<pad){x=Math.max(pad,Math.min(innerWidth-w-pad,r.left+(r.width-w)/2));y=r.top-h-20;if(y<pad)y=r.bottom+20;}
  x=Math.max(pad,Math.min(innerWidth-w-pad,x));y=Math.max(pad,Math.min(innerHeight-h-pad,y));
  large.src=enlargedImageSource(im);large.alt=im.alt;box.style.width=w+'px';box.style.height=h+'px';box.style.left=x+'px';box.style.top=y+'px';box.hidden=false;previewSource=im;im.setAttribute('aria-describedby','imageHoverPreview');
 };
 if(immediate)reveal();else imagePreviewTimer=setTimeout(reveal,180);
}
function imageOnlyDialog(im){hideImagePreview();const lightbox=$('#imageLightbox'),large=$('img',lightbox);large.src=enlargedImageSource(im);large.alt=im.alt;lightbox.showModal();}
function bindImagePreview(im){
 im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','Enlarge teaching image: hover or focus to preview');
 im.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&matchMedia('(hover:hover)').matches)showImagePreview(im);});
 im.addEventListener('pointerleave',()=>{hideImagePreview();});
 im.addEventListener('focus',()=>{if(matchMedia('(hover:hover)').matches)showImagePreview(im,true);});im.addEventListener('blur',hideImagePreview);
 im.onclick=()=>{if(matchMedia('(hover:none)').matches)imageOnlyDialog(im);};
 im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();imageOnlyDialog(im);}if(e.key==='Escape')hideImagePreview();};
}
$('#closeImagePreview').onclick=()=>$('#imageLightbox').close();
$('#imageLightbox').addEventListener('click',e=>{if(e.target===$('#imageLightbox'))$('#imageLightbox').close();});
$('#imageLightbox').addEventListener('close',()=>{$('#imageLightbox img').removeAttribute('src');});

// Compact navigation explains both its purpose and the next teaching view.
function contentViewName(p){
 if(!p)return '';
 if(p.type==='quiz')return plain(p.question.text);
 if(p.type==='insights')return p.items.map(x=>x.title||x.text).join(' · ');
 if(p.type==='visual')return p.items[0]?.alt||'Teaching image';
 if(p.type==='table'||p.type==='record')return 'Compare terms and meanings';
 return {cover:'Lesson introduction',recall:'Recall and reveal the meaning',bank:'Search and practise the word bank',builder:'Build a term and check its meaning',parts:'Inspect the word parts',sequence:'Explore the steps',response:'Write your explanation',regions:'Explore anatomical regions',model:'Explore the interactive teaching model',references:'References and source links',roadmap:'Choose a lesson section'}[p.type]||'Additional teaching content';
}
function setTip(el,text){el.dataset.tooltip=text;el.setAttribute('aria-label',text);el.removeAttribute('title');}
function updateFooterNavigation(){
 const s=cfg.slides[state.slide],n=panels.length,name=contentViewName(current).replace(/\s+/g,' ').trim().slice(0,155);
 const summary=n===1?'This slide has one content view. '+name:'Content view '+(state.panel+1)+' of '+n+': '+name+'. Use these arrows to explore more within this slide.';
 setTip($('#panelCounter'),summary);$('#panelCounter').tabIndex=0;
 $('#panelNavigation').dataset.single=String(n===1);$('#panelNavigation').setAttribute('aria-label','Content views within the current slide');
 setTip($('#prevPanel'),state.panel>0?'Previous content view: '+contentViewName(panels[state.panel-1]).slice(0,150):'You are at the first content view.');
 setTip($('#nextPanel'),state.panel<n-1?'Next content view: '+contentViewName(panels[state.panel+1]).slice(0,150):'You are at the last content view.');
 setTip($('#openOutline'),'Slide overview: search and choose any slide in this lesson.');
 setTip($('#prevSlide'),state.slide>0?'Previous slide: '+cfg.slides[state.slide-1].title:'You are at the first slide.');
 setTip($('#nextSlide'),state.slide<cfg.slides.length-1?'Next slide: '+cfg.slides[state.slide+1].title:'You are at the last slide.');
 const counter=$('.slide-counter');counter.tabIndex=0;setTip(counter,'Slide '+(state.slide+1)+' of '+cfg.slides.length+': '+s.title);
}
let tooltipAnchor=null;
function hideTooltip(){const t=$('#studioTooltip');if(t)t.hidden=true;if(tooltipAnchor)tooltipAnchor.removeAttribute('aria-describedby');tooltipAnchor=null;}
function showTooltip(el){
 if(!el?.dataset.tooltip||dialog.open||$('#imageLightbox').open)return;

}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tooltip]');if(el&&!el.contains(e.relatedTarget))showTooltip(el);});

window.MedLexCanvas={config:cfg,state:()=>JSON.parse(JSON.stringify(state)),goSlide,goPanel,render,resize,getPanels:()=>panels,showAllAnswers:()=>{if(current?.type==='quiz')state.quiz[current.id]=current.question.correct;else if(['recall','bank','builder'].includes(current?.type))conceptState(current).revealed=true;render();},setConcept:n=>{if(current){conceptState(current).at=n;conceptState(current).revealed=true;render();}},getLayout:()=>({width:W,height:H,scale,compact}),setTool,exportHTML,icon};
