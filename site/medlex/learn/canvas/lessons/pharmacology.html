fice-clinical-pharmacology"}],"blocks":[{"type":"fact","title":"Oral","text":"Swallowed; absorption commonly occurs in the gastrointestinal tract."},{"type":"fact","title":"Intravenous · IV","text":"Directly into a vein. No absorption step into systemic circulation; absolute bioavailability is 1."},{"type":"fact","title":"Intramuscular · IM / subcutaneous · SC","text":"Into muscle / beneath the skin. Drug still needs to enter the circulation from the injection site."},{"type":"fact","title":"Topical / transdermal","text":"Topical: applied to a body surface, often for local action. Transdermal: delivered across skin for systemic action."},{"type":"fact","title":"","text":"First-pass metabolism occurs before systemic entry. Drug absorbed directly through sublingual mucosa avoids that initial portal passage."}],"art":{"src":"shared/img/art-c807a3ad3aa775fc.webp","alt":"A medicine bottle with tablets"},"prompts":[],"contextNotes":[],"panels":[{"type":"insights","items":[{"type":"fact","title":"Oral","text":"Swallowed; absorption commonly occurs in the gastrointestinal tract."},{"type":"fact","title":"Intravenous · IV","text":"Directly into a vein. No absorption step into systemic circulation; absolute bioavailability is 1."},{"type":"fact","title":"Intramuscular · IM / subcutaneous · SC","text":"Into muscle / beneath the skin. Drug still needs to enter the circulation from the injection site."}],"id":"6-0"},{"type":"insights","items":[{"type":"fact","title":"Topical / transdermal","text":"Topical: applied to a body surface, often for local action. Transdermal: delivered across skin for systemic action."},{"type":"fact","title":"","text":"First-pass metabolism occurs before systemic entry. Drug absorbed directly through sublingual mucosa avoids that initial portal passage."}],"id":"6-1"}],"role":"editorial-cards"},{"index":7,"title":"ADME: four processes, one overlapping journey.","titleHTML":"ADME: four processes, one overlapping journey.","kicker":"07 / ANIMATED ADME LAB","subtitle":"","references":[{"label":"[02] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/clinical-pharmacokinetics/"},{"label":"[04] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/drug-distribution/"},{"label":"[05] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/drug-metabolism/"},{"label":"[16] Merck Manual • Professional","url":"https://www.merckmanuals.com/professional/clinical-pharmacology/pharmacokinetics/drug-excretion"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"FDA / Clinical pharmacology resources","url":"https://www.fda.gov/about-fda/center-drug-evaluation-and-research-cder/office-clinical-pharmacology"}],"blocks":[{"type":"sequence","items":[["A / Absorption","Drug enters systemic circulation from the administration site. Not required for IV entry into systemic circulation."],["D / Distribution","Drug moves between blood and tissues. Blood flow, permeability and binding affect the pattern."],["M / Metabolism","Drug is chemically converted to metabolites. Often hepatic, but other tissues also contribute."],["E / Excretion","Drug or metabolites leave the body. Urine and bile are important routes; others exist."]],"label":"ADME processes overlap in time","id":"7-0"},{"type":"fact","title":"","text":"ADME is a framework, not four strictly consecutive time blocks. Distribution, metabolism and excretion can occur simultaneously."}],"art":{"src":"shared/img/art-8234121b896d5926.webp","alt":"Tablets and capsules, for pharmacology"},"prompts":[],"contextNotes":[],"panels":[{"type":"sequence","items":[["A / Absorption","Drug enters systemic circulation from the administration site. Not required for IV entry into systemic circulation."],["D / Distribution","Drug moves between blood and tissues. Blood flow, permeability and binding affect the pattern."],["M / Metabolism","Drug is chemically converted to metabolites. Often hepatic, but other tissues also contribute."],["E / Excretion","Drug or metabolites leave the body. Urine and bile are important routes; others exist."]],"label":"ADME processes overlap in time","id":"7-0"},{"type":"insights","items":[{"type":"fact","title":"","text":"ADME is a framework, not four strictly consecutive time blocks. Distribution, metabolism and excretion can occur simultaneously."}],"id":"7-1"}],"role":"sequence"},{"index":8,"title":"Absorbed is not always systemically available.","titleHTML":"Absorbed is not always systemically available.","kicker":"08 / BIOAVAILABILITY & BIOEQUIVALENCE","subtitle":"","references":[{"label":"[02] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/clinical-pharmacokinetics/"},{"label":"[07] FDA","url":"https://www.fda.gov/drugs/generic-drugs/generic-drugs-questions-answers"},{"label":"[14] British Journal of Clinical Pharmacology","url":"https://bpspubs.onlinelibrary.wiley.com/pb-assets/assets/13652125/Guidelines%20on%20Pharmacokinetics%20and%20Pharmacodynamics-1522915986837.pdf"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"FDA / Clinical pharmacology resources","url":"https://www.fda.gov/about-fda/center-drug-evaluation-and-research-cder/office-clinical-pharmacology"}],"blocks":[{"type":"fact","title":"Fraction reaching systemic circulation","text":"Bioavailability (F) is the fraction of a dose reaching systemic circulation unchanged. It is not the fraction merely entering the gut wall."},{"type":"recall","items":[{"title":"Bioavailability · F","text":"The fraction of a dose reaching systemic circulation unchanged. Incomplete absorption and first-pass loss may reduce it."}]},{"type":"recall","items":[{"title":"Bioequivalence","text":"Comparable rate and extent of drug availability between products under specified study conditions."}]},{"type":"fact","title":"","text":"A fictional illustration of F, not a measurement method. Clinical studies often estimate F using dose-normalised AUC relative to IV administration."}],"art":{"src":"shared/img/art-c807a3ad3aa775fc.webp","alt":"A medicine bottle with tablets"},"prompts":[],"contextNotes":[],"panels":[{"type":"insights","items":[{"type":"fact","title":"Fraction reaching systemic circulation","text":"Bioavailability (F) is the fraction of a dose reaching systemic circulation unchanged. It is not the fraction merely entering the gut wall."}],"id":"8-0"},{"type":"recall","items":[{"title":"Bioavailability · F","text":"The fraction of a dose reaching systemic circulation unchanged. Incomplete absorption and first-pass loss may reduce it."},{"title":"Bioequivalence","text":"Comparable rate and extent of drug availability between products under specified study conditions."}],"id":"8-1"},{"type":"insights","items":[{"type":"fact","title":"","text":"A fictional illustration of F, not a measurement method. Clinical studies often estimate F using dose-normalised AUC relative to IV administration."}],"id":"8-2"}],"role":"recall-studio"},{"index":9,"title":"Where does the drug go?","titleHTML":"Where does the drug go?","kicker":"09 / DISTRIBUTION & BINDING","subtitle":"","references":[{"label":"[04] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/drug-distribution/"},{"label":"[14] British Journal of Clinical Pharmacology","url":"https://bpspubs.onlinelibrary.wiley.com/pb-assets/assets/13652125/Guidelines%20on%20Pharmacokinetics%20and%20Pharmacodynamics-1522915986837.pdf"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"FDA / Clinical pharmacology resources","url":"https://www.fda.gov/about-fda/center-drug-evaluation-and-research-cder/office-clinical-pharmacology"}],"blocks":[{"type":"fact","title":"Distribution","text":"Reversible movement between blood and tissues."},{"type":"fact","title":"Unbound / protein-bound drug","text":"Drug can bind plasma proteins. Unbound concentration is often most relevant to membrane passage and target interaction."},{"type":"fact","title":"Volume of distribution · Vd","text":"An apparent volume: amount of drug in the body divided by plasma concentration. It is not a literal body compartment."},{"type":"fact","title":"Tissue barriers","text":"Permeability, blood flow and binding affect access. Entry into the brain is influenced by the blood–brain barrier."},{"type":"fact","title":"","text":"Vd = amount in body ÷ plasma concentration"},{"type":"fact","title":"","text":"e.g. amount / (amount per litre) → litres"}],"art":{"src":"shared/img/art-8234121b896d5926.webp","alt":"Tablets and capsules, for pharmacology"},"prompts":[],"contextNotes":[],"panels":[{"type":"insights","items":[{"type":"fact","title":"Distribution","text":"Reversible movement between blood and tissues."},{"type":"fact","title":"Unbound / protein-bound drug","text":"Drug can bind plasma proteins. Unbound concentration is often most relevant to membrane passage and target interaction."},{"type":"fact","title":"Volume of distribution · Vd","text":"An apparent volume: amount of drug in the body divided by plasma concentration. It is not a literal body compartment."}],"id":"9-0"},{"type":"insights","items":[{"type":"fact","title":"Tissue barriers","text":"Permeability, blood flow and binding affect access. Entry into the brain is influenced by the blood–brain barrier."},{"type":"fact","title":"","text":"Vd = amount in body ÷ plasma concentration"},{"type":"fact","title":"","text":"e.g. amount / (amount per litre) → litres"}],"id":"9-1"}],"role":"editorial-cards"},{"index":10,"title":"Change the molecule. Remove it from the body.","titleHTML":"Change the molecule. Remove it from the body.","kicker":"10 / METABOLISM, EXCRETION & INTERACTIONS","subtitle":"","references":[{"label":"[05] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/drug-metabolism/"},{"label":"[12] IUPHAR • Pharmacology Education Project","u ination with constant clearance and distribution volume. Fraction of eventual level = 1 − 2⁻ⁿ, where n is elapsed half-lives. Intermittent dosing has a different peak/trough pattern. Half-lives Eventual level (%) 0 0.000 1 50.000 2 75.000 3 87.500 4 93.750 5 96.875 6 98.438","id":"13-0"},{"type":"fact","title":"Steady state","text":"Average input and elimination are balanced. Repeated intermittent doses can still produce peaks and troughs."},{"type":"fact","title":"Loading / maintenance","text":"Loading aims to reach a target amount sooner. Maintenance replaces ongoing elimination."},{"type":"fact","title":"","text":"In linear first-order PK, about 4–5 half-lives gives 94–97% of the eventual level after starting a constant input. This is an approximation, not complete equilibrium."}],"art":{"src":"shared/img/art-c807a3ad3aa775fc.webp","alt":"A medicine bottle with tablets"},"prompts":[],"contextNotes":[],"panels":[{"type":"model","model":"infusion","title":"Approach to steady state","assumptions":"Model, assumptions and text table Constant-rate infusion starting at zero; linear first-order elimination with constant clearance and distribution volume. Fraction of eventual level = 1 − 2⁻ⁿ, where n is elapsed half-lives. Intermittent dosing has a different peak/trough pattern. Half-lives Eventual level (%) 0 0.000 1 50.000 2 75.000 3 87.500 4 93.750 5 96.875 6 98.438","id":"13-0"},{"type":"insights","items":[{"type":"fact","title":"Steady state","text":"Average input and elimination are balanced. Repeated intermittent doses can still produce peaks and troughs."},{"type":"fact","title":"Loading / maintenance","text":"Loading aims to reach a target amount sooner. Maintenance replaces ongoing elimination."},{"type":"fact","title":"","text":"In linear first-order PK, about 4–5 half-lives gives 94–97% of the eventual level after starting a constant input. This is an approximation, not complete equilibrium."}],"id":"13-1"}],"role":"interactive-model"},{"index":14,"title":"Binding is not the same as activation.","titleHTML":"Binding is not the same as activation.","kicker":"14 / RECEPTOR INTERACTION LAB","subtitle":"","references":[{"label":"[08] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/receptors/"},{"label":"[03] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/pharmacodynamics/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"FDA / Clinical pharmacology resources","url":"https://www.fda.gov/about-fda/center-drug-evaluation-and-research-cder/office-clinical-pharmacology"}],"blocks":[{"type":"sequence","items":[["Full agonist","Activates the receptor and can produce the reference maximal response in this experimental system."],["Partial agonist","Activates the receptor, but its maximum response is lower than the reference full agonist in the same system."],["Neutral antagonist","Occupies or blocks receptor access without activating it; reduces an agonist’s effect when that agonist is present."]],"label":"Receptor ligands: compare in the same system","id":"14-0"},{"type":"fact","title":"Affinity","text":"The tendency of a ligand to bind to a target."},{"type":"fact","title":"Efficacy","text":"The capacity to generate a response in the specified system."},{"type":"fact","title":"","text":"Agonists activate receptors. A neutral antagonist blocks agonist action without activating the receptor itself."}],"art":{"src":"shared/img/art-c807a3ad3aa775fc.webp","alt":"A medicine bottle with tablets"},"prompts":[],"contextNotes":[],"panels":[{"type":"sequence","items":[["Full agonist","Activates the receptor and can produce the reference maximal response in this experimental system."],["Partial agonist","Activates the receptor, but its maximum response is lower than the reference full agonist in the same system."],["Neutral antagonist","Occupies or blocks receptor access without activating it; reduces an agonist’s effect when that agonist is present."]],"label":"Receptor ligands: compare in the same system","id":"14-0"},{"type":"insights","items":[{"type":"fact","title":"Affinity","text":"The tendency of a ligand to bind to a target."},{"type":"fact","title":"Efficacy","text":"The capacity to generate a response in the specified system."},{"type":"fact","title":"","text":"Agonists activate receptors. A neutral antagonist blocks agonist action without activating the receptor itself."}],"id":"14-1"}],"role":"sequence"},{"index":15,"title":"Potency ≠ efficacy","titleHTML":"Potency ≠ efficacy","kicker":"15 / COMPARE THE CURVES","subtitle":"","references":[{"label":"[09] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/dose-response-relationships/"},{"label":"[03] IUPHAR • Pharmacology Education Project","url":"https://pharmacologyeducation.org/pharmacodynamics/"},{"label":"[14] British Journal of Clinical Pharmacology","url":"https://bpspubs.onlinelibrary.wiley.com/pb-assets/assets/13652125/Guidelines%20on%20Pharmacokinetics%20and%20Pharmacodynamics-1522915986837.pdf"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"FDA / Clinical pharmacology resources","url":"https://www.fda.gov/about-fda/center-drug-evaluation-and-research-cder/office-clinical-pharmacology"}],"blocks":[{"type":"model","model":"response","title":"Compare potency and maximum response","assumptions":"Model, assumptions and text table Hill n = 1; E = Emax × C / (EC50 + C), in one hypothetical experimental system. Concentration is displayed on a logarithmic axis. EC50 refers to half of each curve’s own maximum. Curve Emax (%) EC50 (a.u.) A · solid 100 1 B · dashed 100 10 C · dotted 60 1","id":"15-0"},{"type":"recall","items":[{"title":"Potency · horizontal comparison","text":"A achieves a given response at a lower concentration than B. A lower EC50 indicates greater potency in this comparison."}]},{"type":"recall","items":[{"title":"Efficacy · maximal r
