h for a particular reporting context. This label does not guarantee payment.","example":"","category":"Medical coding terminology","image":"shared/img/art-e383344f8af5a957.webp"},{"form":"Category","meaning":"A grouping in a classification. In ICD-10-CM, categories have three characters.","example":"","category":"Medical coding terminology","image":"shared/img/art-e383344f8af5a957.webp"},{"form":"CDI","meaning":"Clinical documentation integrity: work supporting complete and reliable clinical documentation.","example":"","category":"Medical coding terminology","image":"shared/img/review-b3-clinical-record-thumb.webp"},{"form":"Claim","meaning":"A request to a payer for payment or reimbursement with required administrative and coded data.","example":"","category":"Medical coding terminology","image":"shared/img/review-b3-clinical-record-thumb.webp"},{"form":"Clinical coding","meaning":"Assignment of standardised codes to reportable clinical information using applicable rules.","example":"","category":"Medical coding terminology","image":"shared/img/art-e383344f8af5a957.webp"},{"form":"Clinical documentation","meaning":"Information recorded about assessment, diagnoses, decisions and care.","example":"","category":"Medical coding terminology","image":"shared/img/review-b3-clinical-record-thumb.webp"},{"form":"Clinical terminology","meaning":"A structured vocabulary representing detailed clinical concepts.","example":"","category":"Medical coding terminology","image":"shared/img/review-b3-clinical-record-thumb.webp"},{"form":"Classification","meaning":"A system grouping concepts into defined categories for specified reporting and analytical purposes.","example":"","category":"Medical coding terminology","image":"shared/img/art-e383344f8af5a957.webp"},{"form":"Code first","meaning":"An instruction requiring attention to the order of code assignment under applicable rules.","example":"","category":"Medical coding terminology","image":"shared/img/art-e383344f8af5a957.webp"}
