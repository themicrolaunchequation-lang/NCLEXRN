l does not depict either process.","key":"stomach","src":"shared/img/review-b2-stomach.webp","thumb":"shared/img/review-b2-stomach-thumb.webp","limit":"External organ anchor; not a complete GI route, endoscopy route or depiction of gastritis.","references":[{"title":"NIDDK · Digestive system","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"},{"title":"NLM · Medical word parts","url":"https://medlineplus.gov/appendixa.html"}]},"shared/img/review-b2-blood-cells.webp":{"title":"Blood · haemat/o","what":"A conceptual group of red blood cells, one white blood cell and smaller platelet fragments.","meaning":"Haemat/o or hemat/o refers to blood. Haematology is the field concerned with blood and blood-forming tissues. A red cell, haemoglobin concentration and a platelet count are different things.","remember":"Name the component before naming its change: erythrocyte, red cell; leukocyte, white cell; thrombocytopenia, low platelet count.","key":"blood-cells","src":"shared/img/review-b2-blood-cells.webp","thumb":"shared/img/review-b2-blood-cells-thumb.webp","limit":"Conceptual mixed-cell scene, not a patient smear, normal differential, scale measurement or disease depiction.","references":[{"title":"American Society of Hematology · Blood basics","url":"https://www.hematology.org/education/patients/blood-basics"},{"title":"NLM · Medical word parts","url":"https://medlineplus.gov/appendixa.html"}]},"shared/img/review-b2-kidney.webp":{"title":"Kidney · nephr/o and ren/o","what":"One external kidney, with short hilar vessels and a descending ureter.","meaning":"Nephr/o and ren/o refer to the kidney. Nephritis means kidney inflammation. Nephrectomy means surgical removal of part or all of a kidney. A ureter carries urine toward the bladder.","remember":"Same structure, different ending: nephr/itis versus nephr/ectomy. Ureter and urethra are different structures.","key":"kidney","src":"shared/img/review-b2-kidney.webp","thumb":"shared/img/review-b2-kidney-thumb.webp","limit":"Single external kidney with short hilar vessels and ureter; no nephron, collecting-system detail or stone is depicted.","references":[{"title":"NIDDK · The urinary tract","url":"https://www.niddk.nih.gov/health-information/urologic-diseases/urinary-tract-how-it-works"},{"title":"NLM · Medical word parts","url":"https://medlineplus.gov/appendixa.html"}]},"shared/img/review-b3-tablets.webp":{"title":"Tablet · dosage unit, not a dose label","what":"An invented blister strip with plain tablets. It has no medicine name, strength or identifying imprint.","meaning":"Strength is the amount per dosage unit. Dose is the amount administered at one time. Formulation, route and regimen influence the drug’s journey; appearance cannot supply those details.","remember":"One unit is not always one dose. Read the verified label and instruction; never identify a medicine or strength from colour or shape alone.","key":"tablets","src":"shared/img/review-b3-tablets.webp","thumb":"shared/img/review-b3-tablets-thumb.webp","limit":"Generic fictional product only. Not a medicine identification, prescribing, administration or dosing recommendation.","references":[{"title":"FDA · Generic drug facts","url":"https://www.fda.gov/drugs/generic-drugs/generic-drug-facts"},{"title":"IUPHAR · Clinical pharmacokinetics","url":"https://pharmacologyeducation.org/clinical-pharmacokinetics/"}]}},"font":"Segoe UI"}</script><script type="application/json" id="savedCanvasState">{}</script><script>/* MedLex Canvas Studio: fixed viewport, content-specific slides, self-contained assets. */
