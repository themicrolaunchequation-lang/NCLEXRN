e image is a workflow cue, not a live coding system or an official record.","references":[{"title":"CMS · ICD-10 official files","url":"https://www.cms.gov/medicare/coding-billing/icd-10-codes"}]}},"font":"Segoe UI"}</script><script type="application/json" id="savedCanvasState">{}</script><script>/* MedLex Canvas Studio: fixed viewport, content-specific slides, self-contained assets. */

$('#moreTools').onclick=()=>{popover('Canvas tools','<div class="popover-grid">'+toolDefs.slice(2).map(([id,name])=>'<button data-more-tool="'+id+'">'+icon(id)+'<span>'+name+'</span></button>').join('')+'<button id="mobileOutline">'+icon('grid')+'<span>Slides</span></button><button id="mobileNotes">'+icon('notes')+'<span>Notes</span></button><button id="mobileEdit">'+icon('edit')+'<span>Edit text</span></button><button id="mobileClear">'+icon('clear')+'<span>Clear</span></button></div>');$$('[data-more-tool]',$('#toolPopover')).forEach(b=>b.onclick=()=>toolClick(b.dataset.moreTool));$('#mobileOutline').onclick=outline;$('#mobileNotes').onclick=notes;$('#mobileEdit').onclick=()=>{closePopover();setEditing(!editing);};$('#mobileClear').onclick=clearMenu;};
$('#imageUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>15*1024*1024)return toast('Choose a PNG, JPEG or WebP image below 15 MB.');const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const cv=document.createElement('canvas'),factor=Math.min(1,1400/Math.max(image.width,image.height));cv.width=Math.round(image.width*factor);cv.height=Math.round(image.height*factor);cv.getContext('2d').drawImage(image,0,0,cv.width,cv.height);checkpoint();items().push({id:Date.now()+'',type:'image',x:.3,y:.32,w:.4,h:.4,src:cv.toDataURL('image/webp',.9)});renderInk();save();toast('Image added. Use Pointer to move it.');};image.src=reader.result;};reader.readAsDataURL(f);e.target.value='';};
function exportHTML(){hideImagePreview();hideTooltip();save();const clone=document.documentElement.cloneNode(true);clone.querySelector('#savedCanvasState').textContent=JSON.stringify(state).replace(/<\//g,'<\\/');clone.querySelector('#slideContent').replaceChildren();clone.querySelector('#inkLayer').replaceChildren();clone.querySelector('#toolPopover').hidden=true;clone.querySelector('#studioDialog').removeAttribute('open');clone.querySelector('#toast').classList.remove('visible');clone.querySelector('#stage').classList.remove('is-editing');clone.querySelector('#imageHoverPreview').hidden=true;clone.querySelector('#imageHoverPreview img').removeAttribute('src');clone.querySelector('#imageLightbox').removeAttribute('open');clone.querySelector('#imageLightbox img').removeAttribute('src');clone.querySelector('#studioTooltip').hidden=true;const source='<!doctype html>\n'+clone.outerHTML,blob=new Blob([source],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MedLex-'+cfg.slug+'-Canvas.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Self-contained HTML saved with your notes, edits and annotations.');}
$('#editContent').onclick=()=>{setEditing(!editing);if(!editing)render();};$('#notesButton').onclick=notes;$('#saveButton').onclick=exportHTML;$('#themeButton').onclick=()=>theme(state.mode==='night'?'day':'night');$('#focusButton').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('Fullscreen is unavailable in this browser.'));};$('#prevSlide').onclick=()=>goSlide(state.slide-1);$('#nextSlide').onclick=()=>goSlide(state.slide+1);$('#prevPanel').onclick=()=>goPanel(state.panel-1);$('#nextPanel').onclick=()=>goPanel(state.panel+1);$('#openOutline').onclick=outline;$('#sourcesButton').onclick=sources;$('#lessonSelect').value=cfg.slug;$('#lessonCategory').textContent=cfg.category;$('#lessonSelect').onchange=e=>location.href=e.target.value+'.html';
document.addEventListener('pointerdown',e=>{if(popoverOpen&&!e.target.closest('#toolPopover,.edit-dock'))closePopover();});document.addEventListener('keydown',e=>{if(dialog.open||$('#imageLightbox').open||e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.ctrlKey||e.metaKey){if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoAction():undoAction();}return;}if(e.key==='Escape'){closePopover();setTool('pointer');setEditing(false,false);}if(e.key==='ArrowRight'){e.preventDefault();goSlide(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();goSlide(state.slide-1);}if(e.key==='PageDown'){e.preventDefault();goPanel(state.panel+1);}if(e.key==='PageUp'){e.preventDefault();goPanel(state.panel-1);}if(e.key.toLowerCase()==='n')notes();if(e.key.toLowerCase()==='f')$('#focusButton').click();if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();checkpoint();state.annotations[annotationKey()]=items().filter(a=>a.id!==selected);selected=null;renderInk();save();}});
// Image-only enlargement: hover/focus on desktop, tap on touch screens.
let imagePreviewTimer=null,previewSource=null;
function hideImagePreview(){clearTimeout(imagePreviewTimer);const box=$('#imageHoverPreview');if(box)box.hidden=true;if(previewSource)previewSource.removeAttribute('aria-describedby');previewSource=null;}
function enlargedImageSource(im){const asset=im.dataset.asset,guide=Object.values(cfg.guide||{}).find(g=>g.thumb===asset);return guide&&cfg.assets[guide.src]?data(guide.src):im.currentSrc||im.src;}
function showImagePreview(im,immediate=false){
 hideImagePreview();if(dialog.open||$('#imageLightbox').open||editing||tool!=='pointer')return;
 const reveal=()=>{
  if(!im.isConnected)return;
  const box=$('#imageHoverPreview'),large=$('img',box),r=im.getBoundingClientRect(),pad=16;
  const maxW=Math.min(660,innerWidth-pad*2),maxH=Math.min(570,innerHeight-pad*2),ratio=(im.naturalWidth||600)/(im.naturalHeight||450);
  let w=maxW,h=(w-28)/ratio+28;if(h>maxH){h=maxH;w=(h-28)*ratio+28;}
  let x=r.right+22,y=r.top+(r.height-h)/2;
  if(x+w>innerWidth-pad)x=r.left-w-22;
  if(x<pad){x=Math.max(pad,Math.min(innerWidth-w-pad,r.left+(r.width-w)/2));y=r.top-h-20;if(y<pad)y=r.bottom+20;}
  x=Math.max(pad,Math.min(innerWidth-w-pad,x));y=Math.max(pad,Math.min(innerHeight-h-pad,y));
  large.src=enlargedImageSource(im);large.alt=im.alt;box.style.width=w+'px';box.style.height=h+'px';box.style.left=x+'px';box.style.top=y+'px';box.hidden=false;previewSource=im;im.setAttribute('aria-describedby','imageHoverPreview');
 };
 if(immediate)reveal();else imagePreviewTimer=setTimeout(reveal,180);
}
function imageOnlyDialog(im){hideImagePreview();const lightbox=$('#imageLightbox'),large=$('img',lightbox);large.src=enlargedImageSource(im);large.alt=im.alt;lightbox.showModal();}
function bindImagePreview(im){
 im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','Enlarge teaching image: hover or focus to preview');
 im.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&matchMedia('(hover:hover)').matches)showImagePreview(im);});
 im.addEventListener('pointerleave',()=>{hideImagePreview();});
 im.addEventListener('focus',()=>{if(matchMedia('(hover:hover)').matches)showImagePreview(im,true);});im.addEventListener('blur',hideImagePreview);
 im.onclick=()=>{if(matchMedia('(hover:none)').matches)imageOnlyDialog(im);};
 im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();imageOnlyDialog(im);}if(e.key==='Escape')hideImagePreview();};
}
$('#closeImagePreview').onclick=()=>$('#imageLightbox').close();
$('#imageLightbox').addEventListener('click',e=>{if(e.target===$('#imageLightbox'))$('#imageLightbox').close();});
$('#imageLightbox').addEventListener('close',()=>{$('#imageLightbox img').removeAttribute('src');});

// Compact navigation explains both its purpose and the next teaching view.
function contentViewName(p){
 if(!p)return '';
 if(p.type==='quiz')return plain(p.question.text);
 if(p.type==='insights')return p.items.map(x=>x.title||x.text).join(' · ');
 if(p.type==='visual')return p.items[0]?.alt||'Teaching image';
 if(p.type==='table'||p.type==='record')return 'Compare terms and meanings';
 return {cover:'Lesson introduction',recall:'Recall and reveal the meaning',bank:'Search and practise the word bank',builder:'Build a term and check its meaning',parts:'Inspect the word parts',sequence:'Explore the steps',response:'Write your explanation',regions:'Explore anatomical regions',model:'Explore the interactive teaching model',references:'References and source links',roadmap:'Choose a lesson section'}[p.type]||'Additional teaching content';
}
function setTip(el,text){el.dataset.tooltip=text;el.setAttribute('aria-label',text);el.removeAttribute('title');}
function updateFooterNavigation(){
 const s=cfg.slides[state.slide],n=panels.length,name=contentViewName(current).replace(/\s+/g,' ').trim().slice(0,155);
 const summary=n===1?'This slide has one content view. '+name:'Content view '+(state.panel+1)+' of '+n+': '+name+'. Use these arrows to explore more within this slide.';
 setTip($('#panelCounter'),summary);$('#panelCounter').tabIndex=0;
 $('#panelNavigation').dataset.single=String(n===1);$('#panelNavigation').setAttribute('aria-label','Content views within the current slide');
 setTip($('#prevPanel'),state.panel>0?'Previous content view: '+contentViewName(panels[state.panel-1]).slice(0,150):'You are at the first content view.');
 setTip($('#nextPanel'),state.panel<n-1?'Next content view: '+contentViewName(panels[state.panel+1]).slice(0,150):'You are at the last content view.');
 setTip($('#openOutline'),'Slide overview: search and choose any slide in this lesson.');
 setTip($('#prevSlide'),state.slide>0?'Previous slide: '+cfg.slides[state.slide-1].title:'You are at the first slide.');
 setTip($('#nextSlide'),state.slide<cfg.slides.length-1?'Next slide: '+cfg.slides[state.slide+1].title:'You are at the last slide.');
 const counter=$('.slide-counter');counter.tabIndex=0;setTip(counter,'Slide '+(state.slide+1)+' of '+cfg.slides.length+': '+s.title);
}
let tooltipAnchor=null;
function hideTooltip(){const t=$('#studioTooltip');if(t)t.hidden=true;if(tooltipAnchor)tooltipAnchor.removeAttribute('aria-describedby');tooltipAnchor=null;}
function showTooltip(el){
 if(!el?.dataset.tooltip||dialog.open||$('#imageLightbox').open)return;

}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tooltip]');if(el&&!el.contains(e.relatedTarget))showTooltip(el);});

window.MedLexCanvas={config:cfg,state:()=>JSON.parse(JSON.stringify(state)),goSlide,goPanel,render,resize,getPanels:()=>panels,showAllAnswers:()=>{if(current?.type==='quiz')state.quiz[current.id]=current.question.correct;else if(['recall','bank','builder'].includes(current?.type))conceptState(current).revealed=true;render();},setConcept:n=>{if(current){conceptState(current).at=n;conceptState(current).revealed=true;render();}},getLayout:()=>({width:W,height:H,scale,compact}),setTool,exportHTML,icon};
