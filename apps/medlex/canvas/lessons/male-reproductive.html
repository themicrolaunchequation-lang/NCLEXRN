logy"},{"form":"Digital rectal examination (DRE)","meaning":"Examination through the rectum using a gloved finger, including assessment of the prostate.","example":"","category":"Male reproductive terminology","image":"shared/img/review-b2-bladder-prostate-thumb.webp"},{"form":"Ductus deferens","meaning":"The muscular sperm-transport duct also called the vas deferens.","example":"","category":"Male reproductive terminology","image":"shared/img/art-1c9dbb27c45db0e5.webp"},{"form":"Dysuria","meaning":"Pain or burning with urination.","example":"","category":"Male reproductive terminology"},{"form":"Ejaculation","meaning":"Emission and expulsion of semen through the urethra.","example":"","category":"Male reproductive terminology","image":"shared/img/art-1c9dbb27c45db0e5.webp"},{"form":"Ejaculatory duct","meaning":"Duct formed by the ductus deferens and seminal-vesicle duct, opening into the urethra.","example":"","category":"Male reproductive terminology","image":"shared/img/art-1c9dbb27c45db0e5.webp"},{"form":"Epididymis","meaning":"Coiled duct where sperm undergo maturation and storage. Plural: epididymides.","example":"","category":"Male reproductive terminology","image":"shared/img/art-031167c6a50ac801.webp"},{"form":"Epididymitis","meaning":"Inflammation of the epididymis.","example":"","category":"Male reproductive terminology"},{"form":"Epididymo-orchitis","meaning":"Inflammation involving the epididymis and testis.","example":"","category":"Male reproductive terminology","image":"shared/img/art-031167c6a50ac801.webp"},{"form":"Erectile dysfunction (ED)","meaning":"Difficulty achieving or maintaining an erection sufficient for sexual activity.","example":"","category":"Male reproductive terminology","image":"shared/img/art-fd5f6b5a72875f71.webp"},{"form":"Follicle-stimulating hormone (FSH)","meaning":"Pituitary hormone acting on Sertoli cells and supporting sperm production.","example":"","category":"Male reproductive terminology"},{"form":"Glans penis","meaning":"Enlarged distal end of the penis.","example":"","category":"Male reproductive terminology","image":"shared/img/art-fd5f6b5a72875f71.webp"},{"form":"Gonad","meaning":"An organ producing gametes. The testes are the male gonads.","example":"","category":"Male reproductive terminology","image":"shared/img/art-031167c6a50ac801.webp"},{"form":"Haematospermia / hematospermia","meaning":"Blood in semen. Also called hemospermia.","example":"","category":"Male reproductive terminology"},{"form":"Haematuria / hematuria","meaning":"Blood in urine.","example":"","category":"Male reproductive terminology","image":"shared/img/art-0b9ee70048857d9f.webp"},{"form":"Hydrocele","meaning":"Fluid accumulation around a testis, usually within the tunica vaginalis.","example":"","category":"Male reproductive terminology","image":"shared/img/art-031167c6a50ac801.webp"},{"form":"Hyperplasia","meaning":"Increased cell number.","example":"","category":"Male reproductive terminology","image":"shared/img/5d95160a1c2e841e.webp"},{"form":"Hypertrophy","meaning":"Increased cell size.","example":"","category":"Male reproductive terminology","image":"shared/img/9ad129784b1318dd.webp"},{"form":"Infertility","meaning":"Difficulty achieving pregnancy, evaluated in the context of the individual and couple.","example":"","category":"Male reproductive terminology"},{"form":"Leydig cell","meaning":"Testicular cell that produces testosterone in response to LH.","example":"","category":"Male reproductive terminology","image":"shared/img/art-031167c6a50ac801.webp"},{"form":"Luteinising hormone (LH)","meaning":"Pituitary hormone that stimulates testosterone production by Leydig cells. US spelling: luteinizing.","example":"","category":"Male reproductive terminology","image":"shared/img/art-0b361914f0e5a27b.webp"},{"form":"Lower urinary tract symptoms (LUTS)","meaning":"A group of urinary storage, voiding and post-voiding symptoms.","example":"","category":"Male reproductive terminology","image":"shared/img/r rgement. Ejaculation = emission and expulsion of semen. These are distinct concepts."}],"id":"8-1"}],"role":"editorial-cards"},{"index":9,"title":"Symptoms describe the experience","titleHTML":"Symptoms describe the experience","kicker":"10 / Clinical vocabulary","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607440/"},{"label":"[3]","url":"https://www.niddk.nih.gov/health-information/urologic-diseases/prostate-problems/enlarged-prostate-benign-prostatic-hyperplasia"},{"label":"[7]","url":"https://wtcs.pressbooks.pub/medterm/chapter/6-6-diseases-and-disorders-of-the-male-reproductive-system/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Male reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/male/"}],"blocks":[{"type":"recall","items":[{"title":"dysuria","text":"Pain or burning with urination."}]},{"type":"recall","items":[{"title":"nocturia","text":"Waking from sleep to pass urine."}]},{"type":"recall","items":[{"title":"haematuria / hematuria","text":"Blood in urine. British and American spellings."}]},{"type":"recall","items":[{"title":"haematospermia / hematospermia","text":"Blood in semen. Also called hemospermia."}]},{"type":"recall","items":[{"title":"orchialgia","text":"Testicular pain."}]},{"type":"recall","items":[{"title":"urinary hesitancy","text":"Difficulty starting the urine stream."}]},{"type":"fact","title":"","text":"LUTS = lower urinary tract symptoms. Symptom terms describe findings and experiences. They do not by themselves establish BPH, infection or cancer."}],"art":{"src":"shared/img/art-a8bc313dd25e3bef.webp","alt":"The prostate gland below the bladder, around the urethra"},"prompts":[],"contextNotes":["Medical terminology · Male reproductive system · 10 / 20"],"panels":[{"type":"recall","items":[{"title":"dysuria","text":"Pain or burning with urination."},{"title":"nocturia","text":"Waking from sleep to pass urine."},{"title":"haematuria / hematuria","text":"Blood in urine. British and American spellings."},{"title":"haematospermia / hematospermia","text":"Blood in semen. Also called hemospermia."},{"title":"orchialgia","text":"Testicular pain."},{"title":"urinary hesitancy","text":"Difficulty starting the urine stream."}],"id":"9-0"},{"type":"insights","items":[{"type":"fact","title":"","text":"LUTS = lower urinary tract symptoms. Symptom terms describe findings and experiences. They do not by themselves establish BPH, infection or cancer."}],"id":"9-1"}],"role":"recall-studio"},{"index":10,"title":"Inflammation: where is it?","titleHTML":"Inflammation: where is it?","kicker":"11 / Localise the term","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607440/"},{"label":"[4]","url":"https://www.cdc.gov/std/treatment-guidelines/epididymitis.htm"},{"label":"[7]","url":"https://wtcs.pressbooks.pub/medterm/chapter/6-6-diseases-and-disorders-of-the-male-reproductive-system/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Male reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/male/"}],"blocks":[{"type":"fact","title":"Prostatitis","text":"Inflammation of the prostate. Prostatitis syndromes include bacterial and nonbacterial categories."},{"type":"fact","title":"Epididymitis","text":"Inflammation of the epididymis. Orchitis involves the testis."},{"type":"fact","title":"Epididymo-orchitis","text":"Inflammation involving both the epididymis and testis."},{"type":"fact","title":"Balanitis / urethritis","text":"Inflammation of the glans penis / urethra, respectively."},{"type":"fact","title":"","text":"Inflammation does not automatically identify the organism or mean a sexually transmitted infection. Sudden severe testicular pain needs immediate emergency assessment because testicular torsion is possible."}],"art":{"src":"shared/img/art-a8bc313dd25e3bef.webp","alt":"The prostate gland below the bladder, around the urethra"},"prompts":[],"contextNotes":["Medical terminology · Male reproductive system · 11 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"Prostatitis","text":"Inflammation of the prostate. Prostatitis syndromes include bacterial and nonbacterial categories."},{"type":"fact","title":"Epididymitis","text":"Inflammation of the epididymis. Orchitis involves the testis."},{"type":"fact","title":"Epididymo-orchitis","text":"Inflammation involving both the epididymis and testis."}],"id":"10-0"},{"type":"insights","items":[{"type":"fact","title":"Balanitis / urethritis","text":"Inflammation of the glans penis / urethra, respectively."},{"type":"fact","title":"","text":"Inflammation does not automatically identify the organism or mean a sexually transmitted infection. Sudden severe testicular pain needs immediate emergency assessment because testicular torsion is possible."}],"id":"10-1"}],"role":"editorial-cards"},{"index":11,"title":"Structural changes have distinct names","titleHTML":"Structural changes have distinct names","kicker":"12 / Compare the anatomy","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607440/"},{"label":"[4]","url":"https://www.cdc.gov/std/treatment-guidelines/epididymitis.htm"},{"label":"[7]","url":"https://wtcs.pressbooks.pub/medterm/chapter/6-6-diseases-and-disorders-of-the-male-reproductive-system/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Male reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/male/"}],"blocks":[{"type":"fact","title":"Cryptorchidism","text":"One or both testes have not descended into the scrotum."},{"type":"fact","title":"Hydrocele","text":"Fluid accumulation around a testis, usually within the tunica vaginalis."},{"type":"fact","title":"Varicocele","text":"Abnormally dilated veins in the pampiniform plexus of the spermatic cord."},{"type":"fact","title":"Testicular torsion","text":"Twisting of the spermatic cord that can impair testicular blood flow."},{"type":"fact","title":"","text":"Hydrocele concerns fluid. Varicocele concerns veins. Cryptorchidism concerns position. Torsion concerns twisting and blood supply."}],"art":{"src":"shared/img/art-a8bc313dd25e3bef.webp","alt":"The prostate gland below the bladder, around the urethra"},"prompts":[],"contextNotes":["Medical terminology · Male reproductive system · 12 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"Cryptorchidism","text":"One or both testes have not descended into the scrotum."},{"type":"fact","title":"Hydrocele","text":"Fluid accumulation around a testis, usually within the tunica vaginalis."},{"type":"fact","title":"Varicocele","text":"Abnormally dilated veins in the pampiniform plexus of the spermatic cord."}],"id":"11-0"},{"type":"insights","items":[{"type":"fact","title":"Testicular torsion","text":"Twisting of the spermatic cord that can impair testicular blood flow."},{"type":"fact","title":"","text":"Hydrocele concerns fluid. Varicocele concerns veins. Cryptorchidism concerns position. Torsion concerns twisting and blood supply."}],"id":"11-1"}],"role":"editorial-cards"},{"index":12,"title":"Function & fertility are different","titleHTML":"Function & fertility are different","kicker":"13 / Use precise descriptions","subtitle":"","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607440/"},{"label":"[6]","url":"https://www.niddk.nih.gov/health-information/urologic-diseases/erectile-dysfunction"},{"label":"[9]","url":"https://medlineplus.gov/lab-tests/semen-analysis/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Male reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/male/"}],"blocks":[{"type":"fact","title":"Erectile dysfunction · ED","text":"Difficulty achieving or maintaining an erection sufficient for sexual activity."},{"type":"fact","title":"Infertility","text":"Difficulty achieving pregnancy. Male-factor evaluation considers more than erectile function."},{"type":"fact","title":"Azoospermia","text":"No sperm detected in the ejaculate after appropriate laboratory assessment."},{"type":"fact","title":"Oligozoospermia","text":"Low sperm concentration. Asthenozoospermia concerns motility; teratozoospermia concerns morphology."},{"type":"fact","title":"","text":"An individual can have erections and still have impaired fertility. A single semen result does not fully predict fertility or identify the cause."}],"art":{"src":"shared/img/art-1c9dbb27c45db0e5.webp","alt":"A sperm cell with a head and a long tail"},"prompts":[],"contextNotes":["Medical terminology · Male reproductive system · 13 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"Erectile dysfunction · ED","text":"Difficulty achieving or maintaining an erection sufficient for sexual activity."},{"type":"fact","title":"Infertility","text":"Difficulty achieving pregnancy. Male-factor evaluation considers more than erectile function."},{"type":"fact","title":"Azoospermia","text":"No sperm detected in the ejaculate after appropriate laboratory assessment."}],"id":"12-0"},{"type":"insights","items":[{"type":"fact","title":"Oligozoospermia","text":"Low sperm concentration. Asthenozoospermia concerns motility; teratozoospermia concerns morphology."},{"type":"fact","title":"","text":"An individual can have erections and still have impaired fertility. A single semen result does not fully predict fertility or identify the cause."}],"id":"12-1"}],"role":"editorial-cards"},{"index":13,"title":"The prostate: growth is not a diagnosis","titleHTML":"The prostate: growth is not a diagnosis","kicker":"14 / Compare clinical meanings","subtitle":"","references":[{"label":"[3]","url":"https://www.niddk.nih.gov/health-information/urologic-diseases/prostate-problems/enlarged-prostate-benign-prostatic-hyperplasia"},{"label":"[5]","url":"https://www.cancer.gov/types/prostate/psa-fact-sheet"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NCI / Male reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/male/"}],"blocks":[{"type":"fact","title":"","text":"Conceptual diagram. No size or flow measurements implied."},{"type":"fact","title":"Benign prostatic hyperplasia · BPH","text":"Noncancerous increase in prostate cell number. It may contribute to urinary symptoms."},{"type":"fact","title":"Hyperplasia versus hypertrophy","text":"Hyperplasia = increased cell number. Hypertrophy = increased cell size."},{"type":"fact","title":"Prostate cancer","text":"A malignancy. BPH and cancer are distinct conditions and may coexist."},{"type":"fact","title":"","text":"The prostate surrounds the proximal urethra. Enlargement can narrow this passage. Urinary symptoms alone do not identify the cause."}],"art":{"src":"shared/img/review-b2-bladder-prostate.webp","alt":"Generated conceptual teaching model: bladder prostate."},"prompts":[],"contextNotes":["Medical terminology · Male reproductive system · 14 / 20"],"panels":[{"type":"insights","items":[{"type":"fact","title":"","text":"Conceptual diagram. No size or flow measurements implied."},{"type":"fact","title":"Benign prostatic hyperplasia · BPH","text":"Noncancerous increase in prostate cell number. It may contribute to urinary symptoms."},{"type":"fact","title":"Hyperplasia versus hypertrophy","text":"Hyperplasia = increased cell number. Hypertrophy = increased cell size."}],"id":"13-0"},{"type":"insights","items":[{"type":"fact","title":"Prostate cancer","text":"A malignancy. BPH and cancer are distinct conditions and may coexist."},{"type":"fact","title":"","text":"The prostate surrounds the proximal urethra. Enlargement can narrow this passage. Urinary symptoms alone do not identify the cause."}],"id":"13-1"}],"role":"editorial-cards"},{"index": em · 18 / 20"],"panels":[{"type":"quiz","question":{"text":"Where do sperm mature and undergo storage before entering the ductus deferens?","answers":["Prostate","Epididymis","Seminal vesicle"],"correct":1,"why":"The epididymis supports sperm maturation and storage. Accessory glands contribute fluids to semen."},"id":"17-0"},{"type":"quiz","question":{"text":"Which term indicates absence of sperm in the ejaculate?","answers":["Azoospermia","Haematuria","Balanitis"],"correct":0,"why":"Azoospermia describes no sperm detected after appropriate assessment. Haematuria is blood in urine. Balanitis is inflammation of the glans."},"id":"17-1"},{"type":"quiz","question":{"text":"Which statement about PSA is accurate?","answers":["high result proves cancer","It can rise in benign and malignant conditions","It measures sperm motility"],"correct":1,"why":"PSA can rise with BPH, inflammation and cancer. The result requires clinical interpretation."},"id":"17-2"}],"role":"assessment"},{"index":18,"title":"A compact clinical vocabulary","titleHTML":"A compact clinical vocabulary","kicker":"19 / Consolidation & exit task","subtitle":"Review tomorrow: recall five terms without looking, then revisit the ones you missed.","references":[{"label":"[1]","url":"https://www.ncbi.nlm.nih.gov/books/NBK607440/"},{"label":"NCI / Male reproductive system","url":"https://training.seer.cancer.gov/anatomy/reproductive/male/"},{"label":"[5]","url":"https://www.cancer.gov/types/prostate/psa-fact-sheet"},{"label":"[12]","url":"https://wtcs.pressbooks.pub/medterm/chapter/6-2-word-components-related-to-the-male-reproductive-system/"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"}],"blocks":[{"type":"fact","title":"Find the structure","text":"orch/o: testis · epididym/o: epididymis · prostat/o: prostate."},{"type":"fact","title":"Read the ending","text":"-itis: inflammation · -ectomy: removal · -pexy: fixation."},{"type":"fact","title":"Check the distinction","text":"Sperm and semen differ. ED and infertility differ. BPH and prostate cancer differ."},{"type":"fact","title":"Translate precisely","text":"A symptom is not a cause. A test result is not a diagnosis. Procedure names do not explain every indication."},{"type":"fact","title":"","text":"Exit task: explain epididymitis, orchiopexy and azoospermia in plain language. Then trace sperm from the testis to the external urethral opening."},{"type":"fact","title":"","text":"Review tomorrow: recall five terms without looking, then revisit the ones you missed."},{"type":"bank","items":[{"form":"Andr/o","meaning":"Combining form meaning male.","example":"","category":"Male reproductive terminology"},{"form":"Androgen","meaning":"A hormone, such as testosterone, that supports male reproductive development and function.","example":"","category":"Male reproductive terminology"},{"form":"Asthenozoospermia","meaning":"Reduced sperm motility.","example":"","category":"Male reproductive terminology"},{"form":"Azoospermia","meaning":"No sperm detected in the ejaculate after appropriate laboratory assessment.","example":"","category":"Male reproductive terminology"},{"form":"Balanitis","meaning":"Inflammation of the glans penis.","example":"","category":"Male reproductive terminology"},{"form":"Benign prostatic hyperplasia (BPH)","meaning":"Noncancerous increase in prostate cell number, often associated with enlargement.","example":"","category":"Male reproductive terminology"},{"form":"Biopsy","meaning":"Removal of tissue or cells for examination.","example":"","category":"Male reproductive terminology"},{"form":"Circumcision","meaning":"Surgical removal of the foreskin.","example":"","category":"Male reproductive terminology"},{"form":"Cryptorchidism","meaning":"Failure of one or both testes to descend into the scrotum.","example":"","category":"Male reproductive terminology"},{"form":"Digital rectal examination (DRE)","meaning":"Examination through the rectum using a gloved finger, including assessment of the prostate.","example":"","category":"Male reproductive terminology"},{"form":"Ductus deferens","meaning":"The muscular sperm-transport duct also called the vas deferens.","example":"","category":"Male reproductive terminology"},{"form":"Dysuria","meaning":"Pain or burning with urination.","example":"","category":"Male reproductive terminology"},{"form":"Ejaculation","meaning":"Emission and expulsion of semen through the urethra.","example":"","category":"Male reproductive terminology"},{"form":"Ejaculatory duct","meaning":"Duct formed by the ductus deferens and seminal-vesicle duct, opening into the urethra.","example":"","category":"Male reproductive terminology"},{"form":"Epididymis","meaning":"Coiled duct where sperm undergo maturation and storage. Plural: epididymides.","example":"","category":"Male reproductive terminology"},{"form":"Epididymitis","meaning":"Inflammation of the epididymis.","example":"","category":"Male reproductive terminology"},{"form":"Epididymo-orchitis","meaning":"Inflammation involving the epididymis and testis.","example":"","category":"Male reproductive terminology"},{"form":"Erectile dysfunction (ED)","meaning":"Difficulty achieving or maintaining an erection sufficient for sexual activity.","example":"","category":"Male reproductive terminology"},{"form":"Follicle-stimulating hormone (FSH)","meaning":"Pituitary hormone acting on Sertoli cells and supporting sperm production.","example":"","category":"Male reproductive terminology"},{"form":"Glans penis","meaning":"Enlarged distal end of the penis.","example":"","category":"Male reproductive terminology"},{"form":"Gonad","meaning":"An organ producing gametes. The testes are the male gonads.","example":"","category":"Male reproductive terminology"},{"form":"Haematospermia / hematospermia","meaning":"Blood in semen. Also called hemospermia.","example":"","category":"Male reproductive terminology"},{"form":"Haematuria / hematuria","meaning":"Blood in urine.","example":"","category":"Male reproductive terminology"},{"form":"Hydrocele","meaning":"Fluid accumulation around a testis, usually within the tunica vaginalis.","example":"","category":"Male reproductive terminology"},{"form":"Hyperplasia","meaning":"Increased cell number.","example":"","category":"Male reproductive terminology"},{"form":"Hypertrophy","meaning":"Increased cell size.","example":"","category":"Male reproductive terminology"},{"form":"Infertility","meaning":"Difficulty achieving pregnancy, evaluated in the context of the individual and couple.","example":"","category":"Male reproductive terminology"},{"form":"Leydig cell","meaning":"Testicular cell that produces testosterone in response to LH.","example":"","category":"Male reproductive terminology"},{"form":"Luteinising hormone (LH)","meaning":"Pituitary hormone that stimulates testosterone production by Leydig cells. US spelling: luteinizing.","example":"","category":"Male reproductive terminology"},{"form":"Lower urinary tract symptoms (LUTS)","meaning":"A group of urinary storage, voiding and post-voiding symptoms.","example":"","category":"Male reproductive terminology"},{"form":"Motility","meaning":"Capacity for movement. In semen analysis, a description of sperm movement.","example":"","category":"Male reproductive terminology"},{"form":"Morphology","meaning":"Form and structure. In semen analysis, a description of sperm shape.","example":"","category":"Male reproductive terminology"},{"form":"Nocturia","meaning":"Waking from sleep to pass urine.","example":"","category":"Male reproductive terminology"},{"form":"Oligozoospermia","meaning":"Low sperm concentration. Also commonly called oligospermia.","example":"","category":"Male reproductive terminology"},{"form":"Orchialgia","meaning":"Testicular pain.","example":"","category":"Male reproductive terminology"},{"form":"Orchiectomy / orchidectomy","meaning":"Surgical removal of one or both testes, as specified.","example":"","category":"Male reproductiv $('#moreTools').onclick=()=>{popover('Canvas tools','<div class="popover-grid">'+toolDefs.slice(2).map(([id,name])=>'<button data-more-tool="'+id+'">'+icon(id)+'<span>'+name+'</span></button>').join('')+'<button id="mobileOutline">'+icon('grid')+'<span>Slides</span></button><button id="mobileNotes">'+icon('notes')+'<span>Notes</span></button><button id="mobileEdit">'+icon('edit')+'<span>Edit text</span></button><button id="mobileClear">'+icon('clear')+'<span>Clear</span></button></div>');$$('[data-more-tool]',$('#toolPopover')).forEach(b=>b.onclick=()=>toolClick(b.dataset.moreTool));$('#mobileOutline').onclick=outline;$('#mobileNotes').onclick=notes;$('#mobileEdit').onclick=()=>{closePopover();setEditing(!editing);};$('#mobileClear').onclick=clearMenu;};
$('#imageUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>15*1024*1024)return toast('Choose a PNG, JPEG or WebP image below 15 MB.');const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const cv=document.createElement('canvas'),factor=Math.min(1,1400/Math.max(image.width,image.height));cv.width=Math.round(image.width*factor);cv.height=Math.round(image.height*factor);cv.getContext('2d').drawImage(image,0,0,cv.width,cv.height);checkpoint();items().push({id:Date.now()+'',type:'image',x:.3,y:.32,w:.4,h:.4,src:cv.toDataURL('image/webp',.9)});renderInk();save();toast('Image added. Use Pointer to move it.');};image.src=reader.result;};reader.readAsDataURL(f);e.target.value='';};
function exportHTML(){hideImagePreview();hideTooltip();save();const clone=document.documentElement.cloneNode(true);clone.querySelector('#savedCanvasState').textContent=JSON.stringify(state).replace(/<\//g,'<\\/');clone.querySelector('#slideContent').replaceChildren();clone.querySelector('#inkLayer').replaceChildren();clone.querySelector('#toolPopover').hidden=true;clone.querySelector('#studioDialog').removeAttribute('open');clone.querySelector('#toast').classList.remove('visible');clone.querySelector('#stage').classList.remove('is-editing');clone.querySelector('#imageHoverPreview').hidden=true;clone.querySelector('#imageHoverPreview img').removeAttribute('src');clone.querySelector('#imageLightbox').removeAttribute('open');clone.querySelector('#imageLightbox img').removeAttribute('src');clone.querySelector('#studioTooltip').hidden=true;const source='<!doctype html>\n'+clone.outerHTML,blob=new Blob([source],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MedLex-'+cfg.slug+'-Canvas.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Self-contained HTML saved with your notes, edits and annotations.');}
$('#editContent').onclick=()=>{setEditing(!editing);if(!editing)render();};$('#notesButton').onclick=notes;$('#saveButton').onclick=exportHTML;$('#themeButton').onclick=()=>theme(state.mode==='night'?'day':'night');$('#focusButton').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('Fullscreen is unavailable in this browser.'));};$('#prevSlide').onclick=()=>goSlide(state.slide-1);$('#nextSlide').onclick=()=>goSlide(state.slide+1);$('#prevPanel').onclick=()=>goPanel(state.panel-1);$('#nextPanel').onclick=()=>goPanel(state.panel+1);$('#openOutline').onclick=outline;$('#sourcesButton').onclick=sources;$('#lessonSelect').value=cfg.slug;$('#lessonCategory').textContent=cfg.category;$('#lessonSelect').onchange=e=>location.href=e.target.value+'.html';
document.addEventListener('pointerdown',e=>{if(popoverOpen&&!e.target.closest('#toolPopover,.edit-dock'))closePopover();});document.addEventListener('keydown',e=>{if(dialog.open||$('#imageLightbox').open||e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.ctrlKey||e.metaKey){if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoAction():undoAction();}return;}if(e.key==='Escape'){closePopover();setTool('pointer');setEditing(false,false);}if(e.key==='ArrowRight'){e.preventDefault();goSlide(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();goSlide(state.slide-1);}if(e.key==='PageDown'){e.preventDefault();goPanel(state.panel+1);}if(e.key==='PageUp'){e.preventDefault();goPanel(state.panel-1);}if(e.key.toLowerCase()==='n')notes();if(e.key.toLowerCase()==='f')$('#focusButton').click();if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();checkpoint();state.annotations[annotationKey()]=items().filter(a=>a.id!==selected);selected=null;renderInk();save();}});
// Image-only enlargement: hover/focus on desktop, tap on touch screens.
let imagePreviewTimer=null,previewSource=null;
function hideImagePreview(){clearTimeout(imagePreviewTimer);const box=$('#imageHoverPreview');if(box)box.hidden=true;if(previewSource)previewSource.removeAttribute('aria-describedby');previewSource=null;}
function enlargedImageSource(im){const asset=im.dataset.asset,guide=Object.values(cfg.guide||{}).find(g=>g.thumb===asset);return guide&&cfg.assets[guide.src]?data(guide.src):im.currentSrc||im.src;}
function showImagePreview(im,immediate=false){
 hideImagePreview();if(dialog.open||$('#imageLightbox').open||editing||tool!=='pointer')return;
 const reveal=()=>{
  if(!im.isConnected)return;
  const box=$('#imageHoverPreview'),large=$('img',box),r=im.getBoundingClientRect(),pad=16;
  const maxW=Math.min(660,innerWidth-pad*2),maxH=Math.min(570,innerHeight-pad*2),ratio=(im.naturalWidth||600)/(im.naturalHeight||450);
  let w=maxW,h=(w-28)/ratio+28;if(h>maxH){h=maxH;w=(h-28)*ratio+28;}
  let x=r.right+22,y=r.top+(r.height-h)/2;
  if(x+w>innerWidth-pad)x=r.left-w-22;
  if(x<pad){x=Math.max(pad,Math.min(innerWidth-w-pad,r.left+(r.width-w)/2));y=r.top-h-20;if(y<pad)y=r.bottom+20;}
  x=Math.max(pad,Math.min(innerWidth-w-pad,x));y=Math.max(pad,Math.min(innerHeight-h-pad,y));
  large.src=enlargedImageSource(im);large.alt=im.alt;box.style.width=w+'px';box.style.height=h+'px';box.style.left=x+'px';box.style.top=y+'px';box.hidden=false;previewSource=im;im.setAttribute('aria-describedby','imageHoverPreview');
 };
 if(immediate)reveal();else imagePreviewTimer=setTimeout(reveal,180);
}
function imageOnlyDialog(im){hideImagePreview();const lightbox=$('#imageLightbox'),large=$('img',lightbox);large.src=enlargedImageSource(im);large.alt=im.alt;lightbox.showModal();}
function bindImagePreview(im){
 im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','Enlarge teaching image: hover or focus to preview');
 im.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&matchMedia('(hover:hover)').matches)showImagePreview(im);});
 im.addEventListener('pointerleave',()=>{hideImagePreview();});
 im.addEventListener('focus',()=>{if(matchMedia('(hover:hover)').matches)showImagePreview(im,true);});im.addEventListener('blur',hideImagePreview);
 im.onclick=()=>{if(matchMedia('(hover:none)').matches)imageOnlyDialog(im);};
 im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();imageOnlyDialog(im);}if(e.key==='Escape')hideImagePreview();};
}
$('#closeImagePreview').onclick=()=>$('#imageLightbox').close();
$('#imageLightbox').addEventListener('click',e=>{if(e.target===$('#imageLightbox'))$('#imageLightbox').close();});
$('#imageLightbox').addEventListener('close',()=>{$('#imageLightbox img').removeAttribute('src');});

// Compact navigation explains both its purpose and the next teaching view.
function contentViewName(p){
 if(!p)return '';
 if(p.type==='quiz')return plain(p.question.text);
 if(p.type==='insights')return p.items.map(x=>x.title||x.text).join(' · ');
 if(p.type==='visual')return p.items[0]?.alt||'Teaching image';
 if(p.type==='table'||p.type==='record')return 'Compare terms and meanings';
 return {cover:'Lesson introduction',recall:'Recall and reveal the meaning',bank:'Search and practise the word bank',builder:'Build a term and check its meaning',parts:'Inspect the word parts',sequence:'Explore the steps',response:'Write your explanation',regions:'Explore anatomical regions',model:'Explore the interactive teaching model',references:'References and source links',roadmap:'Choose a lesson section'}[p.type]||'Additional teaching content';
}
function setTip(el,text){el.dataset.tooltip=text;el.setAttribute('aria-label',text);el.removeAttribute('title');}
function updateFooterNavigation(){
 const s=cfg.slides[state.slide],n=panels.length,name=contentViewName(current).replace(/\s+/g,' ').trim().slice(0,155);
 const summary=n===1?'This slide has one content view. '+name:'Content view '+(state.panel+1)+' of '+n+': '+name+'. Use these arrows to explore more within this slide.';
 setTip($('#panelCounter'),summary);$('#panelCounter').tabIndex=0;
 $('#panelNavigation').dataset.single=String(n===1);$('#panelNavigation').setAttribute('aria-label','Content views within the current slide');
 setTip($('#prevPanel'),state.panel>0?'Previous content view: '+contentViewName(panels[state.panel-1]).slice(0,150):'You are at the first content view.');
 setTip($('#nextPanel'),state.panel<n-1?'Next content view: '+contentViewName(panels[state.panel+1]).slice(0,150):'You are at the last content view.');
 setTip($('#openOutline'),'Slide overview: search and choose any slide in this lesson.');
 setTip($('#prevSlide'),state.slide>0?'Previous slide: '+cfg.slides[state.slide-1].title:'You are at the first slide.');
 setTip($('#nextSlide'),state.slide<cfg.slides.length-1?'Next slide: '+cfg.slides[state.slide+1].title:'You are at the last slide.');
 const counter=$('.slide-counter');counter.tabIndex=0;setTip(counter,'Slide '+(state.slide+1)+' of '+cfg.slides.length+': '+s.title);
}
let tooltipAnchor=null;
function hideTooltip(){const t=$('#studioTooltip');if(t)t.hidden=true;if(tooltipAnchor)tooltipAnchor.removeAttribute('aria-describedby');tooltipAnchor=null;}
function showTooltip(el){
 if(!el?.dataset.tooltip||dialog.open||$('#imageLightbox').open)return;

}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tooltip]');if(el&&!el.contains(e.relatedTarget))showTooltip(el);});

window.MedLexCanvas={config:cfg,state:()=>JSON.parse(JSON.stringify(state)),goSlide,goPanel,render,resize,getPanels:()=>panels,showAllAnswers:()=>{if(current?.type==='quiz')state.quiz[current.id]=current.question.correct;else if(['recall','bank','builder'].includes(current?.type))conceptState(current).revealed=true;render();},setConcept:n=>{if(current){conceptState(current).at=n;conceptState(current).revealed=true;render();}},getLayout:()=>({width:W,height:H,scale,compact}),setTool,exportHTML,icon};
