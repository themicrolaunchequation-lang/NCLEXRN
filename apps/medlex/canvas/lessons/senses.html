6.webp","alt":"An eye showing the iris, pupil and optic nerve"},"prompts":[],"contextNotes":[],"panels":[{"type":"sequence","items":[["01 · LIGHT ENTRY","Cornea"],["02 · APERTURE","Pupil within the iris"],["03 · FOCUS","Lens"],["04 · TRANSDUCTION","Retinal receptors and circuits"],["05 · NEURAL OUTPUT","Optic nerve"],["06 · PERCEPTION","Visual pathways → brain"]],"label":"Visual pathway","id":"6-0"},{"type":"insights","items":[{"type":"fact","title":"","text":"Cornea and lens refract light. Retinal circuits convert and process that input; signals then travel through the optic nerve and other visual pathways."}],"id":"6-1"}],"role":"sequence"},{"index":7,"title":"When focusing changes","titleHTML":"When focusing changes","kicker":"07 / REFRACTIVE TERMINOLOGY","subtitle":"","references":[{"label":"[04] NIH • National Eye Institute","url":"https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/refractive-errors"},{"label":"NLM / Medical word parts","url":"https://medlineplus.gov/appendixa.html"},{"label":"NIH / How the eyes work","url":"https://www.nei.nih.gov/learn-about-eye-health/healthy-vision/how-eyes-work"}],"blocks":[{"type":"recall","items":[{"title":"Myopia · short-sightedness","text":"Distant objects appear blurred. With relaxed accommodation, light focuses in front of the retina."}]},{"type":"recall","items":[{"title":"Hyperopia · long-sightedness","text":"Without enough accommodation, light focuses behind the retina. Near tasks are often difficult; distance may also blur."}]},{"type":"recall","items":[{"title":"Astigmatism","text":"Unequal curvature of the cornea or lens causes blurred or distorted vision."}]},{"type":"recall","items":[{"title":"Presbyopia","text":"Age-related loss of near-focusing ability because the lens becomes less flexible."}]},{"type":"fact","title":"","text":"Presbyopia and hyperopia both affect near vision, but they describe different optical problems."}],"art":{"src":"shared/img/art-f9710eef4c890b56.webp","alt": e and function linked: cornea and lens help focus light; retina converts light input into signals. This model is an organ anchor, not a refraction diagram.","key":"eye","src":"shared/img/review-b2-eye.webp","thumb":"shared/img/review-b2-eye-thumb.webp","limit":"External globe with anterior features; lens and retinal layers are not visible. Not a refraction diagram.","references":[{"title":"National Eye Institute · How eyes work","url":"https://www.nei.nih.gov/eye-health-information/healthy-vision/how-eyes-work"},{"title":"NLM · Medical word parts","url":"https://medlineplus.gov/appendixa.html"}]},"shared/img/review-b2-inner-ear.webp":{"title":"Inner ear · hearing and balance","what":"A conceptual inner-ear model showing a coiled cochlea, vestibular structures and looped canals.","meaning":"The cochlea participates in hearing. Vestibular structures contribute to balance. Ot/o names the ear; audi/o concerns hearing. The full ear also includes outer and middle regions that are not shown here.","remember":"Hearing and balance are different roles. Tinnitus names perceived sound; vertigo names a false movement sensation.","key":"inner-ear","src":"shared/img/review-b2-inner-ear.webp","thumb":"shared/img/review-b2-inner-ear-thumb.webp","limit":"Conceptual inner-ear organ anchor; not the complete outer/middle/inner ear, a labelled labyrinth map or hearing-loss test.","references":[{"title":"NIDCD · How we hear","url":"https://www.nidcd.nih.gov/health/how-do-we-hear"},{"title":"NLM · Medical word parts","url":"https://medlineplus.gov/appendixa.html"}]},"shared/img/review-b3-bacterium.webp":{"title":"Bacterium · bacteri/o","what":"A stylised rod-shaped bacterium with surface projections. It is a generic concept model, not an identified organism.","meaning":"Bacteri/o relates to bacteria. Bacteriology is their study; bacteremia means bacteria in the bloodstream. Bacterial presence, active disease and sepsis are different statements.","remember":"Name the agent first, then expla
