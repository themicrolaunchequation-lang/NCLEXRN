<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(/NCLEXRN/site/assets/fonts/fraunces-var.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Geist;src:url(/NCLEXRN/site/assets/fonts/geist-var.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050A18}
body{font-family:Geist,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;display:none}
.abs{position:absolute}
.bokeh{position:absolute;border-radius:50%;filter:blur(30px);mix-blend-mode:screen}
.dev{position:absolute;transform-style:preserve-3d}
.bezel{position:absolute;inset:0;border-radius:2.2%/3.4%;background:#0B0F17;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08) inset}
.screen{position:absolute;overflow:hidden;background:#111;border-radius:6px}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sweep{position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);pointer-events:none}
.base{position:absolute;background:linear-gradient(#2A3140,#11151E);border-radius:0 0 18px 18px}
.phone{position:absolute;border-radius:14%/6.5%;background:#0B0F17;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.1) inset;overflow:hidden}
.phone img{position:absolute;left:4%;top:2%;width:92%;height:96%;object-fit:cover;border-radius:11%/5%}
.cap{position:absolute;left:0;right:0;text-align:center;font-family:Fraunces,serif;font-weight:500;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.35em .9em;border-radius:999px;font-family:Geist;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.label{position:absolute;padding:.3em .8em;border-radius:8px;background:rgba(10,14,22,.82);border:1px solid rgba(255,255,255,.35);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.big{font-family:Fraunces,serif;font-weight:600;letter-spacing:-.02em;line-height:1.02}
.ch{display:inline-block;white-space:pre}
.badge{display:grid;place-items:center;border-radius:24%;font-family:Fraunces;font-weight:700;color:#fff}
.tile{position:absolute;display:grid;place-items:center;border-radius:22%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.tile svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel{position:absolute;border-radius:28px;padding:4%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);backdrop-filter:blur(2px)}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.10}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
</style></head>
<body><div id="stage"></div><canvas id="grain"></canvas><div id="vig"></div><div id="flash"></div>
